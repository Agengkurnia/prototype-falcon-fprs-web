<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Input Pembayaran - Falcon SFA Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
    <style>
        .outlet-banner {
            background: linear-gradient(135deg, #004d35, #005D41);
            color: #fff;
            padding: 16px;
        }
        .outlet-banner .name { font-size: 16px; font-weight: 700; }
        .outlet-banner .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
        .outstanding-badge {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .outstanding-badge .amount { font-size: 18px; font-weight: 700; color: #FFE57A; }

        .invoice-item {
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s;
        }
        .invoice-item.selected { border-color: var(--color-primary); background: var(--color-bg-light); }
        .invoice-item input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--color-primary); cursor: pointer; flex-shrink: 0; }
        .invoice-info { flex: 1; }
        .invoice-no { font-size: 13px; font-weight: 700; color: var(--color-black); }
        .invoice-meta { font-size: 11px; color: var(--color-gray); margin-top: 2px; }
        .invoice-balance { font-size: 14px; font-weight: 700; color: #dc3545; white-space: nowrap; }

        .section-title {
            font-size: 13px; font-weight: 700; color: var(--color-gray);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin: 16px 0 8px;
        }

        .method-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px;
        }
        .method-btn {
            border: 1.5px solid var(--color-border);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gray);
            transition: all 0.2s;
            background: #fff;
        }
        .method-btn.active {
            border-color: var(--color-primary);
            background: var(--color-bg-light);
            color: var(--color-primary);
        }
        .method-btn i { display: block; font-size: 20px; margin-bottom: 4px; }

        .photo-box {
            width: 100%; height: 160px;
            background: #f0f2f5; border-radius: 10px;
            border: 2px dashed var(--color-border);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: border-color 0.2s; overflow: hidden;
        }
        .photo-box:active { border-color: var(--color-primary); }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .photo-box .placeholder { color: var(--color-gray); text-align: center; font-size: 13px; }
        .photo-box .placeholder i { font-size: 32px; display: block; margin-bottom: 6px; }

        .nominal-input-group {
            background: #fff;
            border: 1.5px solid var(--color-border);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex; align-items: center; gap: 8px;
            transition: border-color 0.2s;
        }
        .nominal-input-group:focus-within { border-color: var(--color-primary); }
        .nominal-input-group span { font-size: 16px; font-weight: 700; color: var(--color-gray); }
        .nominal-input-group input {
            border: none; outline: none; font-size: 20px; font-weight: 700;
            color: var(--color-black); flex: 1; background: transparent;
        }

        .bottom-action {
            position: sticky; bottom: 0; background: #fff;
            border-top: 1px solid var(--color-border);
            padding: 14px 16px;
        }
    </style>
</head>
<body style="background:#f7f9fa;">
<div class="mobile-wrapper">
    <div class="mobile-header">
        <button class="header-action" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <span class="header-title">Input Pembayaran</span>
        <div style="width:36px;"></div>
    </div>

    <div class="mobile-content no-nav" style="padding-bottom:80px;">

        <!-- Outlet Banner -->
        <div class="outlet-banner">
            <div class="name" id="outletName">-</div>
            <div class="sub" id="outletCode">-</div>
            <div class="outstanding-badge">
                <span>Total Outstanding</span>
                <span class="amount" id="totalOutstanding">Rp0</span>
            </div>
        </div>

        <div class="p-16">

            <!-- Invoice List -->
            <div class="section-title">Pilih Invoice yang Dibayar</div>
            <div id="invoiceList"></div>

            <!-- Nominal Input -->
            <div class="section-title">Nominal Pembayaran</div>
            <div class="nominal-input-group">
                <span>Rp</span>
                <input type="number" id="nominalInput" placeholder="0" oninput="onNominalChange()"/>
            </div>
            <p style="font-size:11px; color:var(--color-gray); margin-top:4px;">
                Total terpilih: <strong id="selectedTotal">Rp0</strong>
            </p>

            <!-- Metode Pembayaran -->
            <div class="section-title">Metode Pembayaran</div>
            <div class="method-grid">
                <div class="method-btn active" id="methodTunai" onclick="selectMethod('Tunai')">
                    <i class="fas fa-money-bill-wave"></i>Tunai
                </div>
                <div class="method-btn" id="methodTransfer" onclick="selectMethod('Transfer Bank')">
                    <i class="fas fa-university"></i>Transfer Bank
                </div>
                <div class="method-btn" id="methodGiro" onclick="selectMethod('Giro')">
                    <i class="fas fa-file-invoice"></i>Giro
                </div>
                <div class="method-btn" id="methodCek" onclick="selectMethod('Cek')">
                    <i class="fas fa-check-square"></i>Cek
                </div>
            </div>

            <!-- Bukti Foto (tampil jika non-tunai) -->
            <div id="photoSection" class="d-none">
                <div class="section-title">Foto Bukti Pembayaran</div>
                <div class="photo-box" id="photoBox" onclick="capturePhoto()">
                    <div class="placeholder" id="photoPlaceholder">
                        <i class="fas fa-camera"></i>
                        Klik untuk ambil foto bukti
                    </div>
                    <img src="" id="photoPreview" class="d-none" alt="Bukti"/>
                </div>
                <input type="file" id="fileInput" accept="image/*" capture="environment" class="d-none" onchange="onFileSelected(event)"/>
            </div>

            <!-- Catatan -->
            <div class="section-title">Catatan (opsional)</div>
            <textarea class="form-control" id="notesInput" rows="2" placeholder="Tulis catatan..." style="font-size:13px; border-radius:10px;"></textarea>
        </div>
    </div>

    <!-- Bottom Action -->
    <div class="bottom-action">
        <button class="btn-mobile-primary" onclick="submitPayment()">
            <i class="fas fa-save me-2"></i>Simpan Pembayaran
        </button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../wwwroot/js/sfa-store.js"></script>
<script>
    let customerId = null;
    let selectedMethod = 'Tunai';
    let selectedInvoiceIds = [];
    let photoData = null;

    $(document).ready(function() {
        const params = new URLSearchParams(window.location.search);
        customerId = params.get('customerId');

        if (!customerId) {
            Swal.fire('Error', 'Customer ID tidak ditemukan.', 'error').then(() => history.back());
            return;
        }

        const cust = SfaStore.getCustomerById(customerId);
        const outstanding = SfaStore.getOutstandingByCustomerId(customerId);

        $('#outletName').text(cust ? cust.name : customerId);
        $('#outletCode').text(customerId);
        $('#totalOutstanding').text(SfaStore.formatRupiah(outstanding));

        renderInvoices();
    });

    function renderInvoices() {
        const invoices = SfaStore.getCollectionsByCustomerId(customerId).filter(c => c.balance > 0);
        const container = $('#invoiceList');
        container.empty();

        if (invoices.length === 0) {
            container.html('<p class="text-muted" style="font-size:13px;">Tidak ada invoice outstanding.</p>');
            return;
        }

        invoices.forEach(inv => {
            container.append(`
                <div class="invoice-item" id="inv_${inv.id}">
                    <input type="checkbox" id="chk_${inv.id}" onchange="toggleInvoice('${inv.id}', this.checked)"/>
                    <div class="invoice-info">
                        <div class="invoice-no">${inv.invoiceNo}</div>
                        <div class="invoice-meta">Tgl: ${inv.invoiceDate} • Jatuh tempo: ${inv.dueDate}</div>
                    </div>
                    <div class="invoice-balance">${SfaStore.formatRupiah(inv.balance)}</div>
                </div>
            `);
        });
    }

    function toggleInvoice(id, checked) {
        if (checked) {
            if (!selectedInvoiceIds.includes(id)) selectedInvoiceIds.push(id);
            $(`#inv_${id}`).addClass('selected');
        } else {
            selectedInvoiceIds = selectedInvoiceIds.filter(x => x !== id);
            $(`#inv_${id}`).removeClass('selected');
        }
        updateSelectedTotal();
    }

    function updateSelectedTotal() {
        const collections = SfaStore.getCollectionsByCustomerId(customerId);
        let total = 0;
        selectedInvoiceIds.forEach(id => {
            const inv = collections.find(c => c.id === id);
            if (inv) total += inv.balance;
        });
        $('#selectedTotal').text(SfaStore.formatRupiah(total));
        if (!$('#nominalInput').val()) {
            $('#nominalInput').val(total > 0 ? total : '');
        }
    }

    function onNominalChange() { /* user override, no auto-fill */ }

    function selectMethod(method) {
        selectedMethod = method;
        $('.method-btn').removeClass('active');
        const idMap = { 'Tunai': 'methodTunai', 'Transfer Bank': 'methodTransfer', 'Giro': 'methodGiro', 'Cek': 'methodCek' };
        $(`#${idMap[method]}`).addClass('active');

        if (method !== 'Tunai') {
            $('#photoSection').removeClass('d-none');
        } else {
            $('#photoSection').addClass('d-none');
            photoData = null;
            $('#photoPreview').addClass('d-none').attr('src', '');
            $('#photoPlaceholder').removeClass('d-none');
        }
    }

    function capturePhoto() {
        $('#fileInput').click();
    }

    function onFileSelected(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            photoData = e.target.result;
            $('#photoPreview').attr('src', photoData).removeClass('d-none');
            $('#photoPlaceholder').addClass('d-none');
        };
        reader.readAsDataURL(file);
    }

    function submitPayment() {
        const nominal = parseFloat($('#nominalInput').val());
        if (!nominal || nominal <= 0) {
            Swal.fire('Nominal Kosong', 'Masukkan nominal pembayaran yang valid.', 'warning');
            return;
        }
        if (selectedInvoiceIds.length === 0) {
            Swal.fire('Invoice Belum Dipilih', 'Pilih minimal satu invoice yang akan dibayar.', 'warning');
            return;
        }
        if (selectedMethod !== 'Tunai' && !photoData) {
            Swal.fire('Foto Diperlukan', 'Upload foto bukti pembayaran untuk metode non-tunai.', 'warning');
            return;
        }

        Swal.fire({
            title: 'Simpan Pembayaran?',
            html: `Nominal: <strong>${SfaStore.formatRupiah(nominal)}</strong><br>Metode: <strong>${selectedMethod}</strong>`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#005D41',
            confirmButtonText: 'Simpan',
            cancelButtonText: 'Batal'
        }).then(result => {
            if (result.isConfirmed) {
                SfaStore.saveCollection({
                    customerId: customerId,
                    invoiceIds: selectedInvoiceIds,
                    paidAmount: nominal,
                    method: selectedMethod,
                    evidencePhoto: photoData || null,
                    notes: $('#notesInput').val()
                });

                Swal.fire({
                    icon: 'success',
                    title: 'Pembayaran Disimpan',
                    text: 'Data penagihan ditambahkan ke antrean sinkronisasi.',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'collection_list.html';
                });
            }
        });
    }
</script>
</body>
</html>
