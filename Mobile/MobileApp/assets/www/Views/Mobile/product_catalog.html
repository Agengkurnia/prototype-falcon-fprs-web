<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Katalog Produk - Falcon SFA Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
    <style>
        /* Header SimpliDOTS Style with Kalbe Green */
        .mobile-header-red {
            background: #005D41; color: #fff;
            height: 56px; display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px;
            position: sticky; top: 0; z-index: 100;
        }
        .header-action-white {
            background: transparent; border: none; color: #fff;
            font-size: 18px; cursor: pointer; padding: 4px;
        }
        .header-title-white {
            font-weight: 700; font-size: 18px; flex: 1; margin-left: 16px;
        }

        .search-bar {
            padding: 12px 16px; background: #fff;
            border-bottom: 1px solid var(--color-border);
            position: sticky; top: 56px; z-index: 90;
        }
        .search-box {
            background: var(--color-gray-light); border-radius: 20px;
            display: flex; align-items: center; padding: 0 14px;
        }
        .search-box input {
            border: none; background: transparent;
            padding: 10px 8px; width: 100%; font-size: 14px; outline: none;
        }
        
        .category-scroll {
            display: flex; gap: 8px; padding: 10px 16px;
            overflow-x: auto; scrollbar-width: none;
            background: #fff; border-bottom: 1px solid var(--color-border);
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        
        .cat-chip {
            padding: 6px 14px; border-radius: 16px; font-size: 12px;
            font-weight: 600; border: 1px solid var(--color-border);
            background: #fff; color: var(--color-gray);
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .cat-chip.active {
            background: #005D41; color: #fff; border-color: #005D41;
        }

        /* Filter Row Styles */
        .filter-row {
            background: #fff; padding: 8px 16px;
            border-bottom: 1px solid var(--color-border);
            display: flex; gap: 8px; overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        .filter-chip {
            background: #fff; border: 1px solid var(--color-border);
            padding: 6px 12px; border-radius: 20px; font-size: 12px;
            color: var(--color-gray); font-weight: 500;
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap; cursor: pointer;
        }

        /* Cetak Row */
        .action-row {
            padding: 12px 16px 6px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .btn-print-outline {
            background: #fff; color: #005D41; border: 1px solid #005D41;
            padding: 6px 12px; border-radius: 6px; font-size: 12px;
            font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .btn-print-outline:active {
            background: #EBF8F4;
        }
        .product-count-label {
            font-size: 12px; color: var(--color-gray); font-weight: 600;
        }

        /* List Cards */
        .product-list-container {
            padding: 0 16px 16px 16px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .product-card {
            background: #fff; border: 1px solid var(--color-border);
            border-radius: 12px; padding: 14px;
            text-decoration: none; color: inherit; display: flex;
            flex-direction: column; position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: transform 0.1s;
        }
        .product-card:active { transform: scale(0.98); }

        .product-top-info {
            display: flex; align-items: center; gap: 12px;
            position: relative; margin-bottom: 12px;
        }
        .product-card-img {
            width: 46px; height: 46px; object-fit: contain;
            background: var(--color-bg-light); border-radius: 6px;
            padding: 4px;
        }
        .product-card-fallback-icon {
            width: 46px; height: 46px; display: flex;
            align-items: center; justify-content: center;
            background: var(--color-bg-light); border-radius: 6px;
            color: #005D41; font-size: 20px;
        }
        .product-card-text {
            flex: 1; padding-right: 90px;
        }
        .product-card-code {
            font-size: 11px; font-weight: 600; color: var(--color-gray);
            margin-bottom: 2px;
        }
        .product-card-name {
            font-size: 13px; font-weight: 700; color: var(--color-black);
            line-height: 1.3; text-transform: uppercase;
        }
        .product-focus-badge {
            position: absolute; top: 0; right: 0;
            background: #F0F4F8; color: #34495E;
            font-size: 10px; font-weight: 700; padding: 3px 8px;
            border-radius: 4px; display: flex; align-items: center; gap: 4px;
        }

        .product-divider {
            height: 1px; background-color: var(--color-border);
            margin-bottom: 10px; width: 100%;
        }

        /* Grid UOM Table */
        .product-uom-table {
            width: 100%; border-collapse: collapse; font-size: 11px;
            text-align: center;
        }
        .product-uom-table th {
            font-weight: 500; color: var(--color-gray);
            padding: 3px 4px; font-size: 10px; text-transform: uppercase;
        }
        .product-uom-table th:first-child, .product-uom-table td:first-child {
            text-align: left; width: 60px; color: var(--color-gray);
            font-weight: 500;
        }
        .product-uom-table td {
            padding: 5px 4px; font-weight: 700; color: var(--color-black);
        }
        .product-uom-table .stok-row {
            background-color: #EBF8F4;
        }
        .product-uom-table .stok-row td {
            color: #27AE60;
        }
        .product-uom-table .stok-row td:first-child {
            border-top-left-radius: 4px; border-bottom-left-radius: 4px;
            padding-left: 6px;
        }
        .product-uom-table .stok-row td:last-child {
            border-top-right-radius: 4px; border-bottom-right-radius: 4px;
        }
        .product-uom-table .harga-row td {
            color: #555; padding-top: 6px;
        }

        /* .empty-state styling now lives in shared mobile.css */

        /* Bottom Sheet Backdrop */
        .bottom-sheet-backdrop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        /* Bottom Sheet Box */
        .bottom-sheet {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: #fff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 1001;
            transform: translateY(100%);
            transition: transform 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
            padding: 20px 20px 24px 20px;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
            display: none;
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }
        .bottom-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .bottom-sheet-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--color-black);
            text-transform: uppercase;
        }
        .bottom-sheet-close {
            background: none; border: none;
            font-size: 18px; color: var(--color-gray);
            cursor: pointer; padding: 4px;
        }
        .sheet-input-group {
            display: flex; gap: 12px; margin-bottom: 20px;
        }
        .sheet-input-col {
            flex: 1; text-align: center;
        }
        .sheet-input-col label {
            font-size: 10px; color: var(--color-gray); font-weight: 700; margin-bottom: 6px; display: block;
        }
        .sheet-input-col input {
            width: 100%; border: 1px solid var(--color-border); border-radius: 8px;
            padding: 10px; text-align: center; font-size: 16px; font-weight: 700; outline: none;
            background: var(--color-gray-light); transition: border-color 0.2s, background 0.2s;
        }
        .sheet-input-col input:focus {
            border-color: var(--color-primary); background: #fff;
        }

        /* Restock Card Flow */
        .restock-card {
            background: #fff;
            border: 1px dashed rgba(0, 93, 65, 0.25);
            border-radius: 12px;
            padding: 14px;
            margin: 12px 16px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        /* Floating Restock Bar (Gojek-style) */
        .floating-restock-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 93, 65, 0.08);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px 20px 20px 20px;
            box-shadow: 0 -8px 24px rgba(0, 93, 65, 0.08);
            z-index: 95;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .restock-status-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
        }
        .status-not-started {
            background: #FEEBEE; color: #C62828;
        }
        .status-started {
            background: #E8F5E9; color: #2E7D32;
        }
        .btn-restock-action {
            background: #005D41;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 93, 65, 0.15);
        }
        .btn-restock-action:active {
            background: #004530;
            transform: scale(0.96);
            box-shadow: 0 2px 6px rgba(0, 93, 65, 0.1);
        }

        /* Stock History Styles */
        .history-item {
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .history-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .history-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .history-time {
            font-size: 11px;
            color: var(--color-gray);
            font-weight: 500;
        }
        .history-type-badge {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-inbound {
            background: #E8F5E9; color: #2E7D32;
        }
        .badge-outbound {
            background: #FFEBEE; color: #C62828;
        }
        .badge-system {
            background: #EAF1FB; color: #1F4E79;
        }
        .history-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--color-black);
            margin-bottom: 4px;
        }
        .history-details {
            font-size: 11px;
            color: #555;
            padding-left: 8px;
            border-left: 2px solid var(--color-border);
            line-height: 1.4;
        }
    </style>
</head>
<body style="background:#f7f9fa;">
<div class="mobile-wrapper">
    <!-- SimpliDOTS SFA Header -->
    <div class="mobile-header-red">
        <button class="header-action-white" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <span class="header-title-white">Stok Motoris</span>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="header-action-white" onclick="openHistorySheet()"><i class="fas fa-history"></i></button>
            <button class="header-action-white"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <!-- Search Input -->
    <div class="search-bar">
        <div class="search-box">
            <i class="fas fa-search" style="color:var(--color-gray);"></i>
            <input type="text" id="searchInput" placeholder="Cari nama atau kode produk..." oninput="renderGrid()"/>
        </div>
    </div>

    <!-- Category Chips -->
    <div class="category-scroll" id="categoryChips"></div>

    <!-- Filter Options -->
    <div class="filter-row">
        <div class="filter-chip">
            <i class="fas fa-sliders-h"></i> Filter
        </div>
        <div class="filter-chip">
            Status <i class="fas fa-chevron-down" style="font-size: 8px;"></i>
        </div>
        <div class="filter-chip">
            Urut berdasarkan <i class="fas fa-chevron-down" style="font-size: 8px;"></i>
        </div>
    </div>

    <!-- Main Content List -->
    <div class="mobile-content no-nav" style="padding-top: 0; padding-bottom: 100px;">
        <!-- Actions Row -->
        <div class="action-row">
            <button class="btn-print-outline" onclick="window.print()"><i class="fas fa-print"></i> Cetak Opname</button>
            <span class="product-count-label" id="productCountLabel">Jumlah: 0</span>
        </div>

        <div class="product-list-container" id="productGrid"></div>
    </div>

    <!-- Floating Restock Bar (Gojek-style) -->
    <div class="floating-restock-bar" id="restockContainer"></div>

    <!-- Bottom Sheet Backdrop & Container -->
    <div class="bottom-sheet-backdrop" id="sheetBackdrop" onclick="closeBottomSheet()"></div>
    <div class="bottom-sheet" id="stockSheet">
        <div class="bottom-sheet-header">
            <span class="bottom-sheet-title" id="sheetProductName">Nama Produk</span>
            <button class="bottom-sheet-close" onclick="closeBottomSheet()"><i class="fas fa-times"></i></button>
        </div>
        <div style="font-size: 12px; color: #7B6F72; margin-bottom: 18px; line-height: 1.4;">
            Sesuaikan jumlah fisik barang yang berada di motor Anda saat ini.
        </div>
        <input type="hidden" id="sheetProductCode">
        <div class="sheet-input-group">
            <div class="sheet-input-col">
                <label>KARTON</label>
                <input type="number" id="inputKarton" min="0" value="0">
            </div>
            <div class="sheet-input-col">
                <label>BOX</label>
                <input type="number" id="inputBox" min="0" value="0">
            </div>
            <div class="sheet-input-col">
                <label>PCS</label>
                <input type="number" id="inputPcs" min="0" value="0">
            </div>
        </div>
        <button class="btn-mobile-primary" onclick="saveStockAdjustment()">Simpan Penyesuaian</button>
    </div>

    <!-- History Bottom Sheet Backdrop & Container -->
    <div class="bottom-sheet-backdrop" id="historyBackdrop" onclick="closeHistorySheet()"></div>
    <div class="bottom-sheet" id="historySheet" style="max-height: 80%; overflow-y: auto;">
        <div class="bottom-sheet-header">
            <span class="bottom-sheet-title"><i class="fas fa-history" style="color: var(--color-primary); margin-right: 6px;"></i> Riwayat Mutasi Stok</span>
            <button class="bottom-sheet-close" onclick="closeHistorySheet()"><i class="fas fa-times"></i></button>
        </div>
        <div style="font-size: 11px; color: #7B6F72; margin-bottom: 16px;">
            Daftar penyesuaian (masuk/keluar) stok motor Anda hari ini.
        </div>
        <div id="historyList" style="display: flex; flex-direction: column; max-height: 380px; overflow-y: auto; padding-right: 4px;">
            <!-- Will be dynamically populated -->
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../wwwroot/js/sfa-store.js"></script>
<script>
    let currentCat = 'Semua';
    let restockState = localStorage.getItem('restock_state') || 'idle'; 
    let tempAdjustments = JSON.parse(localStorage.getItem('temp_restock_adjustments')) || {}; 
    
    // Seed and load history entries
    const defaultHistory = [
        {
            time: '08:00',
            type: 'system',
            title: 'Stok Awal Mulai Kerja',
            details: [
                'Morinaga Chil*Kid Gold: 36 Karton (Sesuai)',
                'Morinaga Chil*School Gold: 15 Karton, 2 Box, 5 Pcs (Sesuai)'
            ]
        },
        {
            time: '10:15',
            type: 'outbound',
            title: 'Penjualan: Toko Kelontong Berkah',
            details: [
                'Morinaga Chil*School Gold: -3 Karton, -1 Box'
            ]
        },
        {
            time: '11:30',
            type: 'outbound',
            title: 'Penjualan: Warung Ibu Siti',
            details: [
                'Milna Bubur Bayi Beras Merah: -12 Pcs'
            ]
        }
    ];
    if (!localStorage.getItem('restock_history')) {
        localStorage.setItem('restock_history', JSON.stringify(defaultHistory));
    }
    let historyEntries = JSON.parse(localStorage.getItem('restock_history'));

    $(document).ready(function() {
        buildChips();
        renderGrid();
        updateRestockUI();
    });

    function updateRestockUI() {
        const container = $('#restockContainer');
        container.empty();

        if (restockState === 'idle') {
            container.html(`
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;">
                    <div style="flex: 1;">
                        <span class="restock-status-badge status-not-started" style="margin-bottom: 2px;"><i class="fas fa-times-circle"></i> Belum Check-in</span>
                        <div style="font-size:11px; color:#555; font-weight:500;">Kulakan di Grosir/Stokis</div>
                    </div>
                    <button class="btn-restock-action" style="padding: 10px 16px; font-size:12px; margin-top:0;" onclick="startCheckIn()">
                        <i class="fas fa-map-marker-alt"></i> Check-in GPS
                    </button>
                </div>
            `);
        } else if (restockState === 'checked_in') {
            container.html(`
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;">
                    <div style="flex: 1;">
                        <span class="restock-status-badge status-started" style="margin-bottom: 2px;"><i class="fas fa-check-circle"></i> GPS Valid</span>
                        <div style="font-size:11px; color:#555; font-weight:500;">Grosir Sinar Jaya</div>
                    </div>
                    <button class="btn-restock-action" style="background-color: #78B500; padding: 10px 16px; font-size:12px; margin-top:0;" onclick="uploadReceiptMock()">
                        <i class="fas fa-camera"></i> Foto Nota
                    </button>
                </div>
            `);
        } else if (restockState === 'restocking') {
            const adjustedCount = Object.keys(tempAdjustments).length;
            container.html(`
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;">
                    <div style="flex: 1; display:flex; align-items:center; gap:8px;">
                        <div style="width:36px; height:36px; background:#EBF8F4; border-radius:8px; display:flex; align-items:center; justify-content:center; position:relative;">
                            <i class="fas fa-motorcycle" style="color:#005D41; font-size:16px;"></i>
                            ${adjustedCount > 0 ? `<span style="position:absolute; top:-6px; right:-6px; background:#C62828; color:#fff; font-size:9px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff;">${adjustedCount}</span>` : ''}
                        </div>
                        <div>
                            <div style="font-size:12px; font-weight:700; color:#231F20;">${adjustedCount} Produk di-adjust</div>
                            <div style="font-size:10px; color:var(--color-gray); font-weight:500;">Sesuaikan stok fisik motor</div>
                        </div>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button class="btn-restock-action" style="background-color:#E0E0E0; color:#555; padding: 10px 12px; font-size:12px; margin-top:0;" onclick="cancelRestock()">
                            Batal
                        </button>
                        <button class="btn-restock-action" style="background-color:#005D41; padding: 10px 16px; font-size:12px; margin-top:0;" onclick="completeRestock()">
                            Tinjau <i class="fas fa-arrow-right" style="margin-left: 4px;"></i>
                        </button>
                    </div>
                </div>
            `);
        }
    }

    function buildChips() {
        const cats = ['Semua', ...SfaStore.getProductCategories()];
        const container = $('#categoryChips');
        container.empty();
        cats.forEach(c => {
            container.append(`<div class="cat-chip ${c === 'Semua' ? 'active' : ''}" onclick="setCategory('${c}')">${c}</div>`);
        });
    }

    function setCategory(cat) {
        currentCat = cat;
        $('.cat-chip').removeClass('active');
        $(`.cat-chip`).filter(function() { return $(this).text() === cat; }).addClass('active');
        renderGrid();
    }

    function resetProductFilter() {
        $('#searchInput').val('');
        setCategory('Semua');
    }

    function renderGrid() {
        const query = $('#searchInput').val().toLowerCase();
        const products = SfaStore.getProducts();
        const container = $('#productGrid');
        container.empty();

        const filtered = products.filter(p => {
            const matchSearch = p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query);
            const matchCat = currentCat === 'Semua' || p.category === currentCat;
            return matchSearch && matchCat;
        });

        $('#productCountLabel').text(`Jumlah: ${filtered.length}`);

        if (filtered.length === 0) {
            const isFiltered = query !== '' || currentCat !== 'Semua';
            const resetBtn = isFiltered
                ? `<button class="empty-state-action" onclick="resetProductFilter()"><i class="fas fa-rotate-left me-1"></i>Reset Filter</button>`
                : '';
            container.html(`<div class="empty-state"><i class="fas fa-box-open"></i><div>Produk tidak ditemukan.</div>${resetBtn}</div>`);
            return;
        }

        filtered.forEach(p => {
            // Check image or fallback
            const imgHtml = p.imageUrl
                ? `<img src="${p.imageUrl}" class="product-card-img" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
                   <div class="product-card-fallback-icon" style="display:none;"><i class="fa-solid ${p.icon || 'fa-box'}"></i></div>`
                : `<div class="product-card-fallback-icon"><i class="fa-solid ${p.icon || 'fa-box'}"></i></div>`;
            
            // Format numbers to Indonesian standard without Rp symbol
            const formattedKarton = new Intl.NumberFormat('id-ID').format(p.priceKarton);
            const formattedBox = new Intl.NumberFormat('id-ID').format(p.priceBox);
            const formattedPcs = new Intl.NumberFormat('id-ID').format(p.pricePcs);

            // Use temp adjustments if available
            const adj = tempAdjustments[p.code];
            const stockK = adj ? adj.karton : p.stockKarton;
            const stockB = adj ? adj.box : p.stockBox;
            const stockP = adj ? adj.pcs : p.stockPcs;

            container.append(`
                <div class="product-card">
                    <a href="product_detail.html?id=${p.code}" style="text-decoration: none; color: inherit; display: block;">
                        <div class="product-top-info">
                            ${imgHtml}
                            <div class="product-card-text">
                                <div class="product-card-code">${p.code}</div>
                                <div class="product-card-name">${p.name}</div>
                            </div>
                            <div class="product-focus-badge">
                                <i class="fas fa-thumbtack" style="font-size: 8px;"></i> Product focus
                            </div>
                        </div>
                        <div class="product-divider"></div>
                        <table class="product-uom-table">
                            <thead>
                                <tr>
                                    <th>Unit <i class="far fa-question-circle text-muted ms-1" style="font-size: 9px;"></i></th>
                                    <th>KARTON</th>
                                    <th>BOX</th>
                                    <th>PCS</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="stok-row">
                                    <td>Stok</td>
                                    <td id="stok-karton-${p.code}">${stockK}</td>
                                    <td id="stok-box-${p.code}">${stockB}</td>
                                    <td id="stok-pcs-${p.code}">${stockP}</td>
                                </tr>
                                <tr class="harga-row">
                                    <td>Harga</td>
                                    <td>${formattedKarton}</td>
                                    <td>${formattedBox}</td>
                                    <td>${formattedPcs}</td>
                                </tr>
                            </tbody>
                        </table>
                    </a>
                    <div class="product-divider" style="margin-top: 10px; margin-bottom: 8px;"></div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 11px; color: var(--color-gray); font-weight: 500;"><i class="fas fa-motorcycle" style="color: #78B500; margin-right: 4px;"></i> Stok fisik di motor</span>
                        <button onclick="adjustStock('${p.code}', '${p.name.replace(/'/g, "\\'")}', ${stockK}, ${stockB}, ${stockP})" style="background: #F1F7E5; color: #005D41; border: 1px solid #DDE8C1; border-radius: 6px; padding: 6px 14px; font-size: 11px; font-weight: 700; cursor: pointer; transition: background 0.2s;">
                            <i class="fas fa-edit"></i> Sesuaikan
                        </button>
                    </div>
                </div>
            `);
        });
    }
    function adjustStock(code, name, currentKarton, currentBox, currentPcs) {
        if (restockState !== 'restocking') {
            Swal.fire({
                icon: 'warning',
                title: 'Akses Terkunci',
                text: 'Harap lakukan Check-in Grosir dan unggah Foto Nota terlebih dahulu sebelum menyesuaikan stok barang.',
                confirmButtonColor: '#005D41'
            });
            return;
        }

        $('#sheetProductCode').val(code);
        $('#sheetProductName').text(name);
        // Load original stock if they adjust again, or use current value
        $('#inputKarton').val(tempAdjustments[code] ? tempAdjustments[code].karton : currentKarton);
        $('#inputBox').val(tempAdjustments[code] ? tempAdjustments[code].box : currentBox);
        $('#inputPcs').val(tempAdjustments[code] ? tempAdjustments[code].pcs : currentPcs);

        // Slide up bottom sheet
        $('#sheetBackdrop').show();
        $('#stockSheet').show();
        setTimeout(() => {
            $('#sheetBackdrop').css('opacity', 1);
            $('#stockSheet').addClass('show');
        }, 10);
    }

    function closeBottomSheet() {
        $('#stockSheet').removeClass('show');
        $('#sheetBackdrop').css('opacity', 0);
        setTimeout(() => {
            $('#stockSheet').hide();
            $('#sheetBackdrop').hide();
        }, 280);
    }

    function saveStockAdjustment() {
        const code = $('#sheetProductCode').val();
        const name = $('#sheetProductName').text();
        const karton = parseInt($('#inputKarton').val()) || 0;
        const box = parseInt($('#inputBox').val()) || 0;
        const pcs = parseInt($('#inputPcs').val()) || 0;

        // Save to temp adjustments for history log
        tempAdjustments[code] = {
            name: name,
            karton: karton,
            box: box,
            pcs: pcs
        };
        localStorage.setItem('temp_restock_adjustments', JSON.stringify(tempAdjustments));
        updateRestockUI();

        // Update values in DOM
        $(`#stok-karton-${code}`).text(karton).hide().fadeIn();
        $(`#stok-box-${code}`).text(box).hide().fadeIn();
        $(`#stok-pcs-${code}`).text(pcs).hide().fadeIn();

        // Update button onclick parameters dynamically
        const card = $(`#stok-karton-${code}`).closest('.product-card');
        const btn = card.find('button');
        const escapedName = name.replace(/'/g, "\\'");
        btn.attr('onclick', `adjustStock('${code}', '${escapedName}', ${karton}, ${box}, ${pcs})`);

        closeBottomSheet();

        // Toast feedback
        Swal.fire({
            toast: true,
            position: 'top',
            icon: 'success',
            title: 'Stok berhasil dimasukkan',
            showConfirmButton: false,
            timer: 1500
        });
    }

    function startCheckIn() {
        Swal.fire({
            title: 'Mendeteksi Lokasi...',
            html: `
                <div style="margin-bottom: 12px; font-size: 13px; color: #666;">Menghubungkan ke GPS satelit...</div>
                <div style="display:flex; justify-content:center; align-items:center; height: 50px;">
                    <i class="fas fa-spinner fa-spin" style="font-size:30px; color:#005D41;"></i>
                </div>
            `,
            showConfirmButton: false,
            allowOutsideClick: false,
            didOpen: () => {
                setTimeout(() => {
                    restockState = 'checked_in';
                    localStorage.setItem('restock_state', 'checked_in');
                    updateRestockUI();
                    Swal.fire({
                        icon: 'success',
                        title: 'GPS Terverifikasi!',
                        text: 'Anda berada di radius Grosir Sinar Jaya.',
                        showConfirmButton: false,
                        timer: 1800
                    });
                }, 1500);
            }
        });
    }

    function uploadReceiptMock() {
        Swal.fire({
            title: 'Foto Nota Belanja',
            html: `
                <div style="font-size: 13px; color: #555; margin-bottom: 12px; text-align: left;">
                    Gunakan kamera ponsel untuk mengambil foto bukti nota fisik grosir.
                </div>
                <div style="width: 100%; height: 180px; border: 2px dashed #78B500; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fafafa; position: relative; overflow: hidden; margin-bottom: 16px;">
                    <i class="fas fa-camera" style="font-size: 40px; color: #78B500; margin-bottom: 8px;"></i>
                    <span style="font-size: 11px; color: #777; font-weight: 500;">Posisikan Kwitansi dalam Kotak</span>
                    <div style="position: absolute; top: 10px; left: 10px; width: 15px; height: 15px; border-top: 2px solid #78B500; border-left: 2px solid #78B500;"></div>
                    <div style="position: absolute; top: 10px; right: 10px; width: 15px; height: 15px; border-top: 2px solid #78B500; border-right: 2px solid #78B500;"></div>
                    <div style="position: absolute; bottom: 10px; left: 10px; width: 15px; height: 15px; border-bottom: 2px solid #78B500; border-left: 2px solid #78B500;"></div>
                    <div style="position: absolute; bottom: 10px; right: 10px; width: 15px; height: 15px; border-bottom: 2px solid #78B500; border-right: 2px solid #78B500;"></div>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'Ambil Foto',
            cancelButtonText: 'Batal',
            confirmButtonColor: '#005D41',
            cancelButtonColor: '#777',
            focusConfirm: false
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({
                    title: 'Mengunggah...',
                    html: `
                        <div style="margin-bottom: 12px; font-size: 13px; color: #666;">Mengompres & mengirimkan foto ke server...</div>
                        <div style="display:flex; justify-content:center; align-items:center; height: 50px;">
                            <i class="fas fa-circle-notch fa-spin" style="font-size:30px; color:#78B500;"></i>
                        </div>
                    `,
                    showConfirmButton: false,
                    allowOutsideClick: false,
                    didOpen: () => {
                        setTimeout(() => {
                            restockState = 'restocking';
                            localStorage.setItem('restock_state', 'restocking');
                            updateRestockUI();
                            Swal.fire({
                                icon: 'success',
                                title: 'Foto Nota Berhasil!',
                                text: 'Langkah terakhir, silakan input stok barang.',
                                showConfirmButton: false,
                                timer: 1800
                            });
                        }, 1500);
                    }
                });
            }
        });
    }

    function cancelRestock() {
        Swal.fire({
            title: 'Batalkan Kulakan?',
            text: 'Seluruh input stok baru dan bukti foto akan dibatalkan.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#777',
            confirmButtonText: 'Ya, Batalkan',
            cancelButtonText: 'Kembali'
        }).then((result) => {
            if (result.isConfirmed) {
                restockState = 'idle';
                tempAdjustments = {};
                localStorage.removeItem('restock_state');
                localStorage.removeItem('temp_restock_adjustments');
                updateRestockUI();
                renderGrid();
            }
        });
    }

    function completeRestock() {
        if (Object.keys(tempAdjustments).length === 0) {
            Swal.fire({
                icon: 'warning',
                title: 'Belum Ada Penyesuaian',
                text: 'Harap lakukan penyesuaian stok minimal pada 1 produk sebelum mengirim.',
                confirmButtonColor: '#005D41'
            });
            return;
        }

        // Save review data to localStorage
        localStorage.setItem('restock_state', restockState);
        localStorage.setItem('temp_restock_adjustments', JSON.stringify(tempAdjustments));
        localStorage.setItem('temp_restock_receipt', 'nota_belanja_stokis.jpg');
        localStorage.setItem('temp_restock_grosir', 'Grosir Sinar Jaya');
        localStorage.setItem('temp_restock_time', new Date().toISOString());

        // Redirect to Gojek-like checkout review page
        window.location.href = 'restock_review.html';
    }

    function openHistorySheet() {
        renderHistoryList();
        $('#historyBackdrop').show();
        $('#historySheet').show();
        setTimeout(() => {
            $('#historyBackdrop').css('opacity', 1);
            $('#historySheet').addClass('show');
        }, 10);
    }

    function closeHistorySheet() {
        $('#historySheet').removeClass('show');
        $('#historyBackdrop').css('opacity', 0);
        setTimeout(() => {
            $('#historySheet').hide();
            $('#historyBackdrop').hide();
        }, 280);
    }

    function renderHistoryList() {
        const listContainer = $('#historyList');
        listContainer.empty();

        if (historyEntries.length === 0) {
            listContainer.html('<div style="text-align:center; padding: 24px 0; color: #aaa;">Belum ada riwayat mutasi hari ini.</div>');
            return;
        }

        historyEntries.forEach(entry => {
            let badgeClass = 'badge-system';
            let icon = 'fa-cog';
            if (entry.type === 'inbound') {
                badgeClass = 'badge-inbound';
                icon = 'fa-arrow-alt-circle-down';
            } else if (entry.type === 'outbound') {
                badgeClass = 'badge-outbound';
                icon = 'fa-arrow-alt-circle-up';
            }

            let detailsHtml = entry.details.map(d => `<div>${d}</div>`).join('');

            listContainer.append(`
                <div class="history-item">
                    <div class="history-meta">
                        <span class="history-type-badge ${badgeClass}"><i class="fas ${icon}"></i> ${entry.type}</span>
                        <span class="history-time">${entry.time}</span>
                    </div>
                    <div class="history-title" style="font-size: 13px; font-weight:700; color: #222;">${entry.title}</div>
                    <div class="history-details">
                        ${detailsHtml}
                    </div>
                </div>
            `);
        });
    }
</script>
</body>
</html>
