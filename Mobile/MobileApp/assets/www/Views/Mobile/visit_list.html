<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Rute Kunjungan - Falcon SFA Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
    <style>
        :root {
            --color-primary: #005D41;
            --color-primary-dark: #004d35;
            --color-accent: #78B500;
            --color-black: #231F20;
            --color-gray: #ADA4A5;
            --color-gray-light: #F6F6F6;
            --color-border: #E9EFEF;
            --color-bg-light: #F1F7E5;
        }

        body { background: #f7f9fa; }

        .mobile-header {
            background: linear-gradient(135deg, #004d35, #005D41);
            color: #fff;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid var(--color-border);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px;
            border: 1px solid var(--color-border);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-gray);
            white-space: nowrap;
            cursor: pointer;
            background: #fff;
            display: flex; align-items: center; gap: 4px;
        }
        .filter-chip i { font-size: 11px; }
        .filter-chip.active { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-bg-light); }

        /* Count Label */
        .count-label {
            padding: 8px 16px 4px;
            font-size: 13px;
            color: var(--color-gray);
            text-align: right;
        }

        /* Visit Card */
        .visit-card {
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: 12px;
            margin: 0 16px 12px;
            padding: 14px 16px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.1s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }
        .visit-card:active { transform: scale(0.98); }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .customer-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-black);
            max-width: 70%;
        }
        
        .card-body-row {
            font-size: 13px;
            color: var(--color-black);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0f2f5;
            padding-top: 8px;
            margin-top: 8px;
        }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 24px; right: calc(50% - 225px + 16px);
            width: 56px; height: 56px;
            background: #005D41;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(0,93,65,0.4);
            cursor: pointer; z-index: 200;
            text-decoration: none; color: #fff;
            font-size: 24px;
        }
        @media (max-width: 480px) { .fab { right: 16px; } }
    </style>
</head>
<body>
<div class="mobile-wrapper">
    <!-- Header -->
    <div class="mobile-header">
        <button class="header-action" onclick="window.location.href='home.html'"><i class="fas fa-chevron-left"></i></button>
        <span class="header-title">Rute Kunjungan</span>
        <button class="header-action" onclick="toggleSearch()"><i class="fas fa-search"></i></button>
    </div>

    <!-- Search (hidden by default) -->
    <div class="search-container d-none" id="searchBar" style="padding:10px 16px; background:#fff; border-bottom:1px solid var(--color-border);">
        <div style="background:var(--color-gray-light); border-radius:20px; display:flex; align-items:center; padding:0 14px;">
            <i class="fas fa-search" style="color:var(--color-gray); margin-right:8px;"></i>
            <input type="text" id="searchInput" placeholder="Cari nama outlet atau kode..." style="border:none; background:transparent; padding:10px 0; width:100%; font-size:13px; outline:none;" oninput="renderList()"/>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="filter-chip" onclick="openFilterPanel()"><i class="fas fa-sliders-h"></i> Filter</div>
        <div class="filter-chip active" id="chipAll" onclick="setStatusFilter('all')">Semua</div>
        <div class="filter-chip" id="chipUnvisited" onclick="setStatusFilter('unvisited')">Belum Kunjungan</div>
        <div class="filter-chip" id="chipVisited" onclick="setStatusFilter('visited')">Selesai</div>
    </div>

    <!-- Count -->
    <div class="count-label">Jumlah Outlet: <strong id="visitCount">0</strong></div>

    <!-- Visit List -->
    <div class="mobile-content no-nav" style="padding-bottom:80px;">
        <div id="visitListContainer"></div>
    </div>

    <!-- FAB: Tambah Kunjungan Luar Rute -->
    <a href="outlet_list.html" class="fab" title="Kunjungan Luar Rute"><i class="fas fa-plus"></i></a>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../wwwroot/js/sfa-store.js"></script>
<script>
    const MOCK_DISTANCES = { "OL-10492": 0.2, "OL-10511": 0.6, "OL-10283": 1.1, "OL-10772": 0.05, "OL-10819": 2.5, "OL-10902": 0.8, "OL-11002": 2.6, "OL-11145": 0.7, "OL-11239": 1.9, "OL-11340": 2.2, "OL-11451": 1.3, "OL-11562": 1.2, "OL-11673": 1.5, "OL-11784": 2.7, "OL-11895": 0.5 };
    const DEFAULT_ROUTE_IDS = ["OL-10492", "OL-10511", "OL-10283", "OL-10772", "OL-10819"];

    let visits = [];
    let statusFilter = 'all';

    $(document).ready(function() {
        loadVisits();
        renderList();
    });

    function loadVisits() {
        // 1. Get all customers
        const allCustomers = SfaStore.getCustomers();
        
        // 2. Get today's visits from storage
        const todayVisits = SfaStore.getVisits().filter(v => v.date === SfaStore.todayStr());

        // 3. Compile today's visit list
        const list = [];

        // Add default route customers
        DEFAULT_ROUTE_IDS.forEach(id => {
            const cust = allCustomers.find(c => c.id === id);
            if (!cust) return;

            const visitRecord = todayVisits.find(v => v.customerId === id);
            list.push({
                customerId: id,
                customerName: cust.name,
                address: cust.address || '-',
                inRoute: true,
                status: visitRecord ? visitRecord.status : 'unvisited',
                visitId: visitRecord ? visitRecord.id : null,
                distance: MOCK_DISTANCES[id] || 1.0,
                visitRecord: visitRecord
            });
        });

        // Add out-of-route customers who have visit records today
        todayVisits.forEach(v => {
            if (DEFAULT_ROUTE_IDS.includes(v.customerId)) return; // already added

            const cust = allCustomers.find(c => c.id === v.customerId);
            list.push({
                customerId: v.customerId,
                customerName: cust ? cust.name : v.customerName,
                address: cust ? cust.address : '-',
                inRoute: false,
                status: v.status,
                visitId: v.id,
                distance: MOCK_DISTANCES[v.customerId] || 1.5,
                visitRecord: v
            });
        });

        visits = list;
    }

    function setStatusFilter(filter) {
        statusFilter = filter;
        $('.filter-chip').removeClass('active');
        $(`#chip${filter.charAt(0).toUpperCase() + filter.slice(1)}`).addClass('active');
        renderList();
    }

    function resetVisitFilter() {
        $('#searchInput').val('');
        setStatusFilter('all'); // mengembalikan chip + render ulang
    }

    function toggleSearch() {
        $('#searchBar').toggleClass('d-none');
        if (!$('#searchBar').hasClass('d-none')) {
            $('#searchInput').focus();
        }
    }

    function openFilterPanel() {
        Swal.fire({
            title: 'Filter Lanjutan',
            html: '<p style="font-size:13px; color:#666;">Filter berdasarkan Jarak, Tipe Outlet, atau Rute Kunjungan akan tersedia di versi berikutnya.</p>',
            confirmButtonColor: '#005D41',
            confirmButtonText: 'Tutup'
        });
    }

    function renderList() {
        const query = ($('#searchInput').val() || '').toLowerCase();
        const container = $('#visitListContainer');
        container.empty();

        let filtered = visits.filter(v => {
            const matchSearch = v.customerName.toLowerCase().includes(query) ||
                                v.customerId.toLowerCase().includes(query);
            if (!matchSearch) return false;
            
            if (statusFilter === 'all') return true;
            if (statusFilter === 'unvisited') return v.status === 'unvisited';
            if (statusFilter === 'visited') return v.status === 'checked_out';
            return true;
        });

        // Sort: checked_in first, then unvisited, then checked_out (completed)
        const statusOrder = { 'checked_in': 1, 'unvisited': 2, 'checked_out': 3 };
        filtered.sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);

        $('#visitCount').text(filtered.length);

        if (filtered.length === 0) {
            const isFiltered = query !== '' || statusFilter !== 'all';
            const resetBtn = isFiltered
                ? `<button class="empty-state-action" onclick="resetVisitFilter()"><i class="fas fa-rotate-left me-1"></i>Reset Filter</button>`
                : '';
            container.html(`
                <div class="empty-state">
                    <i class="fas fa-route"></i>
                    <div>Tidak ada rute kunjungan ditemukan.</div>
                    <small>${isFiltered ? 'Coba ubah atau reset filter pencarian.' : 'Tambahkan kunjungan luar rute lewat tombol (+).'}</small>
                    ${resetBtn}
                </div>
            `);
            return;
        }

        filtered.forEach(v => {
            let statusText = 'Belum Dikunjungi';
            let badgeClass = 'badge-mobile-warning';
            if (v.status === 'checked_in') {
                statusText = 'Sedang Check-In';
                badgeClass = 'badge-mobile-info';
            } else if (v.status === 'checked_out') {
                statusText = 'Selesai Kunjungan';
                badgeClass = 'badge-mobile-success';
            }

            const routeText = v.inRoute ? 'Rute Harian' : 'Luar Rute';
            const routeClass = v.inRoute ? 'bg-light text-dark border' : 'bg-secondary text-white';

            // Outstanding AR from SfaStore
            const ar = SfaStore.getOutstandingByCustomerId(v.customerId);
            const arBadge = ar > 0 ? `
                <span style="font-size:10px; font-weight:700; color:#dc3545; background:#FFF3E0; padding:2px 8px; border-radius:4px; margin-left: 6px; border: 1px solid rgba(220,53,69,0.15)">
                    AR: ${SfaStore.formatRupiah(ar)}
                </span>
            ` : '';

            // Distance layout
            const distColor = v.distance <= 0.1 ? '#00A76F' : '#FF8F00';
            const distLabel = `Jarak: ${v.distance.toFixed(2)} km`;

            // Card HTML
            container.append(`
                <a href="visit_detail.html?id=${v.customerId}" class="visit-card" style="text-decoration:none; display:block;">
                    <div class="card-header-row">
                        <span class="customer-name">${v.customerName}</span>
                        <span class="badge-mobile ${badgeClass}">${statusText}</span>
                    </div>
                    <div style="font-size:13px; color:var(--color-gray); margin-bottom:6px;">
                        <i class="fas fa-store-alt me-1"></i> ${v.customerId}
                        <span class="badge-mobile ${routeClass} ms-2" style="font-size:10px; padding:2px 6px;">${routeText}</span>
                        ${arBadge}
                    </div>
                    <div class="card-body-row">
                        <i class="fas fa-map-marker-alt text-danger me-1"></i> ${v.address}
                    </div>
                    <div class="card-footer-row">
                        <div style="font-size:13px; font-weight:600; color:${distColor};">
                            <i class="fas fa-street-view me-1"></i> ${distLabel}
                        </div>
                        ${v.status === 'checked_out' && v.visitRecord.hasOrder ? `
                            <div style="font-size:13px; font-weight:700; color:#005D41;">
                                <i class="fas fa-shopping-cart me-1"></i> Order: ${SfaStore.formatRupiah(v.visitRecord.orderAmount)}
                            </div>
                        ` : ''}
                        ${v.status === 'checked_out' && v.visitRecord.hasNoOrderReason ? `
                            <div style="font-size:13px; font-weight:700; color:#dc3545;">
                                <i class="fas fa-times-circle me-1"></i> ${v.visitRecord.noOrderReason}
                            </div>
                        ` : ''}
                    </div>
                </a>
            `);
        });
    }
</script>
</body>
</html>
