<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Detail Produk - Falcon SFA Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
    <style>
        /* Header SimpliDOTS Style */
        .mobile-header-red {
            background: #005D41; color: #fff;
            height: 56px; display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px;
            position: sticky; top: 0; z-index: 100;
        }
        .header-action-white {
            background: transparent; border: none; color: #fff;
            font-size: 18px; cursor: pointer; padding: 4px;
        }
        .header-title-white {
            font-weight: 700; font-size: 18px; flex: 1; margin-left: 16px;
        }

        .product-hero {
            background: #fff; height: 200px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            border-bottom: 1px solid var(--color-border);
        }
        .product-hero img {
            width: 100%; height: 100%; object-fit: contain; padding: 16px;
        }
        .product-hero .icon-fallback {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%; font-size: 72px; color: #005D41;
        }

        .promo-flag {
            position: absolute; top: 12px; left: 12px;
            background: #dc3545; color: #fff;
            font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px;
        }

        /* Detail Info Card */
        .detail-card {
            background: #fff; border: 1px solid var(--color-border);
            border-radius: 12px; padding: 16px; margin: 16px;
            position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .detail-title-row {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 4px;
        }
        .detail-name {
            font-size: 16px; font-weight: 700; color: var(--color-black);
            text-transform: uppercase; padding-right: 90px;
        }
        .detail-code {
            font-size: 12px; color: var(--color-gray); font-weight: 600;
            margin-bottom: 12px;
        }
        .product-focus-badge {
            position: absolute; top: 16px; right: 16px;
            background: #F0F4F8; color: #34495E;
            font-size: 10px; font-weight: 700; padding: 3px 8px;
            border-radius: 4px; display: flex; align-items: center; gap: 4px;
        }

        .detail-divider {
            height: 1px; background-color: var(--color-border);
            margin-bottom: 12px; width: 100%;
        }

        /* Grid UOM Table */
        .product-uom-table {
            width: 100%; border-collapse: collapse; font-size: 12px;
            text-align: center;
        }
        .product-uom-table th {
            font-weight: 500; color: var(--color-gray);
            padding: 4px; font-size: 11px; text-transform: uppercase;
        }
        .product-uom-table th:first-child, .product-uom-table td:first-child {
            text-align: left; width: 70px; color: var(--color-gray);
            font-weight: 500;
        }
        .product-uom-table td {
            padding: 6px 4px; font-weight: 700; color: var(--color-black);
        }
        .product-uom-table .stok-row {
            background-color: #EBF8F4;
        }
        .product-uom-table .stok-row td {
            color: #27AE60;
        }
        .product-uom-table .stok-row td:first-child {
            border-top-left-radius: 4px; border-bottom-left-radius: 4px;
            padding-left: 6px;
        }
        .product-uom-table .stok-row td:last-child {
            border-top-right-radius: 4px; border-bottom-right-radius: 4px;
        }
        .product-uom-table .harga-row td {
            color: #555; padding-top: 8px;
        }

        /* Description Card */
        .desc-card {
            background: #fff; border: 1px solid var(--color-border);
            border-radius: 12px; padding: 16px; margin: 0 16px 16px 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .desc-title {
            font-size: 14px; font-weight: 700; color: var(--color-black);
            margin-bottom: 12px;
        }
        .desc-row {
            display: flex; font-size: 13px; margin-bottom: 8px;
        }
        .desc-label {
            width: 100px; color: var(--color-gray);
        }
        .desc-val {
            flex: 1; color: var(--color-black); font-weight: 500;
        }
        .conversion-item {
            display: flex; justify-content: space-between; max-width: 180px;
            font-size: 13px; margin-bottom: 4px;
        }
        .conversion-left {
            color: var(--color-black); font-weight: 500;
        }
        .conversion-right {
            color: var(--color-black); font-weight: 700;
        }

        .promo-section {
            background: #FFF9E5; border: 1px solid #FFE57A;
            border-radius: 12px; padding: 14px 16px; margin: 0 16px 16px 16px;
        }
        .promo-title { font-size: 13px; font-weight: 700; color: #B25900; margin-bottom: 4px; }
        .promo-desc { font-size: 12px; color: #7a5200; }

        /* Bottom Action red style */
        .bottom-action {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff; border-top: 1px solid var(--color-border);
            padding: 12px 16px; display: flex; justify-content: center;
            z-index: 10;
        }
        .btn-action-red {
            background: #005D41; color: #fff; border: none;
            width: 100%; max-width: 400px; padding: 12px;
            border-radius: 8px; font-size: 14px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; cursor: pointer; transition: all 0.2s;
        }
        .btn-action-red:active {
            background: #004730;
        }
    </style>
</head>
<body style="background:#f7f9fa;">
<div class="mobile-wrapper">
    <!-- SimpliDOTS Header -->
    <div class="mobile-header-red">
        <button class="header-action-white" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <span class="header-title-white">Detail produk</span>
        <div style="width:32px;"></div>
    </div>

    <div class="mobile-content no-nav" style="padding-bottom:80px; padding-top: 0;">
        <!-- Hero Section -->
        <div class="product-hero" id="productHero">
            <div class="promo-flag d-none" id="promoFlag">PROMO</div>
        </div>

        <!-- Detail Card -->
        <div class="detail-card">
            <div class="detail-title-row">
                <div class="detail-name" id="productName">-</div>
            </div>
            <div class="detail-code" id="productCode">-</div>
            <div class="product-focus-badge">
                <i class="fas fa-thumbtack" style="font-size: 8px;"></i> Product focus
            </div>
            <div class="detail-divider"></div>

            <table class="product-uom-table">
                <thead>
                    <tr>
                        <th>Unit</th>
                        <th>KARTON</th>
                        <th>BOX</th>
                        <th>PCS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="stok-row">
                        <td>Stok</td>
                        <td id="stockKarton">-</td>
                        <td id="stockBox">-</td>
                        <td id="stockPcs">-</td>
                    </tr>
                    <tr class="harga-row">
                        <td>Harga</td>
                        <td id="priceKarton">-</td>
                        <td id="priceBox">-</td>
                        <td id="pricePcs">-</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Description Card -->
        <div class="desc-card">
            <div class="desc-title">Deskripsi produk</div>
            <div class="desc-row">
                <div class="desc-label">Konversi unit</div>
                <div class="desc-val" id="unitConversionList">
                    <!-- filled by script -->
                </div>
            </div>
            <div class="desc-row mb-0">
                <div class="desc-label">Deskripsi</div>
                <div class="desc-val" id="productDesc">Produk KN</div>
            </div>
        </div>

        <!-- Promo Section -->
        <div class="promo-section d-none" id="promoSection">
            <div class="promo-title"><i class="fas fa-tags me-1"></i>Promo Aktif</div>
            <div class="promo-desc" id="promoDesc">-</div>
        </div>
    </div>

    <!-- Bottom Action -->
    <div class="bottom-action">
        <button class="btn-action-red" onclick="addToInvoice()">
            <i class="fas fa-file-invoice-dollar"></i> Tambah ke Faktur
        </button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../wwwroot/js/sfa-store.js"></script>
<script>
    let product = null;

    $(document).ready(function() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) { history.back(); return; }

        product = SfaStore.getProductById(id);
        if (!product) { history.back(); return; }

        renderDetail();

        // Only show bottom action button when in checkout transaction context
        const backToOrder = params.get('backToOrder');
        if (backToOrder === '1') {
            $('.bottom-action').show();
            $('.mobile-content').css('padding-bottom', '80px');
        } else {
            $('.bottom-action').hide();
            $('.mobile-content').css('padding-bottom', '20px');
        }
    });

    function renderDetail() {
        const p = product;

        // Render Hero Image
        const hero = $('#productHero');
        if (p.imageUrl) {
            hero.prepend(`<img src="${p.imageUrl}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling && (this.nextElementSibling.style.display='flex');"/>`);
        } else {
            hero.prepend(`<div class="icon-fallback"><i class="fa-solid ${p.icon || 'fa-box'}"></i></div>`);
        }

        // Title and Code
        $('#productName').text(p.name);
        $('#productCode').text(p.code);

        // Populate Table Stok
        $('#stockKarton').text(p.stockKarton);
        $('#stockBox').text(p.stockBox);
        $('#stockPcs').text(p.stockPcs);

        // Populate Table Harga
        $('#priceKarton').text(new Intl.NumberFormat('id-ID').format(p.priceKarton));
        $('#priceBox').text(new Intl.NumberFormat('id-ID').format(p.priceBox));
        $('#pricePcs').text(new Intl.NumberFormat('id-ID').format(p.pricePcs));

        // Unit Conversions list
        const conversionContainer = $('#unitConversionList');
        conversionContainer.empty();
        
        // 1 Karton = X PCS
        conversionContainer.append(`
            <div class="conversion-item">
                <span class="conversion-left">1 KARTON</span>
                <span class="conversion-right">${p.pcsPerCtn} PCS</span>
            </div>
        `);
        // 1 Box = Y PCS
        conversionContainer.append(`
            <div class="conversion-item">
                <span class="conversion-left">1 BOX</span>
                <span class="conversion-right">${p.pcsPerBox} PCS</span>
            </div>
        `);

        // Promo
        if (p.hasPromo && p.promoDesc) {
            $('#promoFlag').removeClass('d-none');
            $('#promoSection').removeClass('d-none');
            $('#promoDesc').text(p.promoDesc);
        }
    }

    function addToInvoice() {
        const visits = SfaStore.getVisits();
        const today = new Date().toDateString();
        const activeVisit = visits.find(v => v.status === 'checked_in' && new Date(v.createdAt).toDateString() === today);

        if (activeVisit) {
            window.location.href = `order_input.html?outletId=${activeVisit.customerId}&productId=${product.code}`;
        } else {
            Swal.fire({
                title: 'Belum Visit',
                text: 'Anda belum melakukan visit ke outlet manapun. Pilih rute kunjungan terlebih dahulu.',
                icon: 'info',
                showCancelButton: true,
                confirmButtonColor: '#005D41',
                confirmButtonText: 'Ke Rute Kunjungan',
                cancelButtonText: 'Batal'
            }).then(r => {
                if (r.isConfirmed) window.location.href = 'visit_list.html';
            });
        }
    }
</script>
</body>
</html>
