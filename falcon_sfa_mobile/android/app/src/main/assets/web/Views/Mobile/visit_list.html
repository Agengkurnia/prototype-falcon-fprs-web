<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Faktur Penjualan - Falcon SFA Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
    <style>
        :root {
            --color-primary: #005D41;
            --color-primary-dark: #004d35;
            --color-accent: #78B500;
            --color-black: #231F20;
            --color-gray: #ADA4A5;
            --color-gray-light: #F6F6F6;
            --color-border: #E9EFEF;
            --color-bg-light: #F1F7E5;
        }

        body { background: #f7f9fa; }

        .mobile-header {
            background: linear-gradient(135deg, #004d35, #005D41);
            color: #fff;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid var(--color-border);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px;
            border: 1px solid var(--color-border);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-gray);
            white-space: nowrap;
            cursor: pointer;
            background: #fff;
            display: flex; align-items: center; gap: 4px;
        }
        .filter-chip i { font-size: 11px; }
        .filter-chip.active { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-bg-light); }

        /* Count Label */
        .count-label {
            padding: 8px 16px 4px;
            font-size: 12px;
            color: var(--color-gray);
            text-align: right;
        }

        /* Invoice Card */
        .invoice-card {
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: 12px;
            margin: 0 16px 12px;
            padding: 14px 16px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.1s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }
        .invoice-card:active { transform: scale(0.98); }

        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .inv-number {
            font-size: 14px;
            font-weight: 800;
            color: var(--color-black);
        }
        .inv-badge {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }
        .inv-badge-paid { background: #E0F7F0; color: #00A76F; }
        .inv-badge-unpaid { background: #FFF3E0; color: #FF8F00; }
        .inv-badge-pending { background: #FFF8E1; color: #F57F17; }

        .inv-customer {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--color-black);
            margin-bottom: 2px;
        }
        .inv-customer i { color: #dc3545; font-size: 12px; }
        .inv-customer-code {
            font-size: 12px;
            color: var(--color-gray);
            margin-left: 18px;
            margin-bottom: 10px;
        }

        .inv-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid #f0f2f5;
            padding-top: 10px;
        }
        .inv-date-label {
            font-size: 11px;
            color: var(--color-gray);
        }
        .inv-date-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--color-black);
        }
        .inv-amount {
            font-size: 15px;
            font-weight: 800;
            color: var(--color-black);
            background: var(--color-gray-light);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* Sync Banner */
        .sync-banner {
            background: #FFF8E1;
            border-top: 1px solid #FFE082;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #F57F17;
            margin-top: 6px;
            border-radius: 0 0 12px 12px;
            margin: -2px 16px 12px;
            border: 1px solid #FFE082;
            border-top: none;
        }
        .sync-banner i { font-size: 14px; }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 24px; right: calc(50% - 225px + 16px);
            width: 56px; height: 56px;
            background: #005D41;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(0,93,65,0.4);
            cursor: pointer; z-index: 200;
            text-decoration: none; color: #fff;
            font-size: 24px;
        }
        @media (max-width: 480px) { .fab { right: 16px; } }
    </style>
</head>
<body>
<div class="mobile-wrapper">
    <!-- Header -->
    <div class="mobile-header">
        <button class="header-action" onclick="window.location.href='home.html'"><i class="fas fa-chevron-left"></i></button>
        <span class="header-title">Faktur penjualan</span>
        <button class="header-action" onclick="toggleSearch()"><i class="fas fa-search"></i></button>
    </div>

    <!-- Search (hidden by default) -->
    <div class="search-container d-none" id="searchBar" style="padding:10px 16px; background:#fff; border-bottom:1px solid var(--color-border);">
        <div style="background:var(--color-gray-light); border-radius:20px; display:flex; align-items:center; padding:0 14px;">
            <i class="fas fa-search" style="color:var(--color-gray); margin-right:8px;"></i>
            <input type="text" id="searchInput" placeholder="Cari no. faktur atau pelanggan..." style="border:none; background:transparent; padding:10px 0; width:100%; font-size:13px; outline:none;" oninput="renderList()"/>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="filter-chip" onclick="openFilterPanel()"><i class="fas fa-sliders-h"></i> Filter</div>
        <div class="filter-chip active" id="chipAll" onclick="setStatusFilter('all')">Semua</div>
        <div class="filter-chip" id="chipPaid" onclick="setStatusFilter('paid')">Paid</div>
        <div class="filter-chip" id="chipUnpaid" onclick="setStatusFilter('unpaid')">Unpaid</div>
    </div>

    <!-- Count -->
    <div class="count-label">Jumlah: <strong id="invoiceCount">0</strong></div>

    <!-- Invoice List -->
    <div class="mobile-content no-nav" style="padding-bottom:80px;">
        <div id="invoiceListContainer"></div>
    </div>

    <!-- FAB -->
    <a href="order_add.html" class="fab"><i class="fas fa-plus"></i></a>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../wwwroot/js/sfa-store.js"></script>
<script>
    let invoices = [];
    let statusFilter = 'all';

    $(document).ready(function() {
        loadInvoices();
        renderList();
    });

    function loadInvoices() {
        // Get invoices from SfaStore (completed ones)
        const stored = JSON.parse(localStorage.getItem('sfa_invoices') || '[]');
        invoices = stored.map(inv => {
            const cust = SfaStore.getCustomerById(inv.customerId);
            return {
                id: inv.id,
                invoiceNo: 'INV-' + inv.id,
                customerName: inv.customerName || (cust ? cust.name : inv.customerId),
                customerId: inv.customerId,
                date: inv.date || new Date().toISOString().slice(0,10),
                createdAt: inv.createdAt || inv.date || new Date().toISOString(),
                totalNet: inv.totalNet || inv.totalGross || 0,
                status: inv.paymentStatus || 'paid',
                synced: inv.synced || false,
                items: inv.items || []
            };
        });
    }

    function setStatusFilter(filter) {
        statusFilter = filter;
        $('.filter-chip').removeClass('active');
        $(`#chip${filter.charAt(0).toUpperCase() + filter.slice(1)}`).addClass('active');
        if (filter === 'all') $('#chipAll').addClass('active');
        renderList();
    }

    function toggleSearch() {
        $('#searchBar').toggleClass('d-none');
        if (!$('#searchBar').hasClass('d-none')) {
            $('#searchInput').focus();
        }
    }

    function openFilterPanel() {
        Swal.fire({
            title: 'Filter',
            html: '<p style="font-size:13px; color:#666;">Filter lanjutan (tanggal, pelanggan) akan tersedia di versi berikutnya.</p>',
            confirmButtonColor: '#005D41',
            confirmButtonText: 'Tutup'
        });
    }

    function renderList() {
        const query = ($('#searchInput').val() || '').toLowerCase();
        const container = $('#invoiceListContainer');
        container.empty();

        let filtered = invoices.filter(inv => {
            const matchSearch = inv.invoiceNo.toLowerCase().includes(query) ||
                                inv.customerName.toLowerCase().includes(query) ||
                                inv.customerId.toLowerCase().includes(query);
            if (!matchSearch) return false;
            if (statusFilter === 'all') return true;
            return inv.status === statusFilter;
        });

        // Sort by created date descending (newest first)
        filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        $('#invoiceCount').text(filtered.length);

        if (filtered.length === 0) {
            container.html(`
                <div class="text-center py-5 text-muted">
                    <i class="fas fa-file-invoice fs-2 mb-2 d-block"></i>
                    Belum ada faktur penjualan.<br>
                    <small>Klik tombol + untuk membuat faktur baru.</small>
                </div>
            `);
            return;
        }

        filtered.forEach(inv => {
            const badgeClass = inv.status === 'paid' ? 'inv-badge-paid' : 'inv-badge-unpaid';
            const badgeText = inv.status === 'paid' ? 'Paid' : 'Unpaid';

            // Format date
            const dateObj = new Date(inv.date);
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
            const dateStr = `${dateObj.getDate()} ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;

            // Format amount
            const amountStr = new Intl.NumberFormat('id-ID').format(inv.totalNet);

            const syncBanner = !inv.synced ? `
                <div class="sync-banner" style="margin:-2px 0 0; border-radius:0 0 10px 10px; border:none; background:#FFF8E1; padding:8px 12px;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Menunggu untuk dikirim ke back office</span>
                </div>
            ` : '';

            container.append(`
                <a href="invoice_detail.html?id=${inv.id}" class="invoice-card" style="${!inv.synced ? 'padding-bottom:0; border-radius:12px 12px 0 0; margin-bottom:0;' : ''}">
                    <div class="inv-header">
                        <span class="inv-number">${inv.invoiceNo}</span>
                        <span class="inv-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="inv-customer"><i class="fas fa-times-circle"></i> ${inv.customerName}</div>
                    <div class="inv-customer-code">${inv.customerId}</div>
                    <div class="inv-footer">
                        <div>
                            <div class="inv-date-label">Tanggal faktur</div>
                            <div class="inv-date-value">${dateStr}</div>
                        </div>
                        <div class="inv-amount">${amountStr}</div>
                    </div>
                </a>
                ${!inv.synced ? '<div style="margin:0 16px 12px;background:#FFF8E1;border:1px solid #FFE082;border-top:none;border-radius:0 0 12px 12px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#F57F17;"><i class="fas fa-exclamation-triangle"></i> Menunggu untuk dikirim ke back office</div>' : ''}
            `);
        });
    }
</script>
</body>
</html>
