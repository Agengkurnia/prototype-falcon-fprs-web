<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Reason | Falcon FPRS</title>
<link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
<link rel="stylesheet" href="../../../../wwwroot/css/filter-stat-cards.css"/>
</head>
<body>
<div id="app-content">
<div class="card mb-3"><div class="card-body d-flex justify-content-between"><h4 class="mb-0">Reason</h4>
<div><button class="btn btn-outline-secondary d-none" id="btnBack" type="button">Back</button>
<button class="btn btn-success" id="btnAdd" type="button">Add Reason</button>
<button class="btn btn-success d-none" id="btnSave" type="button">Save</button></div></div></div>
<div id="list">
<div class="row g-3 mb-3" id="cards">
<div class="col-md-4"><div class="mpg-stat-card mpg-stat-total is-filtered" data-filter=""><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cT">0</div><div class="mpg-stat-label">Total</div></div></div>
<div class="col-md-4"><div class="mpg-stat-card mpg-stat-active" data-filter="active"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cA">0</div><div class="mpg-stat-label">Active</div></div></div>
<div class="col-md-4"><div class="mpg-stat-card mpg-stat-inactive" data-filter="inactive"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cI">0</div><div class="mpg-stat-label">Inactive</div></div></div>
</div>
<div class="card"><div class="card-body"><table class="table" id="tbl" style="width:100%"><thead>
<tr><th>No</th><th>Reason Name</th><th>Type</th><th>Description</th><th>Status</th></tr>
</thead><tbody></tbody></table></div></div>
</div>
<div id="detail" class="d-none"><div class="card"><div class="card-header mpg-gradient">Reason</div><div class="card-body"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Reason Name <span class="text-muted">*</span></label><input class="form-control" id="fNama"/></div>
<div class="col-md-6"><label class="form-label">Type</label><select class="form-select" id="fTipe"><option value="Return">Return</option><option value="Kunjungan">Visit</option><option value="Order">Order</option><option value="Lainnya">Other</option></select></div>
<div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="fDesk"></textarea></div>
<div class="col-md-4"><label class="form-label d-block">Status</label><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fActive" checked/><label class="form-check-label" for="fActive">Active</label></div></div>
</div></div></div>
</div>
<script src="../../../../wwwroot/js/layout.js"></script>
<script src="../../../../wwwroot/js/prototype-spa.js"></script>
<script>
document.addEventListener("layoutReady", function () {
    const KEY = "md_alasan";
    const label = { Return: "Return", Kunjungan: "Visit", Order: "Order", Lainnya: "Other" };
    let rows = [], table, filter = "", editing = null;
    const on = r => r.status !== "Inactive";
    function load() {
        if (!localStorage.getItem(KEY)) fetch("../../../../wwwroot/data/alasan.json").then(r => r.json()).then(d => { d.forEach(x => { if (!x.status) x.status = "Active"; }); localStorage.setItem(KEY, JSON.stringify(d)); rows = d; paint(); });
        else { rows = JSON.parse(localStorage.getItem(KEY)); rows.forEach(x => { if (!x.status) x.status = "Active"; }); paint(); }
    }
    function paint() {
        $("#cT").text(rows.length); $("#cA").text(rows.filter(on).length); $("#cI").text(rows.filter(r => !on(r)).length);
        if ($.fn.DataTable.isDataTable("#tbl")) $("#tbl").DataTable().destroy();
        const b = $("#tbl tbody").empty();
        rows.forEach((r, i) => b.append("<tr><td>"+(i+1)+"</td><td><a href='#' class='text-success fw-bold open' data-id='"+r.id+"'>"+r.nama+"</a></td><td>"+(label[r.tipe]||r.tipe)+"</td><td>"+(r.deskripsi||"")+"</td><td>"+PrototypeSpa.statusBadge(on(r))+"</td></tr>"));
        table = $("#tbl").DataTable({ language: PrototypeSpa.dtLang(), pageLength: 10, dom: "lrtip" });
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn._rs);
        const fn = function (settings, data) {
            if (settings.nTable.id !== "tbl" || !filter) return true;
            const active = String(data[4]).indexOf("Inactive") < 0;
            return filter === "active" ? active : !active;
        };
        fn._rs = true; $.fn.dataTable.ext.search.push(fn);
    }
    function showList() { $("#detail").addClass("d-none"); $("#list").removeClass("d-none"); $("#btnBack,#btnSave").addClass("d-none"); $("#btnAdd").removeClass("d-none"); }
    function open(r) {
        editing = r;
        $("#fNama").val(r ? r.nama : ""); $("#fTipe").val(r ? r.tipe : "Return"); $("#fDesk").val(r ? r.deskripsi : ""); $("#fActive").prop("checked", r ? on(r) : true);
        $("#list").addClass("d-none"); $("#detail").removeClass("d-none"); $("#btnAdd").addClass("d-none"); $("#btnBack,#btnSave").removeClass("d-none");
    }
    $("#cards").on("click", ".mpg-stat-card", function () { filter = $(this).data("filter") || ""; PrototypeSpa.setFilteredCard("#cards", filter); if (table) table.draw(); });
    $("#tbl").on("click", ".open", function (e) { e.preventDefault(); open(rows.find(x => String(x.id) === String($(this).data("id")))); });
    $("#btnAdd").on("click", () => open(null));
    $("#btnBack").on("click", () => PrototypeSpa.confirm("Back to reason list?", showList));
    $("#btnSave").on("click", function () {
        if (!$("#fNama").val()) return;
        PrototypeSpa.confirm("Save this reason?", function () {
            const rec = editing || { id: Date.now() };
            rec.nama = $("#fNama").val(); rec.tipe = $("#fTipe").val(); rec.deskripsi = $("#fDesk").val(); rec.status = $("#fActive").is(":checked") ? "Active" : "Inactive";
            if (!editing) rows.push(rec);
            localStorage.setItem(KEY, JSON.stringify(rows)); paint(); showList();
        });
    });
    load();
});
</script>
</body></html>
