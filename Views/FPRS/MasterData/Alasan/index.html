<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Alasan – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

            <div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
                <div><h2 class="title-page mb-1">Alasan</h2><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Alasan</li></ol></nav></div>
                <button class="btn btn-success" onclick="openModal()"><i class="fa fa-plus me-1"></i> Tambah Alasan</button>
            </div>
            <div class="alert alert-info alert-dismissible fade show border-0 shadow-sm mb-3" role="alert">
                <i class="fa fa-link me-2 text-info"></i>
                <strong>Integrasi Master Data API:</strong> Modul ini terintegrasi dengan API: 
                <a href="https://master-datadev.kalbenutritionals.web.id/swagger/index.html" target="_blank" class="alert-link text-decoration-underline"><code>/api/v1/Param</code></a> (Parameter Management)
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card"><div class="card-body"><div class="table-responsive">
                <table class="table table-bordered table-hover" id="tbl">
                    <thead><tr><th style="width:50px;">NO</th><th title="Tabel: mAlasan | Kolom: txtNama">NAMA ALASAN</th><th title="Tabel: mAlasan | Kolom: txtDeskripsi">DESKRIPSI</th><th style="width:120px;" title="Tabel: mAlasan | Kolom: txtTipe">TIPE</th><th style="width:100px;text-align:center;">AKSI</th></tr></thead>
                    <tbody id="tblBody"></tbody>
                </table>
            </div></div></div>
<div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Tambah Alasan</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" id="editId" />
            <div class="mb-3"><label class="form-label" title="Tabel: mAlasan | Kolom: txtNama">Nama Alasan <span class="required-mark">*</span></label><input type="text" class="form-control" id="inputNama" placeholder="Nama alasan..." title="Tabel: mAlasan | Kolom: txtNama" /></div>
            <div class="mb-3"><label class="form-label" title="Tabel: mAlasan | Kolom: txtDeskripsi">Deskripsi</label><textarea class="form-control" id="inputDeskripsi" rows="2" placeholder="Deskripsi alasan..." title="Tabel: mAlasan | Kolom: txtDeskripsi"></textarea></div>
            <div class="mb-3"><label class="form-label" title="Tabel: mAlasan | Kolom: txtTipe">Tipe <span class="required-mark">*</span></label>
                <select class="form-select" id="inputTipe" title="Tabel: mAlasan | Kolom: txtTipe">
                    <option value="">-- Pilih Tipe --</option>
                    <option value="Return">Return</option>
                    <option value="Kunjungan">Kunjungan</option>
                    <option value="Order">Order</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveItem()"><i class="fa fa-save me-1"></i> Simpan</button></div>
    </div></div>
</div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_alasan';
const TIPE_BADGE={Return:'<span class="badge bg-warning text-dark">Return</span>',Kunjungan:'<span class="badge bg-info text-dark">Kunjungan</span>',Order:'<span class="badge bg-primary">Order</span>',Lainnya:'<span class="badge bg-secondary">Lainnya</span>'};
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}
function loadData(){if(!localStorage.getItem(KEY)){fetch('../../../../wwwroot/data/alasan.json').then(r=>r.json()).then(d=>{saveData(d);render();});}else{render();}}
function render(){
    if($.fn.DataTable.isDataTable('#tbl'))$('#tbl').DataTable().destroy();
    $('#tblBody').empty();
    getData().forEach((item,i)=>{$('#tblBody').append(`<tr><td>${i+1}</td><td><strong>${item.nama}</strong></td><td>${item.deskripsi||'-'}</td><td>${TIPE_BADGE[item.tipe]||item.tipe}</td><td><div class="row-actions"><button class="btn-action btn-action-edit" onclick="editItem('${item.id}')" title="Edit"><i class="fa fa-pen"></i></button><button class="btn-action btn-action-delete" onclick="del('${item.id}','${item.nama.replace(/'/g,"\\'")}')" title="Hapus"><i class="fa fa-trash"></i></button></div></td></tr>`);});
    $('#tbl').DataTable({language:{search:'',searchPlaceholder:'Cari...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,columnDefs:[{orderable:false,targets:[4]}],dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
}
function openModal(item=null){
    document.getElementById('editId').value=item?item.id:'';
    document.getElementById('inputNama').value=item?item.nama:'';
    document.getElementById('inputDeskripsi').value=item?item.deskripsi:'';
    document.getElementById('inputTipe').value=item?item.tipe:'';
    document.getElementById('modalTitle').textContent=item?'Ubah Alasan':'Tambah Alasan';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalForm')).show();
}
function editItem(id){const item=getData().find(d=>String(d.id)===String(id));if(item)openModal(item);}
function saveItem(){
    const nama=document.getElementById('inputNama').value.trim();
    const tipe=document.getElementById('inputTipe').value;
    if(!nama||!tipe){Swal.fire('Peringatan','Nama dan Tipe wajib diisi.','warning');return;}
    const data=getData();const id=document.getElementById('editId').value;
    const obj={id:id?(isNaN(id)?id:parseInt(id)):Date.now(),nama,deskripsi:document.getElementById('inputDeskripsi').value.trim(),tipe};
    if(id){const idx=data.findIndex(d=>String(d.id)===String(id));if(idx>-1)data[idx]=obj;}else{data.push(obj);}
    saveData(data);bootstrap.Modal.getOrCreateInstance(document.getElementById('modalForm')).hide();render();
    Swal.fire({icon:'success',title:'Berhasil!',timer:1500,showConfirmButton:false});
}
function del(id,nama){Swal.fire({title:`Hapus "${nama}"?`,icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#6c757d',confirmButtonText:'Ya, Hapus',cancelButtonText:'Batal'}).then(r=>{if(r.isConfirmed){saveData(getData().filter(d=>String(d.id)!==String(id)));render();Swal.fire({icon:'success',title:'Dihapus!',timer:1200,showConfirmButton:false});}});}
$(document).ready(loadData);
window.openModal = openModal; window.del = del; window.editItem = editItem; window.saveItem = saveItem;
        });
    </script>
</body>
</html>
