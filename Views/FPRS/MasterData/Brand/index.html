<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Brand – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}@font-face{font-family:'Kalbe Geometric';font-weight:700;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Bold.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

                <div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
                    <div>
                        <h2 class="title-page mb-1">Brand</h2>
                        <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Brand</li></ol></nav>
                    </div>
                    <button class="btn btn-success" onclick="openModal()"><i class="fa fa-plus me-1"></i> Tambah Brand</button>
                </div>
                <div class="alert alert-info alert-dismissible fade show border-0 shadow-sm mb-3" role="alert">
                    <i class="fa fa-link me-2 text-info"></i>
                    <strong>Integrasi Master Data API:</strong> Modul ini terintegrasi dengan API: 
                    <a href="https://master-datadev.kalbenutritionals.web.id/swagger/index.html" target="_blank" class="alert-link text-decoration-underline"><code>/api/v1/Brand</code></a>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card"><div class="card-body"><div class="table-responsive">
                    <table class="table table-bordered table-hover" id="tblBrand">
                        <thead><tr><th style="width:50px;">NO</th><th>NAMA</th><th>DESKRIPSI</th><th style="width:120px;text-align:center;">TOTAL PRODUK</th><th style="width:100px;text-align:center;">AKSI</th></tr></thead>
                        <tbody id="tblBody"></tbody>
                    </table>
                </div></div></div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_brand';
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}
function loadData(){if(!localStorage.getItem(KEY)){fetch('../../../../wwwroot/data/brand.json').then(r=>r.json()).then(d=>{saveData(d);renderTable();});}else{renderTable();}}
function renderTable(){
    if($.fn.DataTable.isDataTable('#tblBrand'))$('#tblBrand').DataTable().destroy();
    const data=getData();$('#tblBody').empty();
    data.forEach((item,i)=>{$('#tblBody').append(`<tr><td>${i+1}</td><td><strong>${item.nama}</strong></td><td>${item.deskripsi||'-'}</td><td class="text-center">${item.totalProduk||0}</td><td><div class="row-actions"><button class="btn-action btn-action-edit" onclick="editItem(${item.id})" title="Edit"><i class="fa fa-pen"></i></button><button class="btn-action btn-action-delete" onclick="deleteItem(${item.id},'${item.nama}')" title="Hapus"><i class="fa fa-trash"></i></button></div></td></tr>`);});
    $('#tblBrand').DataTable({language:{search:'',searchPlaceholder:'Cari...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,columnDefs:[{orderable:false,targets:[4]}],dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
}
function openModal(item=null){
    document.getElementById('editId').value=item?item.id:'';
    document.getElementById('inputNama').value=item?item.nama:'';
    document.getElementById('inputDeskripsi').value=item?item.deskripsi:'';
    document.getElementById('modalTitle').textContent=item?'Ubah Brand':'Tambah Brand';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalBrand')).show();
}
function editItem(id){const item=getData().find(d=>d.id===id);if(item)openModal(item);}
function saveItem(){
    const nama=document.getElementById('inputNama').value.trim();
    if(!nama){Swal.fire('Peringatan','Nama brand wajib diisi.','warning');return;}
    const data=getData();const id=document.getElementById('editId').value;
    const obj={id:id?parseInt(id):Date.now(),nama,deskripsi:document.getElementById('inputDeskripsi').value.trim(),totalProduk:0};
    if(id){const idx=data.findIndex(d=>d.id===parseInt(id));if(idx>-1)data[idx]=obj;}else{data.push(obj);}
    saveData(data);bootstrap.Modal.getOrCreateInstance(document.getElementById('modalBrand')).hide();renderTable();
    Swal.fire({icon:'success',title:'Berhasil!',text:`Brand "${nama}" telah disimpan.`,timer:1500,showConfirmButton:false});
}
function deleteItem(id,nama){
    Swal.fire({title:`Hapus Brand "${nama}"?`,text:'Tindakan ini tidak dapat dibatalkan.',icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#6c757d',confirmButtonText:'Ya, Hapus',cancelButtonText:'Batal'}).then(r=>{
        if(r.isConfirmed){saveData(getData().filter(d=>d.id!==id));renderTable();Swal.fire({icon:'success',title:'Dihapus!',timer:1200,showConfirmButton:false});}
    });
}
$(document).ready(loadData);
window.openModal = openModal; window.editItem = editItem; window.deleteItem = deleteItem;
        });
    </script>
</body>
</html>
