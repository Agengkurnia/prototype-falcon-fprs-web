<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Form Pegawai – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}@font-face{font-family:'Kalbe Geometric';font-weight:700;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Bold.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

                <div class="mb-3">
                    <h2 class="title-page mb-1" id="formTitle">Tambah Pegawai</h2>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li>
                            <li class="breadcrumb-item">Data Master</li>
                            <li class="breadcrumb-item"><a href="index.html" class="a-breadcrumb">Pegawai</a></li>
                            <li class="breadcrumb-item active" id="breadcrumbActive">Tambah</li>
                        </ol>
                    </nav>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <form id="formPegawai" onsubmit="saveDataForm(event)">
                            <input type="hidden" id="editId" />
                            
                            <div class="row g-3">
                                <h5 class="border-bottom pb-2 text-success"><i class="fa fa-info-circle me-1"></i> Data Karyawan</h5>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Kode Karyawan <span class="required-mark">*</span></label>
                                    <input type="text" class="form-control" id="kode" placeholder="EMP-XXXX (Akan diisi otomatis jika kosong)" maxlength="50" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nama Karyawan <span class="required-mark">*</span></label>
                                    <input type="text" class="form-control" id="nama" placeholder="Nama lengkap karyawan..." maxlength="100" required />
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Posisi / Jabatan <span class="required-mark">*</span></label>
                                    <select class="form-select" id="posisi" required>
                                        <option value="">-- Pilih Posisi --</option>
                                        <option value="Salesman">Salesman</option>
                                        <option value="SPG">SPG</option>
                                        <option value="Admin">Admin</option>
                                        <option value="Supervisor">Supervisor</option>
                                        <option value="Manager">Manager</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Divisi <span class="required-mark">*</span></label>
                                    <select class="form-select" id="divisi" required>
                                        <option value="">-- Pilih Divisi --</option>
                                        <option value="Nutritional">Nutritional</option>
                                        <option value="Kalbe">Kalbe</option>
                                        <option value="Pharma">Pharma</option>
                                        <option value="Health Food">Health Food</option>
                                    </select>
                                </div>
                                
                                <h5 class="border-bottom pb-2 text-success mt-4"><i class="fa fa-user-lock me-1"></i> Kredensial Akun</h5>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Username</label>
                                    <input type="text" class="form-control" id="username" placeholder="Username login (opsional)..." maxlength="50" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Status Kepegawaian <span class="required-mark">*</span></label>
                                    <select class="form-select" id="status" required>
                                        <option value="Active">Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a href="index.html" class="btn btn-secondary"><i class="fa fa-times me-1"></i> Batal</a>
                                <button type="submit" class="btn btn-success"><i class="fa fa-save me-1"></i> Simpan Pegawai</button>
                            </div>
                        </form>
                    </div>
                </div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_pegawai';

function getLocalData() {
    return JSON.parse(localStorage.getItem(KEY) || '[]');
}

function setLocalData(data) {
    localStorage.setItem(KEY, JSON.stringify(data));
}

function checkEditMode() {
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    if (editId) {
        document.getElementById('formTitle').textContent = 'Ubah Pegawai';
        document.getElementById('breadcrumbActive').textContent = 'Ubah';
        document.getElementById('editId').value = editId;
        
        const dataList = getLocalData();
        const item = dataList.find(d => d.id === parseInt(editId));
        if (item) {
            document.getElementById('kode').value = item.kode || '';
            document.getElementById('nama').value = item.nama || '';
            document.getElementById('posisi').value = item.posisi || '';
            document.getElementById('divisi').value = item.divisi || '';
            document.getElementById('username').value = item.username || '';
            document.getElementById('status').value = item.status || 'Active';
            
            // Kode is read-only in Edit mode
            document.getElementById('kode').readOnly = true;
        }
    }
}

function saveDataForm(event) {
    event.preventDefault();
    
    const nama = document.getElementById('nama').value.trim();
    if (!nama) {
        Swal.fire('Peringatan', 'Nama karyawan wajib diisi.', 'warning');
        return;
    }
    
    const dataList = getLocalData();
    const editId = document.getElementById('editId').value;
    let kode = document.getElementById('kode').value.trim();
    
    if (!kode && !editId) {
        const lastNum = dataList.length + 1;
        kode = 'EMP-' + String(lastNum).padStart(3, '0');
    }
    
    const newObj = {
        id: editId ? parseInt(editId) : Date.now(),
        kode: kode,
        nama: nama,
        posisi: document.getElementById('posisi').value,
        divisi: document.getElementById('divisi').value,
        username: document.getElementById('username').value.trim(),
        status: document.getElementById('status').value
    };
    
    if (editId) {
        const idx = dataList.findIndex(d => d.id === parseInt(editId));
        if (idx > -1) {
            dataList[idx] = newObj;
        }
    } else {
        dataList.push(newObj);
    }
    
    setLocalData(dataList);
    
    Swal.fire({
        icon: 'success',
        title: 'Berhasil!',
        text: `Pegawai "${nama}" telah disimpan.`,
        timer: 1500,
        showConfirmButton: false
    }).then(() => {
        window.location.href = 'index.html';
    });
}

$(document).ready(function() {
    checkEditMode();
});

        });
    </script>
</body>
</html>
