<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Employee | Falcon FPRS</title>
<link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
<link rel="stylesheet" href="../../../../wwwroot/css/filter-stat-cards.css"/>
</head>
<body>
<div id="app-content">
<div class="card mb-3"><div class="card-body d-flex justify-content-between flex-wrap gap-2"><h4 class="mb-0">Employee</h4>
<div class="d-flex gap-2">
<button class="btn btn-outline-secondary d-none" id="btnBack" type="button">Back</button>
<label class="btn btn-success mb-0">Upload Data<input type="file" id="fileX" accept=".xlsx,.csv" hidden/></label>
</div></div></div>
<div id="editor" class="card mb-3 d-none"><div class="card-header mpg-gradient d-flex justify-content-between"><span>Spreadsheet preview</span><button class="btn btn-light" id="btnApply" type="button">Apply rows</button></div>
<div class="card-body table-responsive"><table class="table" id="grid"><thead><tr><th>NIK</th><th>Name</th><th>Position</th><th>Position Type</th><th>Branch</th><th>Region</th><th>Phone</th><th>Notes</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>
<div id="list">
<div class="row g-3 mb-3" id="cards">
<div class="col-6 col-md-3"><div class="mpg-stat-card mpg-stat-total is-filtered" data-filter=""><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cT">0</div><div class="mpg-stat-label">Total</div></div></div>
<div class="col-6 col-md-3"><div class="mpg-stat-card mpg-stat-motoris" data-filter="motoris"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cM">0</div><div class="mpg-stat-label">Motoris</div></div></div>
<div class="col-6 col-md-3"><div class="mpg-stat-card mpg-stat-spg" data-filter="spg"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cS">0</div><div class="mpg-stat-label">SPG GT</div></div></div>
<div class="col-6 col-md-3"><div class="mpg-stat-card mpg-stat-active" data-filter="active"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cA">0</div><div class="mpg-stat-label">Active</div></div></div>
</div>
<div class="card"><div class="card-body"><table class="table" id="tbl" style="width:100%"><thead>
<tr><th>No</th><th>NIK</th><th>Name</th><th>Position</th><th>Branch</th><th>Region</th><th>Status</th></tr>
<tr class="dt-col-search"><th></th>
<th><div class="input-group input-group-sm"><input class="form-control col-search" data-col="1" placeholder="Search"/><button class="btn btn-outline-success btn-col-search" type="button"><i class="fa fa-search"></i></button></div></th>
<th><div class="input-group input-group-sm"><input class="form-control col-search" data-col="2" placeholder="Search"/><button class="btn btn-outline-success btn-col-search" type="button"><i class="fa fa-search"></i></button></div></th>
<th></th><th></th><th></th>
<th><select class="form-select form-select-sm col-search" data-col="6"><option value="">All</option><option>Active</option><option>Inactive</option></select></th>
</tr></thead><tbody></tbody></table></div></div>
</div>
<div id="detail" class="d-none"><div class="row g-3">
<div class="col-md-6"><div class="card h-100"><div class="card-header mpg-gradient">Profile</div><div class="card-body">
<div class="row mb-2"><label class="col-4 text-muted">NIK</label><div class="col-8"><input class="form-control" id="dNik" disabled/></div></div>
<div class="row mb-2"><label class="col-4 text-muted">Name</label><div class="col-8"><input class="form-control" id="dNama" disabled/></div></div>
<div class="row mb-2"><label class="col-4 text-muted">Position</label><div class="col-8"><input class="form-control" id="dPos" disabled/></div></div>
<div class="row mb-2"><label class="col-4 text-muted">Position Type</label><div class="col-8"><input class="form-control" id="dType" disabled/></div></div>
<div class="row mb-2"><label class="col-4 text-muted">Phone</label><div class="col-8"><input class="form-control" id="dTel" disabled/></div></div>
<div class="row"><label class="col-4 text-muted">Status</label><div class="col-8"><input class="form-control" id="dStat" disabled/></div></div>
</div></div></div>
<div class="col-md-6"><div class="card h-100"><div class="card-header mpg-gradient">Assignment</div><div class="card-body">
<div class="row mb-2"><label class="col-4 text-muted">Branch</label><div class="col-8"><input class="form-control" id="dBr" disabled/></div></div>
<div class="row mb-2"><label class="col-4 text-muted">Region</label><div class="col-8"><input class="form-control" id="dRg" disabled/></div></div>
<div class="row"><label class="col-4 text-muted">Notes</label><div class="col-8"><textarea class="form-control" id="dNote" disabled></textarea></div></div>
</div></div></div>
<div class="col-12"><div class="card"><div class="card-header mpg-gradient">Status History</div><div class="card-body p-0"><table class="table mb-0"><thead><tr><th>Date</th><th>Status</th><th>Source</th><th>Notes</th><th>By</th></tr></thead><tbody id="hist"></tbody></table></div></div></div>
</div></div>
</div>
<script src="../../../../wwwroot/js/layout.js"></script>
<script src="../../../../wwwroot/js/prototype-spa.js"></script>
<script>
document.addEventListener("layoutReady", function () {
    const KEY = "md_pegawai", VER = "real-jul2026-b";
    let rows = [], table, filter = "";
    const active = r => r.status === "Active";
    const role = r => (r.role || "").toLowerCase();
    function load() {
        const need = !localStorage.getItem(KEY) || localStorage.getItem("md_pegawai_seed_ver") !== VER;
        const done = d => { rows = d; paint(); };
        if (need) fetch("../../../../wwwroot/data/pegawai.json").then(r => r.json()).then(d => { localStorage.setItem(KEY, JSON.stringify(d)); localStorage.setItem("md_pegawai_seed_ver", VER); done(d); });
        else done(JSON.parse(localStorage.getItem(KEY)));
    }
    function paint() {
        $("#cT").text(rows.length);
        $("#cM").text(rows.filter(r => role(r).indexOf("motor") >= 0).length);
        $("#cS").text(rows.filter(r => role(r).indexOf("spg") >= 0).length);
        $("#cA").text(rows.filter(active).length);
        if ($.fn.DataTable.isDataTable("#tbl")) $("#tbl").DataTable().destroy();
        const b = $("#tbl tbody").empty();
        rows.forEach((r, i) => b.append("<tr><td>" + (i+1) + "</td><td>" + r.kode + "</td><td><a href='#' class='text-success fw-bold open' data-id='" + r.id + "'>" + r.nama + "</a></td><td>" + (r.role||"") + "</td><td>" + (r.branch||"—") + "</td><td>" + (r.region||"—") + "</td><td>" + PrototypeSpa.statusBadge(active(r)) + "</td></tr>"));
        table = $("#tbl").DataTable(PrototypeSpa.dtOpts());
        PrototypeSpa.bindColumnSearch(table, "#list");
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn._pg);
        const fn = function (settings, data) {
            if (settings.nTable.id !== "tbl" || !filter) return true;
            if (filter === "motoris") return String(data[3]).toLowerCase().indexOf("motor") >= 0;
            if (filter === "spg") return String(data[3]).toLowerCase().indexOf("spg") >= 0;
            const on = String(data[6]).indexOf("Inactive") < 0;
            return filter === "active" ? on : true;
        };
        fn._pg = true; $.fn.dataTable.ext.search.push(fn);
    }
    function showList() { $("#detail").addClass("d-none"); $("#list,#cards").removeClass("d-none"); $("#btnBack").addClass("d-none"); }
    $("#cards").on("click", ".mpg-stat-card", function () { filter = $(this).data("filter") || ""; PrototypeSpa.setFilteredCard("#cards", filter); if (table) table.draw(); });
    $("#tbl").on("click", ".open", function (e) {
        e.preventDefault();
        const r = rows.find(x => String(x.id) === String($(this).data("id")));
        if (!r) return;
        $("#dNik").val(r.kode); $("#dNama").val(r.nama); $("#dPos").val(r.role||""); $("#dType").val(r.positionType || r.keterangan || "");
        $("#dTel").val(r.telepon||""); $("#dStat").val(r.status||""); $("#dBr").val(r.branch||""); $("#dRg").val(r.region||""); $("#dNote").val(r.keterangan||"");
        $("#hist").html("<tr><td>" + PrototypeSpa.fmtDate(r.updated || "") + "</td><td>" + (r.status||"") + "</td><td>Seed</td><td>" + (r.keterangan||"") + "</td><td>System</td></tr>");
        $("#list").addClass("d-none"); $("#detail").removeClass("d-none"); $("#btnBack").removeClass("d-none");
    });
    $("#btnBack").on("click", function () { PrototypeSpa.confirm("Back to employee list?", showList); });
    $("#fileX").on("change", function () {
        const body = $("#grid tbody").empty();
        rows.slice(0, 8).forEach(r => body.append("<tr><td contenteditable>" + r.kode + "</td><td contenteditable>" + r.nama + "</td><td contenteditable>" + (r.role||"") + "</td><td contenteditable>" + (r.positionType||"") + "</td><td contenteditable>" + (r.branch||"") + "</td><td contenteditable>" + (r.region||"") + "</td><td contenteditable>" + (r.telepon||"") + "</td><td contenteditable>" + (r.keterangan||"") + "</td><td contenteditable>" + (r.status||"Active") + "</td></tr>"));
        $("#editor").removeClass("d-none");
        this.value = "";
    });
    $("#btnApply").on("click", function () {
        PrototypeSpa.confirm("Apply the spreadsheet rows?", function () {
            $("#grid tbody tr").each(function () {
                const c = $(this).children();
                const nik = $(c[0]).text().trim();
                let r = rows.find(x => x.kode === nik);
                if (!r) { r = { id: Date.now() + Math.random(), kode: nik }; rows.push(r); }
                r.nama = $(c[1]).text().trim(); r.role = $(c[2]).text().trim(); r.positionType = $(c[3]).text().trim();
                r.branch = $(c[4]).text().trim(); r.region = $(c[5]).text().trim(); r.telepon = $(c[6]).text().trim();
                r.keterangan = $(c[7]).text().trim(); r.status = $(c[8]).text().trim() || "Active";
            });
            localStorage.setItem(KEY, JSON.stringify(rows));
            $("#editor").addClass("d-none");
            paint();
        });
    });
    load();
});
</script>
</body></html>
