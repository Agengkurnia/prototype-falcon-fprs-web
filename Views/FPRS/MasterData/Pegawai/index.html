<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Master Pegawai – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

            <div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
                <div><h2 class="title-page mb-1">Master Pegawai</h2><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Master Pegawai</li></ol></nav></div>
                <a href="add.html" class="btn btn-success"><i class="fa fa-plus me-1"></i> Tambah Pegawai</a>
            </div>
            <!-- Summary cards -->
            <div class="row g-3 mb-3">
                <div class="col-6 col-md-3"><div class="card text-center border-0 shadow-sm"><div class="card-body py-3"><div class="fs-4 fw-bold text-primary" id="cntTotal">0</div><div class="small text-muted">Total Pegawai</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center border-0 shadow-sm"><div class="card-body py-3"><div class="fs-4 fw-bold text-success" id="cntActive">0</div><div class="small text-muted">Aktif</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center border-0 shadow-sm"><div class="card-body py-3"><div class="fs-4 fw-bold text-danger" id="cntInactive">0</div><div class="small text-muted">Nonaktif</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center border-0 shadow-sm"><div class="card-body py-3"><div class="fs-4 fw-bold text-warning" id="cntNoAkun">0</div><div class="small text-muted">Tanpa Akun</div></div></div></div>
            </div>
            <div class="alert alert-info alert-dismissible fade show border-0 shadow-sm mb-3" role="alert">
                <i class="fa fa-link me-2 text-info"></i>
                <strong>Integrasi Master Data API:</strong> Modul ini terintegrasi dengan API: 
                <a href="https://master-datadev.kalbenutritionals.web.id/swagger/index.html" target="_blank" class="alert-link text-decoration-underline"><code>/api/v1/Employee</code></a>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card"><div class="card-body"><div class="table-responsive">
                <table class="table table-bordered table-hover" id="tbl">
                    <thead>
                        <tr><th style="width:50px;">NO</th><th>KODE</th><th>NAMA</th><th>POSISI</th><th>DIVISI</th><th>USERNAME</th><th style="width:100px;">STATUS</th><th style="width:100px;text-align:center;">AKSI</th></tr>
                        <tr class="filter-row">
                            <th></th><th><input type="text" class="form-control form-control-sm" placeholder="Filter kode..."></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Filter nama..."></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Filter posisi..."></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Filter divisi..."></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Filter username..."></th>
                            <th><select class="form-select form-select-sm"><option value="">Semua</option><option>Active</option><option>Inactive</option></select></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tblBody"></tbody>
                </table>
            </div></div></div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_pegawai';
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}
function loadData(){if(!localStorage.getItem(KEY)){fetch('../../../../wwwroot/data/pegawai.json').then(r=>r.json()).then(d=>{saveData(d);render();});}else{render();}}
let table;
function render(){
    if($.fn.DataTable.isDataTable('#tbl'))$('#tbl').DataTable().destroy();
    const data=getData();$('#tblBody').empty();
    const active=data.filter(d=>d.status==='Active').length;
    $('#cntTotal').text(data.length);$('#cntActive').text(active);
    $('#cntInactive').text(data.length-active);$('#cntNoAkun').text(data.filter(d=>!d.username).length);
    data.forEach((item,i)=>{
        const badge=item.status==='Active'?'<span class="badge-status badge-active">Active</span>':'<span class="badge-status badge-inactive">Inactive</span>';
        $('#tblBody').append(`<tr><td>${i+1}</td><td><small class="text-muted">${item.kode}</small></td><td><strong>${item.nama}</strong></td><td>${item.posisi||'-'}</td><td>${item.divisi||'-'}</td><td>${item.username?'<code>'+item.username+'</code>':'-'}</td><td>${badge}</td><td><div class="row-actions"><a href="add.html?id=${item.id}" class="btn-action btn-action-edit" title="Edit"><i class="fa fa-pen"></i></a><button class="btn-action btn-action-delete" onclick="del(${item.id},'${item.nama.replace(/'/g,"\\'")}')" title="Hapus"><i class="fa fa-trash"></i></button></div></td></tr>`);
    });
    table=$('#tbl').DataTable({language:{search:'',searchPlaceholder:'Cari global...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,columnDefs:[{orderable:false,targets:[7]}],dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
    $('.filter-row input').on('keyup change',function(){table.column($(this).closest('th').index()).search(this.value).draw();});
    $('.filter-row select').on('change',function(){table.column($(this).closest('th').index()).search(this.value).draw();});
    $('.filter-row input,.filter-row select').on('click',function(e){e.stopPropagation();});
}
function del(id,nama){Swal.fire({title:`Hapus Pegawai "${nama}"?`,icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#6c757d',confirmButtonText:'Ya, Hapus',cancelButtonText:'Batal'}).then(r=>{if(r.isConfirmed){saveData(getData().filter(d=>d.id!==id));render();Swal.fire({icon:'success',title:'Dihapus!',timer:1200,showConfirmButton:false});}});}
$(document).ready(loadData);
window.del = del;
        });
    </script>
</body>
</html>
