<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Supplier – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

<div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
<div><h2 class="title-page mb-1">Supplier</h2><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Supplier</li></ol></nav></div>
<a href="add.html" class="btn btn-success"><i class="fa fa-plus me-1"></i> Tambah Supplier</a>
</div>
<div class="card"><div class="card-body"><div class="table-responsive">
<table class="table table-bordered table-hover" id="tbl">
<thead>
<tr><th style="width:50px;">NO</th><th>KODE</th><th>NAMA SUPPLIER</th><th>ALAMAT</th><th>TELEPON</th><th style="width:80px;">STATUS</th><th style="width:100px;text-align:center;">AKSI</th></tr>
<tr class="filter-row"><th></th><th><input type="text" class="form-control form-control-sm" placeholder="Kode..."></th><th><input type="text" class="form-control form-control-sm" placeholder="Nama..."></th><th></th><th></th><th><select class="form-select form-select-sm"><option value="">Semua</option><option>Active</option><option>Inactive</option></select></th><th></th></tr>
</thead>
<tbody id="tblBody"></tbody>
</table></div></div></div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_supplier';
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}
function loadData(){if(!localStorage.getItem(KEY)){const dummy=[{id:1,kode:'SUP001',nama:'PT Kalbe Farma',alamat:'Jl. Let. Jend. Suprapto Kav. 4, Jakarta Pusat',telepon:'02142873888',email:'supplier@kalbe.co.id',waktuPembayaran:'Net 30',status:'Active'},{id:2,kode:'SUP002',nama:'PT Nutrifood Indonesia',alamat:'Jl. Rawabali II No.3, Jakarta Timur',telepon:'02148702168',email:'purchase@nutrifood.co.id',waktuPembayaran:'Net 30',status:'Active'},{id:3,kode:'SUP003',nama:'PT Sari Husada',alamat:'Jl. Kusumanegara No.173, Yogyakarta',telepon:'02746008800',email:'procurement@sarihusada.co.id',waktuPembayaran:'Net 45',status:'Active'}];saveData(dummy);render();}else{render();}}
let table;
function render(){
if($.fn.DataTable.isDataTable('#tbl'))$('#tbl').DataTable().destroy();$('#tblBody').empty();
getData().forEach((item,i)=>{const badge=item.status==='Active'?'<span class="badge-status badge-active">Active</span>':'<span class="badge-status badge-inactive">Inactive</span>';$('#tblBody').append(`<tr><td>${i+1}</td><td><code>${item.kode}</code></td><td><strong>${item.nama}</strong></td><td><small>${item.alamat||'-'}</small></td><td>${item.telepon||'-'}</td><td>${badge}</td><td><div class="row-actions"><a href="add.html?id=${item.id}" class="btn-action btn-action-edit" title="Edit"><i class="fa fa-pen"></i></a><button class="btn-action btn-action-delete" onclick="del(${item.id},'${item.nama.replace(/'/g,"\\'")}')" title="Hapus"><i class="fa fa-trash"></i></button></div></td></tr>`);});
table=$('#tbl').DataTable({language:{search:'',searchPlaceholder:'Cari global...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,columnDefs:[{orderable:false,targets:[3,4,6]}],dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
$('.filter-row input').on('keyup change',function(){table.column($(this).closest('th').index()).search(this.value).draw();});
$('.filter-row select').on('change',function(){table.column($(this).closest('th').index()).search(this.value).draw();});
$('.filter-row input,.filter-row select').on('click',function(e){e.stopPropagation();});
}
function del(id,nama){Swal.fire({title:`Hapus Supplier "${nama}"?`,icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#6c757d',confirmButtonText:'Ya, Hapus',cancelButtonText:'Batal'}).then(r=>{if(r.isConfirmed){saveData(getData().filter(d=>d.id!==id));render();Swal.fire({icon:'success',title:'Dihapus!',timer:1200,showConfirmButton:false});}});}
$(document).ready(loadData);
window.del = del;
        });
    </script>
</body>
</html>
