<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Form Supplier – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}@font-face{font-family:'Kalbe Geometric';font-weight:700;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Bold.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

                <div class="mb-3">
                    <h2 class="title-page mb-1" id="formTitle">Tambah Supplier</h2>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li>
                            <li class="breadcrumb-item">Data Master</li>
                            <li class="breadcrumb-item"><a href="index.html" class="a-breadcrumb">Supplier</a></li>
                            <li class="breadcrumb-item active" id="breadcrumbActive">Tambah</li>
                        </ol>
                    </nav>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <form id="formSupplier" onsubmit="saveDataForm(event)">
                            <input type="hidden" id="editId" />
                            
                            <div class="row g-3">
                                <h5 class="border-bottom pb-2 text-success"><i class="fa fa-truck me-1"></i> Data Supplier</h5>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Kode Supplier <span class="required-mark">*</span></label>
                                    <input type="text" class="form-control" id="kode" placeholder="SUPXXXX (Akan diisi otomatis jika kosong)" maxlength="50" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nama Supplier <span class="required-mark">*</span></label>
                                    <input type="text" class="form-control" id="nama" placeholder="Nama lengkap supplier/badan usaha..." maxlength="100" required />
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Telepon</label>
                                    <input type="text" class="form-control" id="telepon" placeholder="Nomor telepon aktif..." maxlength="20" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="Alamat email supplier..." maxlength="80" />
                                </div>
                                
                                <div class="col-12">
                                    <label class="form-label fw-bold">Alamat Lengkap</label>
                                    <textarea class="form-control" id="alamat" rows="2" placeholder="Nama jalan, nomor, kota..." maxlength="250"></textarea>
                                </div>
                                
                                <h5 class="border-bottom pb-2 text-success mt-4"><i class="fa fa-file-invoice-dollar me-1"></i> Pengaturan Transaksi</h5>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Waktu Pembayaran <span class="required-mark">*</span></label>
                                    <select class="form-select" id="waktuPembayaran" required>
                                        <option value="Cash">Cash</option>
                                        <option value="Net 7">Net 7</option>
                                        <option value="Net 14">Net 14</option>
                                        <option value="Net 30">Net 30</option>
                                        <option value="Net 45">Net 45</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Status Hubungan <span class="required-mark">*</span></label>
                                    <select class="form-select" id="status" required>
                                        <option value="Active">Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a href="index.html" class="btn btn-secondary"><i class="fa fa-times me-1"></i> Batal</a>
                                <button type="submit" class="btn btn-success"><i class="fa fa-save me-1"></i> Simpan Supplier</button>
                            </div>
                        </form>
                    </div>
                </div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_supplier';

function getLocalData() {
    return JSON.parse(localStorage.getItem(KEY) || '[]');
}

function setLocalData(data) {
    localStorage.setItem(KEY, JSON.stringify(data));
}

function checkEditMode() {
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    if (editId) {
        document.getElementById('formTitle').textContent = 'Ubah Supplier';
        document.getElementById('breadcrumbActive').textContent = 'Ubah';
        document.getElementById('editId').value = editId;
        
        const dataList = getLocalData();
        const item = dataList.find(d => String(d.id)===String(editId));
        if (item) {
            document.getElementById('kode').value = item.kode || '';
            document.getElementById('nama').value = item.nama || '';
            document.getElementById('telepon').value = item.telepon || '';
            document.getElementById('email').value = item.email || '';
            document.getElementById('alamat').value = item.alamat || '';
            document.getElementById('waktuPembayaran').value = item.waktuPembayaran || 'Net 30';
            document.getElementById('status').value = item.status || 'Active';
            
            // Kode is read-only in Edit mode
            document.getElementById('kode').readOnly = true;
        }
    }
}

function saveDataForm(event) {
    event.preventDefault();
    
    const nama = document.getElementById('nama').value.trim();
    if (!nama) {
        Swal.fire('Peringatan', 'Nama supplier wajib diisi.', 'warning');
        return;
    }
    
    const dataList = getLocalData();
    const editId = document.getElementById('editId').value;
    let kode = document.getElementById('kode').value.trim();
    
    if (!kode && !editId) {
        const lastNum = dataList.length + 1;
        kode = 'SUP' + String(lastNum).padStart(3, '0');
    }
    
    const newObj = {
        id: editId?(isNaN(editId)?editId:parseInt(editId)):Date.now(),
        kode: kode,
        nama: nama,
        telepon: document.getElementById('telepon').value.trim(),
        email: document.getElementById('email').value.trim(),
        alamat: document.getElementById('alamat').value.trim(),
        waktuPembayaran: document.getElementById('waktuPembayaran').value,
        status: document.getElementById('status').value
    };
    
    if (editId) {
        const idx = dataList.findIndex(d => String(d.id)===String(editId));
        if (idx > -1) {
            dataList[idx] = newObj;
        }
    } else {
        dataList.push(newObj);
    }
    
    setLocalData(dataList);
    
    Swal.fire({
        icon: 'success',
        title: 'Berhasil!',
        text: `Supplier "${nama}" telah disimpan.`,
        timer: 1500,
        showConfirmButton: false
    }).then(() => {
        window.location.href = 'index.html';
    });
}

$(document).ready(function() {
    checkEditMode();
});
window.saveDataForm = saveDataForm;

        });
    </script>
</body>
</html>
