<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Channel | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
</head>
<body>
<div id="app-content">
    <div class="card mb-3"><div class="card-body"><h4 class="mb-0">Channel</h4></div></div>
    <div class="card"><div class="card-body">
        <div class="row g-2 mb-3">
            <div class="col-md-4"><label class="form-label">Outlet Channel Type</label><select class="form-select" id="fChannel"><option value="">All</option></select></div>
            <div class="col-md-4"><label class="form-label">Outlet Account Type</label><select class="form-select" id="fAccount"><option value="">All</option></select></div>
            <div class="col-md-4"><label class="form-label">Type Partner</label><select class="form-select" id="fPartner"><option value="">All</option></select></div>
        </div>
        <table class="table" id="tbl" style="width:100%">
            <thead><tr><th>No</th><th>Outlet Channel Type</th><th>Outlet Account Type</th><th>Type Partner</th></tr></thead>
            <tbody></tbody>
        </table>
    </div></div>
</div>
<script src="../../../../wwwroot/js/layout.js"></script>
<script src="../../../../wwwroot/js/prototype-spa.js"></script>
<script>
document.addEventListener("layoutReady", function () {
    const KEYS = { channel: "md_channel", typeCus: "md_type_customer", account: "md_account", mapping: "md_channel_mapping" };
    const SEED = {
        channel: { verKey: "md_channel_seed_ver", ver: "hierarchy-20260812b", file: "channel.json" },
        typeCus: { verKey: "md_type_customer_seed_ver", ver: "hierarchy-20260812b", file: "type-customer.json" },
        account: { verKey: "md_account_seed_ver", ver: "hierarchy-20260812b", file: "account.json" },
        mapping: { verKey: "md_channel_mapping_seed_ver", ver: "hierarchy-20260812b", file: "channel-mapping.json" }
    };
    function get(k){ return JSON.parse(localStorage.getItem(k) || "[]"); }
    function ensure(store, meta){
        if (localStorage.getItem(meta.verKey) === meta.ver && localStorage.getItem(store)) return Promise.resolve(get(store));
        return fetch("../../../../wwwroot/data/" + meta.file).then(r => r.json()).then(function (d) {
            localStorage.setItem(store, JSON.stringify(d));
            localStorage.setItem(meta.verKey, meta.ver);
            return d;
        });
    }
    function nameOf(list, id){ const x = list.find(a => String(a.id) === String(id)); return x ? (x.nama || x.kode || "") : ""; }
    let table;
    function rows(){
        const ch = get(KEYS.channel), ac = get(KEYS.account), tp = get(KEYS.typeCus);
        return get(KEYS.mapping).map(function (m, i) {
            return { no: i + 1, channel: nameOf(ch, m.channelId), account: nameOf(ac, m.accountId), partner: nameOf(tp, m.typeCustomerId), channelId: String(m.channelId), accountId: String(m.accountId), partnerId: String(m.typeCustomerId) };
        });
    }
    function fillSelect(sel, items, selected){
        const cur = selected != null ? selected : $(sel).val();
        $(sel).empty().append("<option value=''>All</option>");
        items.forEach(function (n) { $(sel).append("<option>" + n + "</option>"); });
        if (cur) $(sel).val(cur);
    }
    function narrow(){
        const all = rows();
        const c = $("#fChannel").val(), a = $("#fAccount").val(), p = $("#fPartner").val();
        const byC = all.filter(r => !c || r.channel === c);
        const byA = all.filter(r => !a || r.account === a);
        const byP = all.filter(r => !p || r.partner === p);
        fillSelect("#fChannel", [...new Set(byA.filter(r => !p || r.partner === p).map(r => r.channel))].sort(), c);
        fillSelect("#fAccount", [...new Set(byC.filter(r => !p || r.partner === p).map(r => r.account))].sort(), a);
        fillSelect("#fPartner", [...new Set(byC.filter(r => !a || r.account === a).map(r => r.partner))].sort(), p);
        const shown = all.filter(r => (!c || r.channel === c) && (!a || r.account === a) && (!p || r.partner === p));
        if ($.fn.DataTable.isDataTable("#tbl")) $("#tbl").DataTable().destroy();
        const body = $("#tbl tbody").empty();
        shown.forEach(function (r, i) { body.append("<tr><td>" + (i + 1) + "</td><td>" + r.channel + "</td><td>" + r.account + "</td><td>" + r.partner + "</td></tr>"); });
        table = $("#tbl").DataTable({ language: PrototypeSpa.dtLang(), pageLength: 10, dom: "lrtip" });
    }
    Promise.all([ensure(KEYS.channel, SEED.channel), ensure(KEYS.typeCus, SEED.typeCus), ensure(KEYS.account, SEED.account), ensure(KEYS.mapping, SEED.mapping)]).then(narrow);
    $("#fChannel,#fAccount,#fPartner").on("change", narrow);
});
</script>
</body>
</html>
