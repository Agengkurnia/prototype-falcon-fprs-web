<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Channel – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
.badge-status{display:inline-block;padding:.25rem .6rem;border-radius:12px;font-size:.75rem;font-weight:600}
.badge-active{background:#e6f4ea;color:#1e7e34}
.badge-inactive{background:#f8d7da;color:#842029}
</style>
</head>
<body>
<div id="app-content">

<div id="listContainer">
    <div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
        <div>
            <h2 class="title-page mb-1">Channel</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li>
                    <li class="breadcrumb-item">Data Master</li>
                    <li class="breadcrumb-item active">Channel</li>
                </ol>
            </nav>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span class="badge bg-label-secondary"><i class="fa fa-eye me-1"></i> View-only</span>
            <a class="btn btn-outline-primary" href="../../../MasterDataPortal/Channel/index.html">
                <i class="fa fa-external-link-alt me-1"></i> Kelola di Master Data Portal
            </a>
        </div>
    </div>

    <div class="alert alert-secondary border-0 shadow-sm mb-3" role="alert">
        <i class="fa fa-info-circle me-2"></i>
        Man Power GT menampilkan <strong>list mapping</strong> saja (view-only).
        Kelola data di
        <a href="../../../MasterDataPortal/Channel/index.html" class="alert-link">Master Data Portal</a>.
    </div>

    <div class="card"><div class="card-body"><div class="table-responsive">
        <table class="table table-bordered table-hover" id="tbl" style="width:100%">
            <thead><tr>
                <th style="width:50px;">NO</th>
                <th>CHANNEL</th>
                <th>TYPE CUSTOMER</th>
                <th>ACCOUNT</th>
            </tr></thead>
            <tbody id="tblBody"></tbody>
        </table>
    </div></div></div>
</div>

</div>

<script src="../../../../wwwroot/js/layout.js"></script>
<script>
document.addEventListener('layoutReady', () => {
"use strict";

const KEYS = {
    channel: 'md_channel',
    typeCus: 'md_type_customer',
    account: 'md_account',
    mapping: 'md_channel_mapping'
};
const SEED = {
    channel: { verKey: 'md_channel_seed_ver', ver: 'hierarchy-20260812b', file: 'channel.json' },
    typeCus: { verKey: 'md_type_customer_seed_ver', ver: 'hierarchy-20260812b', file: 'type-customer.json' },
    account: { verKey: 'md_account_seed_ver', ver: 'hierarchy-20260812b', file: 'account.json' },
    mapping: { verKey: 'md_channel_mapping_seed_ver', ver: 'hierarchy-20260812b', file: 'channel-mapping.json' }
};
const DATA_BASE = '../../../../wwwroot/data/';

function get(key){ return JSON.parse(localStorage.getItem(key) || '[]'); }
function set(key, data){ localStorage.setItem(key, JSON.stringify(data)); }
function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function ensureSeed(storeKey, meta){
    const ok = localStorage.getItem(meta.verKey) === meta.ver && localStorage.getItem(storeKey);
    if (ok) return Promise.resolve(get(storeKey));
    return fetch(DATA_BASE + meta.file)
        .then(r => r.json())
        .then(d => {
            const arr = Array.isArray(d) ? d : [];
            set(storeKey, arr);
            localStorage.setItem(meta.verKey, meta.ver);
            return arr;
        })
        .catch(() => { set(storeKey, []); localStorage.setItem(meta.verKey, meta.ver); return []; });
}

function loadAll(){
    return Promise.all([
        ensureSeed(KEYS.channel, SEED.channel),
        ensureSeed(KEYS.typeCus, SEED.typeCus),
        ensureSeed(KEYS.account, SEED.account),
        ensureSeed(KEYS.mapping, SEED.mapping)
    ]);
}

function accountById(id){ return get(KEYS.account).find(a => String(a.id) === String(id)); }
function typeCusById(id){ return get(KEYS.typeCus).find(t => String(t.id) === String(id)); }
function channelById(id){ return get(KEYS.channel).find(c => String(c.id) === String(id)); }

function renderList(){
    if ($.fn.DataTable.isDataTable('#tbl')) $('#tbl').DataTable().destroy();
    const $b = $('#tblBody').empty();
    const rows = get(KEYS.mapping).slice().sort((a, b) => {
        const ca = channelById(a.channelId)?.nama || '';
        const cb = channelById(b.channelId)?.nama || '';
        const n = String(ca).localeCompare(String(cb));
        if (n !== 0) return n;
        const ta = typeCusById(a.typeCustomerId)?.nama || '';
        const tb = typeCusById(b.typeCustomerId)?.nama || '';
        return String(ta).localeCompare(String(tb));
    });
    rows.forEach((m, i) => {
        const ch = channelById(m.channelId);
        const tc = typeCusById(m.typeCustomerId);
        const acc = accountById(m.accountId);
        $b.append(`<tr>
            <td>${i + 1}</td>
            <td>${esc(ch ? ch.nama : '-')}</td>
            <td>${esc(tc ? tc.nama : '-')}</td>
            <td><strong>${esc(acc ? acc.kode : '-')}</strong></td>
        </tr>`);
    });
    $('#tbl').DataTable({
        language:{ search:'', searchPlaceholder:'Cari...', lengthMenu:'_MENU_ entri', info:'_START_-_END_ dari _TOTAL_', paginate:{ previous:'‹', next:'›' }, zeroRecords:'Tidak ada data' },
        pageLength:10,
        dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'
    });
}

loadAll().then(renderList);
});
</script>
</body>
</html>
