<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Channel – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
.badge-status{display:inline-block;padding:.25rem .6rem;border-radius:12px;font-size:.75rem;font-weight:600}
.badge-active{background:#e6f4ea;color:#1e7e34}
.badge-inactive{background:#f8d7da;color:#842029}
</style>
</head>
<body>
    <div id="app-content">

<div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
<div><h2 class="title-page mb-1">Channel</h2><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Channel</li></ol></nav></div>
<button class="btn btn-success" onclick="openModal()"><i class="fa fa-plus me-1"></i> Tambah Channel</button>
</div>

<div class="card"><div class="card-body"><div class="table-responsive">
<table class="table table-bordered table-hover" id="tbl">
<thead><tr><th style="width:50px;">NO</th><th title="Tabel: mChannel | Kolom: txtNama">NAMA CHANNEL</th><th style="text-align:center;" title="Kolom turunan (COUNT mPelanggan) - tidak disimpan">TOTAL PELANGGAN</th><th style="width:100px;" title="Tabel: mChannel | Kolom: bitActive">STATUS</th><th style="width:80px;text-align:center;">AKSI</th></tr></thead>
<tbody id="tblBody"></tbody>
</table></div></div></div>

<div class="modal fade" id="modalForm" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title" id="modalTitle">Tambah Channel</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<input type="hidden" id="editId"/>
<div class="mb-3"><label class="form-label" title="Tabel: mChannel | Kolom: txtNama">Nama Channel <span class="required-mark">*</span></label><input type="text" class="form-control" id="inputNama" placeholder="Nama channel..." title="Tabel: mChannel | Kolom: txtNama"/></div>
<div class="mb-3">
    <label class="form-label d-block" title="Tabel: mChannel | Kolom: bitActive">Status</label>
    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch" id="inputActive" checked onchange="updateActiveLabel()" style="cursor:pointer;" title="Tabel: mChannel | Kolom: bitActive"/>
        <label class="form-check-label" for="inputActive" id="activeLabel">Active</label>
    </div>
</div>

<div id="custSection" class="d-none">
    <hr/>
    <div class="d-flex align-items-center justify-content-between mb-2">
        <h6 class="mb-0 text-success fw-bold"><i class="fa fa-users me-1"></i> Pelanggan pada Channel Ini</h6>
        <span class="badge bg-label-success" id="custCount">0 pelanggan</span>
    </div>
    <div class="table-responsive">
        <table class="table table-sm table-bordered mb-2">
            <thead><tr><th style="width:40px;">#</th><th title="Tabel: mPelanggan | Kolom: txtKode">KODE</th><th title="Tabel: mPelanggan | Kolom: txtNama">NAMA PELANGGAN</th><th title="Tabel: mPelanggan | Kolom: txtKota">KOTA</th></tr></thead>
            <tbody id="custBody"></tbody>
        </table>
    </div>
    <div class="d-flex align-items-center justify-content-between">
        <small class="text-muted" id="custPageInfo">-</small>
        <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-secondary" id="custPrev" onclick="custGoto(-1)"><i class="fa fa-chevron-left"></i></button>
            <button type="button" class="btn btn-outline-secondary" id="custNext" onclick="custGoto(1)"><i class="fa fa-chevron-right"></i></button>
        </div>
    </div>
</div>
</div>
<div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveItem()"><i class="fa fa-save me-1"></i> Simpan</button></div>
</div></div></div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_channel';
const SEED_VER_KEY='md_channel_seed_ver';
const SEED_VER='dummy-jul2026';
const PEL_KEY='md_pelanggan';
const PEL_SEED_VER_KEY='md_pelanggan_seed_ver';
const PEL_SEED_VER='mobile-jul2026-c';
const CUST_PAGE_SIZE=5;
let pelangganData=[];
let custPage=1;
let custCurrentChannel='';

function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}

function loadPelanggan(){
    const raw=localStorage.getItem(PEL_KEY);
    const verOk=localStorage.getItem(PEL_SEED_VER_KEY)===PEL_SEED_VER;
    if(raw&&verOk){pelangganData=JSON.parse(raw);return Promise.resolve();}
    return fetch('../../../../wwwroot/data/pelanggan.json').then(r=>r.json()).then(d=>{pelangganData=d;localStorage.setItem(PEL_KEY,JSON.stringify(d));localStorage.setItem(PEL_SEED_VER_KEY,PEL_SEED_VER);}).catch(()=>{pelangganData=[];});
}

function pelangganOf(channelNama){
    return pelangganData.filter(p=>(p.channel||'')===channelNama);
}

function loadData(){
    loadPelanggan().then(()=>{
        const needSeed=!localStorage.getItem(KEY)||localStorage.getItem(SEED_VER_KEY)!==SEED_VER;
        if(needSeed){
            fetch('../../../../wwwroot/data/channel.json').then(r=>r.json()).then(d=>{saveData(d);localStorage.setItem(SEED_VER_KEY,SEED_VER);render();});
        }else{render();}
    });
}

function render(){
    if($.fn.DataTable.isDataTable('#tbl'))$('#tbl').DataTable().destroy();$('#tblBody').empty();
    getData().forEach((item,i)=>{
        const total=(item.totalPelanggan!=null)?item.totalPelanggan:pelangganOf(item.nama).length;
        const badge=(item.active!==false)?'<span class="badge-status badge-active">Active</span>':'<span class="badge-status badge-inactive">Inactive</span>';
        $('#tblBody').append(`<tr><td>${i+1}</td><td><strong>${item.nama}</strong></td><td class="text-center">${total}</td><td>${badge}</td><td><div class="row-actions"><button class="btn-action btn-action-edit" onclick="editItem('${item.id}')" title="Edit"><i class="fa fa-pen"></i></button></div></td></tr>`);
    });
    $('#tbl').DataTable({language:{search:'',searchPlaceholder:'Cari...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,columnDefs:[{orderable:false,targets:[4]}],dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
}

function renderCustomers(){
    const list=pelangganOf(custCurrentChannel);
    const totalPages=Math.max(1,Math.ceil(list.length/CUST_PAGE_SIZE));
    if(custPage>totalPages)custPage=totalPages;
    $('#custCount').text(`${list.length} pelanggan`);
    const start=(custPage-1)*CUST_PAGE_SIZE;
    const rows=list.slice(start,start+CUST_PAGE_SIZE);
    const $b=$('#custBody').empty();
    if(!rows.length){
        $b.append('<tr><td colspan="4" class="text-center text-muted py-3">Belum ada pelanggan pada channel ini</td></tr>');
    }else{
        rows.forEach((p,idx)=>{$b.append(`<tr><td>${start+idx+1}</td><td><small class="text-muted">${p.kode||'-'}</small></td><td>${p.nama||'-'}</td><td><small>${p.kota||p.alamat||'-'}</small></td></tr>`);});
    }
    $('#custPageInfo').text(`Halaman ${custPage} dari ${totalPages}`);
    $('#custPrev').prop('disabled',custPage<=1);
    $('#custNext').prop('disabled',custPage>=totalPages);
}

function custGoto(dir){custPage+=dir;renderCustomers();}

function updateActiveLabel(){document.getElementById('activeLabel').textContent=document.getElementById('inputActive').checked?'Active':'Inactive';}

function openModal(item=null){
    document.getElementById('editId').value=item?item.id:'';
    document.getElementById('inputNama').value=item?item.nama:'';
    document.getElementById('inputActive').checked=item?(item.active!==false):true;
    updateActiveLabel();
    document.getElementById('modalTitle').textContent=item?'Ubah Channel':'Tambah Channel';
    if(item){
        custCurrentChannel=item.nama;custPage=1;
        document.getElementById('custSection').classList.remove('d-none');
        renderCustomers();
    }else{
        document.getElementById('custSection').classList.add('d-none');
    }
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalForm')).show();
}
function editItem(id){const item=getData().find(d=>String(d.id)===String(id));if(item)openModal(item);}
function saveItem(){const nama=document.getElementById('inputNama').value.trim();if(!nama){Swal.fire('Peringatan','Nama channel wajib diisi.','warning');return;}const data=getData();const id=document.getElementById('editId').value;const obj={id:id?(isNaN(id)?id:parseInt(id)):Date.now(),nama,active:document.getElementById('inputActive').checked};if(id){const idx=data.findIndex(d=>String(d.id)===String(id));if(idx>-1)data[idx]={...data[idx],...obj};}else{data.push(obj);}saveData(data);bootstrap.Modal.getOrCreateInstance(document.getElementById('modalForm')).hide();render();Swal.fire({icon:'success',title:'Berhasil!',timer:1500,showConfirmButton:false});}
$(document).ready(loadData);
window.openModal = openModal; window.editItem = editItem; window.saveItem = saveItem; window.custGoto = custGoto; window.updateActiveLabel = updateActiveLabel;
        });
    </script>
</body>
</html>
