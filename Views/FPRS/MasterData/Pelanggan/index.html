<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Master Pelanggan – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

            <div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
                <div><h2 class="title-page mb-1">Master Pelanggan</h2><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Master Pelanggan</li></ol></nav></div>
                <span class="badge bg-label-info align-self-center"><i class="fa fa-mobile-screen me-1"></i> Data pelanggan diinput dari aplikasi mobile</span>
            </div>
            <!-- Summary -->
            <div class="row g-3 mb-3">
                <div class="col-6 col-md-3"><div class="card text-center border-0 shadow-sm"><div class="card-body py-3"><div class="fs-4 fw-bold text-primary" id="cntTotal">0</div><div class="small text-muted">Total Pelanggan</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center border-0 shadow-sm"><div class="card-body py-3"><div class="fs-4 fw-bold text-success" id="cntActive">0</div><div class="small text-muted">Active</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center border-0 shadow-sm"><div class="card-body py-3"><div class="fs-4 fw-bold text-warning" id="cntUnverified">0</div><div class="small text-muted">Unverified</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center border-0 shadow-sm"><div class="card-body py-3"><div class="fs-4 fw-bold text-danger" id="cntInactive">0</div><div class="small text-muted">Inactive</div></div></div></div>
            </div>
            <div class="card"><div class="card-body"><div class="table-responsive">
                <table class="table table-bordered table-hover" id="tbl">
                    <thead>
                        <tr><th style="width:50px;">NO</th><th title="Source : mPelanggan | txtKode">KODE</th><th title="Source : mPelanggan | txtNama">PELANGGAN</th><th title="Source : mPelanggan | txtAlamat">ALAMAT</th><th title="Source : mPelanggan | txtTelepon">TELEPON</th><th title="Source : mPelanggan | intSalesmanID (FK mPegawai)">SALESMAN</th><th title="Source : mPelanggan | dtKunjunganTerakhir">KUNJUNGAN TERAKHIR</th><th style="width:110px;" title="Source : mPelanggan | bitActive">STATUS</th><th style="width:100px;text-align:center;">AKSI</th></tr>
                        <tr class="filter-row">
                            <th></th><th><input type="text" class="form-control form-control-sm" placeholder="Kode..."></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Nama..."></th>
                            <th></th><th></th>
                            <th><input type="text" class="form-control form-control-sm" placeholder="Salesman..."></th>
                            <th></th>
                            <th><select class="form-select form-select-sm"><option value="">Semua</option><option>Active</option><option>Unverified</option><option>Inactive</option></select></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tblBody"></tbody>
                </table>
            </div></div></div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_pelanggan';
const SEED_VER_KEY='md_pelanggan_seed_ver';
const SEED_VER='mobile-jul2026-c';
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}
function loadData(){
    const needSeed=!localStorage.getItem(KEY)||localStorage.getItem(SEED_VER_KEY)!==SEED_VER;
    if(needSeed){fetch('../../../../wwwroot/data/pelanggan.json').then(r=>r.json()).then(d=>{saveData(d);localStorage.setItem(SEED_VER_KEY,SEED_VER);render();});}else{render();}
}
let table;
function badgeStatus(s){const m={Active:'badge-active',Unverified:'badge-unverified',Inactive:'badge-inactive'};return `<span class="badge-status ${m[s]||'badge-inactive'}">${s}</span>`;}
function render(){
    if($.fn.DataTable.isDataTable('#tbl'))$('#tbl').DataTable().destroy();
    const data=getData();$('#tblBody').empty();
    $('#cntTotal').text(data.length);$('#cntActive').text(data.filter(d=>d.status==='Active').length);
    $('#cntUnverified').text(data.filter(d=>d.status==='Unverified').length);$('#cntInactive').text(data.filter(d=>d.status==='Inactive').length);
    data.forEach((item,i)=>{
        $('#tblBody').append(`<tr>
            <td>${i+1}</td>
            <td><small class="text-muted">${item.kode}</small></td>
            <td><a href="${MasterDataParam.editUrl('detail.html', item.id)}" class="fw-bold text-decoration-none">${item.nama}</a>${item.grupPelanggan?'<br><small class="text-muted">'+item.grupPelanggan+'</small>':''}</td>
            <td><small>${item.alamat||'-'}</small></td>
            <td>${item.telepon||'-'}</td>
            <td>${item.employee||'-'}</td>
            <td><small>${item.kunjunganTerakhir||'-'}</small></td>
            <td>${badgeStatus(item.status)}</td>
            <td><div class="row-actions">
                <a href="${MasterDataParam.editUrl('detail.html', item.id)}" class="btn-action btn-action-view" title="Detail"><i class="fa fa-eye"></i></a>
            </div></td>
        </tr>`);
    });
    table=$('#tbl').DataTable({language:{search:'',searchPlaceholder:'Cari global...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,columnDefs:[{orderable:false,targets:[3,4,6,8]}],dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
    $('.filter-row input').on('keyup change',function(){table.column($(this).closest('th').index()).search(this.value).draw();});
    $('.filter-row select').on('change',function(){table.column($(this).closest('th').index()).search(this.value).draw();});
    $('.filter-row input,.filter-row select').on('click',function(e){e.stopPropagation();});
}
$(document).ready(loadData);
        });
    </script>
</body>
</html>
