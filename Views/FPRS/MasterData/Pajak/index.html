<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Tax | Falcon FPRS</title>
<link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
<link rel="stylesheet" href="../../../../wwwroot/css/filter-stat-cards.css"/>
</head>
<body>
<div id="app-content">
<div class="card mb-3"><div class="card-body d-flex justify-content-between"><h4 class="mb-0">Tax</h4><button class="btn btn-outline-secondary d-none" id="btnBack" type="button">Back</button></div></div>
<div id="list">
<div class="row g-3 mb-3" id="cards">
<div class="col-md-4"><div class="mpg-stat-card mpg-stat-total is-filtered" data-filter=""><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cT">0</div><div class="mpg-stat-label">Total</div></div></div>
<div class="col-md-4"><div class="mpg-stat-card mpg-stat-active" data-filter="active"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cA">0</div><div class="mpg-stat-label">Active</div></div></div>
<div class="col-md-4"><div class="mpg-stat-card mpg-stat-inactive" data-filter="inactive"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cI">0</div><div class="mpg-stat-label">Inactive</div></div></div>
</div>
<div class="card"><div class="card-body"><table class="table" id="tbl" style="width:100%"><thead><tr><th>No</th><th>Tax Code</th><th>Tax Name</th><th>Type</th><th>Percentage</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>
</div>
<div id="detail" class="d-none"><div class="card"><div class="card-header mpg-gradient">Tax</div><div class="card-body"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Type</label><input class="form-control" id="dType" disabled/></div>
<div class="col-md-6"><label class="form-label">Tax Code</label><input class="form-control" id="dKode" disabled/></div>
<div class="col-md-6"><label class="form-label">Tax Name</label><input class="form-control" id="dNama" disabled/></div>
<div class="col-md-6"><label class="form-label">Percentage</label><input class="form-control" id="dPct" disabled/></div>
<div class="col-md-6"><label class="form-label">DPP Value</label><input class="form-control" id="dDpp" disabled/></div>
<div class="col-md-6"><label class="form-label">Status</label><input class="form-control" id="dStat" disabled/></div>
<div class="col-md-6"><label class="form-label">Effective From</label><input class="form-control" id="dFrom" disabled/></div>
<div class="col-md-6"><label class="form-label">Effective To</label><input class="form-control" id="dTo" disabled/></div>
</div></div></div>
</div>
<script src="../../../../wwwroot/js/layout.js"></script>
<script src="../../../../wwwroot/js/prototype-spa.js"></script>
<script>
document.addEventListener("layoutReady", function () {
    const KEY = "md_pajak";
    let rows = [], table, filter = "";
    const on = r => r.status !== "Inactive";
    function load() {
        if (!localStorage.getItem(KEY)) fetch("../../../../wwwroot/data/pajak.json").then(r => r.json()).then(d => { d.forEach(x => { if (!x.status) x.status = "Active"; }); localStorage.setItem(KEY, JSON.stringify(d)); rows = d; paint(); });
        else { rows = JSON.parse(localStorage.getItem(KEY)); rows.forEach(x => { if (!x.status) x.status = "Active"; }); paint(); }
    }
    function paint() {
        $("#cT").text(rows.length); $("#cA").text(rows.filter(on).length); $("#cI").text(rows.filter(r => !on(r)).length);
        if ($.fn.DataTable.isDataTable("#tbl")) $("#tbl").DataTable().destroy();
        const b = $("#tbl tbody").empty();
        rows.forEach((r, i) => b.append("<tr><td>"+(i+1)+"</td><td><a href='#' class='text-success fw-bold open' data-id='"+r.id+"'>"+r.kodePajak+"</a></td><td>"+r.namaPajak+"</td><td><span class='badge bg-label-primary'>PPN</span></td><td>"+r.persentase+"%</td><td>"+PrototypeSpa.statusBadge(on(r))+"</td></tr>"));
        table = $("#tbl").DataTable({ language: PrototypeSpa.dtLang(), pageLength: 10, dom: "lrtip" });
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn._tx);
        const fn = function (settings, data) {
            if (settings.nTable.id !== "tbl" || !filter) return true;
            const active = String(data[5]).indexOf("Inactive") < 0;
            return filter === "active" ? active : !active;
        };
        fn._tx = true; $.fn.dataTable.ext.search.push(fn);
    }
    $("#cards").on("click", ".mpg-stat-card", function () { filter = $(this).data("filter") || ""; PrototypeSpa.setFilteredCard("#cards", filter); if (table) table.draw(); });
    $("#tbl").on("click", ".open", function (e) {
        e.preventDefault();
        const r = rows.find(x => String(x.id) === String($(this).data("id")));
        if (!r) return;
        $("#dType").val("PPN"); $("#dKode").val(r.kodePajak); $("#dNama").val(r.namaPajak); $("#dPct").val(r.persentase + "%");
        $("#dDpp").val(r.nilaiDpp || ""); $("#dStat").val(on(r) ? "Active" : "Inactive");
        $("#dFrom").val(r.effectiveFrom ? PrototypeSpa.fmtDate(r.effectiveFrom) : ""); $("#dTo").val(r.effectiveTo ? PrototypeSpa.fmtDate(r.effectiveTo) : "");
        $("#list").addClass("d-none"); $("#detail").removeClass("d-none"); $("#btnBack").removeClass("d-none");
    });
    $("#btnBack").on("click", function () { PrototypeSpa.confirm("Back to tax list?", function () { $("#detail").addClass("d-none"); $("#list").removeClass("d-none"); $("#btnBack").addClass("d-none"); }); });
    load();
});
</script>
</body></html>
