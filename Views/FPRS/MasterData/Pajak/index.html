<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Pajak – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

            <div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
                <div><h2 class="title-page mb-1">Pajak</h2><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Pajak</li></ol></nav></div>
                <span class="badge bg-label-info align-self-center"><i class="fa fa-database me-1"></i> Data pajak dari Oracle (view-only)</span>
            </div>
            <div class="card"><div class="card-body"><div class="table-responsive">
                <table class="table table-bordered table-hover" id="tbl">
                    <thead><tr><th style="width:50px;">NO</th><th title="Source : mPajak | txtKodePajak">KODE PAJAK</th><th title="Source : mPajak | txtNamaPajak">NAMA PAJAK</th><th title="Source : mPajak | decPersentase">PERSENTASE (%)</th><th title="Source : mPajak | txtNilaiDpp">NILAI DPP</th></tr></thead>
                    <tbody id="tblBody"></tbody>
                </table>
            </div></div></div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_pajak';
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}
function loadData(){if(!localStorage.getItem(KEY)){fetch('../../../../wwwroot/data/pajak.json').then(r=>r.json()).then(d=>{saveData(d);render();});}else{render();}}
function render(){
    if($.fn.DataTable.isDataTable('#tbl'))$('#tbl').DataTable().destroy();
    $('#tblBody').empty();
    getData().forEach((item,i)=>{$('#tblBody').append(`<tr><td>${i+1}</td><td><strong>${item.kodePajak}</strong></td><td>${item.namaPajak}</td><td>${item.persentase}%</td><td>${item.nilaiDpp||'-'}</td></tr>`);});
    $('#tbl').DataTable({language:{search:'',searchPlaceholder:'Cari...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
}
$(document).ready(loadData);
        });
    </script>
</body>
</html>
