<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Konfigurasi Akses – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

<div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
<div><h2 class="title-page mb-1">Konfigurasi Akses</h2><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Konfigurasi Akses</li></ol></nav></div>
<button class="btn btn-success" onclick="openModal()"><i class="fa fa-plus me-1"></i> Tambah Role</button>
</div>
<div class="card"><div class="card-body"><div class="table-responsive">
<table class="table table-bordered table-hover" id="tbl">
<thead><tr><th style="width:50px;">NO</th><th>NAMA ROLE</th><th style="width:100px;text-align:center;">AKSI</th></tr></thead>
<tbody id="tblBody"></tbody>
</table></div></div></div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_konfigurasi_akses';
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}
function loadData(){if(!localStorage.getItem(KEY)){fetch('../../../../wwwroot/data/konfigurasi-akses.json').then(r=>r.json()).then(d=>{saveData(d);render();});}else{render();}}
function render(){
if($.fn.DataTable.isDataTable('#tbl'))$('#tbl').DataTable().destroy();$('#tblBody').empty();
getData().forEach((item,i)=>{$('#tblBody').append(`<tr><td>${i+1}</td><td><strong>${item.nama}</strong></td><td><div class="row-actions"><button class="btn-action btn-action-edit" onclick="editItem(${item.id})" title="Edit"><i class="fa fa-pen"></i></button><button class="btn-action btn-action-delete" onclick="del(${item.id},'${item.nama}')" title="Hapus"><i class="fa fa-trash"></i></button></div></td></tr>`);});
$('#tbl').DataTable({language:{search:'',searchPlaceholder:'Cari...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,columnDefs:[{orderable:false,targets:[2]}],dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
}
function openModal(item=null){document.getElementById('editId').value=item?item.id:'';document.getElementById('inputNama').value=item?item.nama:'';document.getElementById('modalTitle').textContent=item?'Ubah Role':'Tambah Role';bootstrap.Modal.getOrCreateInstance(document.getElementById('modalForm')).show();}
function editItem(id){const item=getData().find(d=>d.id===id);if(item)openModal(item);}
function saveItem(){const nama=document.getElementById('inputNama').value.trim();if(!nama){Swal.fire('Peringatan','Nama role wajib diisi.','warning');return;}const data=getData();const id=document.getElementById('editId').value;const obj={id:id?parseInt(id):Date.now(),nama};if(id){const idx=data.findIndex(d=>d.id===parseInt(id));if(idx>-1)data[idx]=obj;}else{data.push(obj);}saveData(data);bootstrap.Modal.getOrCreateInstance(document.getElementById('modalForm')).hide();render();Swal.fire({icon:'success',title:'Berhasil!',timer:1500,showConfirmButton:false});}
function del(id,nama){Swal.fire({title:`Hapus Role "${nama}"?`,icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#6c757d',confirmButtonText:'Ya, Hapus',cancelButtonText:'Batal'}).then(r=>{if(r.isConfirmed){saveData(getData().filter(d=>d.id!==id));render();Swal.fire({icon:'success',title:'Dihapus!',timer:1200,showConfirmButton:false});}});}
$(document).ready(loadData);
window.openModal = openModal; window.del = del; window.editItem = editItem;
        });
    </script>
</body>
</html>
