<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Limit | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <link rel="stylesheet" href="../../../../wwwroot/css/filter-stat-cards.css"/>
</head>
<body>
<div id="app-content">
    <div class="card mb-3"><div class="card-body d-flex justify-content-between flex-wrap gap-2">
        <div><h4 class="mb-1">Limit</h4><p class="text-muted mb-0">Master Data / Limit</p></div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary d-none" id="btnBack">Back</button>
            <button type="button" class="btn btn-success" id="btnAdd">Add Limit</button>
            <button type="button" class="btn btn-success d-none" id="btnSave">Save Limit</button>
        </div>
    </div></div>
    <div id="list">
        <div class="row g-3 mb-3" id="cards">
            <div class="col-6 col-md-4"><div class="mpg-stat-card mpg-stat-total is-filtered" data-filter=""><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cntTotal">0</div><div class="mpg-stat-label">Total</div></div></div>
            <div class="col-6 col-md-4"><div class="mpg-stat-card mpg-stat-active" data-filter="active"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cntActive">0</div><div class="mpg-stat-label">Active</div></div></div>
            <div class="col-6 col-md-4"><div class="mpg-stat-card mpg-stat-inactive" data-filter="inactive"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cntInactive">0</div><div class="mpg-stat-label">Inactive</div></div></div>
        </div>
        <div class="card"><div class="card-body"><table class="table" id="tbl" style="width:100%"><thead>
            <tr><th>No</th><th>Limit Name</th><th>Jabatan</th><th>Daily Min</th><th>Daily Max</th><th>Status</th></tr>
            <tr class="dt-col-search"><th></th>
                <th><div class="input-group input-group-sm"><input class="form-control col-search" data-col="1" placeholder="Search"/><button type="button" class="btn btn-outline-success btn-col-search"><i class="fa fa-search"></i></button></div></th>
                <th><div class="input-group input-group-sm"><input class="form-control col-search" data-col="2" placeholder="Search"/><button type="button" class="btn btn-outline-success btn-col-search"><i class="fa fa-search"></i></button></div></th>
                <th></th><th></th>
                <th><select class="form-select form-select-sm col-search" data-col="5"><option value="">All</option><option>Active</option><option>Inactive</option></select></th>
            </tr>
        </thead><tbody></tbody></table></div></div>
    </div>
    <div id="detail" class="d-none">
        <div class="row g-3">
            <div class="col-lg-8">
                <div class="card mb-3"><div class="card-header mpg-gradient">Limit</div><div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label fw-semibold">Limit Name <span class="text-muted">*</span></label><input class="form-control" id="fNama"/></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Jabatan <span class="text-muted">*</span></label><select class="form-select" id="fJabatan"><option value="">Select Jabatan...</option><option>MD</option><option>Motoris</option><option>SPG GT</option></select></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Type Jabatan</label><input class="form-control" id="fType" placeholder="Optional"/></div>
                        <div class="col-md-6"><label class="form-label fw-semibold d-block">Status</label><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fActive" checked/><label class="form-check-label" for="fActive">Active</label></div></div>
                    </div>
                </div></div>
                <div class="card"><div class="card-header mpg-gradient">Version Period</div><div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Daily Min</label><input type="number" class="form-control" id="fMin"/></div>
                        <div class="col-md-6"><label class="form-label">Daily Max</label><input type="number" class="form-control" id="fMax"/></div>
                        <div class="col-md-6"><label class="form-label">Weekly HKE</label><input type="number" class="form-control" id="fHke"/></div>
                        <div class="col-md-6"><label class="form-label">Monthly HKE</label><input type="number" class="form-control" id="fHkeM"/></div>
                        <div class="col-md-6"><label class="form-label">Effective Call Count</label><input type="number" class="form-control" id="fEc"/></div>
                        <div class="col-md-6"><label class="form-label">Effective Call Percentage (%)</label><input type="number" class="form-control" id="fEcp"/></div>
                        <div class="col-md-6"><label class="form-label">Start Date</label><input type="date" class="form-control" id="fStart"/></div>
                        <div class="col-md-6"><label class="form-label">End Date</label><input class="form-control" value="Ongoing" disabled/></div>
                    </div>
                </div></div>
            </div>
            <div class="col-lg-4">
                <div class="card"><div class="card-header mpg-gradient">Version History</div><div class="card-body">
                    <div id="histList" class="list-group mb-3"></div>
                    <div id="histDetail" class="d-none small border-top pt-3">
                        <div class="mb-1"><span class="text-muted">Daily Min</span> <span id="hMin" class="float-end"></span></div>
                        <div class="mb-1"><span class="text-muted">Daily Max</span> <span id="hMax" class="float-end"></span></div>
                        <div class="mb-1"><span class="text-muted">Effective Call Count</span> <span id="hEc" class="float-end"></span></div>
                        <div><span class="text-muted">Period</span> <span id="hPer" class="float-end"></span></div>
                    </div>
                </div></div>
            </div>
        </div>
    </div>
</div>
<script src="../../../../wwwroot/js/layout.js"></script>
<script src="../../../../wwwroot/js/prototype-spa.js"></script>
<script>
document.addEventListener("layoutReady", function () {
    const KEY = "md_limit";
    let rows = [];
    let table;
    let cardFilter = "";
    let editing = null;

    function current(item) {
        const vs = (item.versions || []).slice().sort((a, b) => String(b.tanggalMulai).localeCompare(String(a.tanggalMulai)));
        return vs.find(v => v.active) || vs[0] || {};
    }
    function isActive(item) { return current(item).active !== false && item.active !== false; }

    function load() {
        if (!localStorage.getItem(KEY)) {
            fetch("../../../../wwwroot/data/limit-target.json").then(r => r.json()).then(function (d) {
                localStorage.setItem(KEY, JSON.stringify(d));
                rows = d; paint();
            });
        } else { rows = JSON.parse(localStorage.getItem(KEY)); paint(); }
    }
    function paint() {
        $("#cntTotal").text(rows.length);
        $("#cntActive").text(rows.filter(isActive).length);
        $("#cntInactive").text(rows.filter(r => !isActive(r)).length);
        if ($.fn.DataTable.isDataTable("#tbl")) $("#tbl").DataTable().destroy();
        const body = $("#tbl tbody").empty();
        rows.forEach(function (item, i) {
            const v = current(item);
            body.append("<tr><td>" + (i + 1) + "</td><td><a href='#' class='text-success fw-bold open' data-id='" + item.id + "'>" + item.nama + "</a></td><td>" + (item.jabatan || "") + "</td><td>" + (v.minimalHarian ?? "") + "</td><td>" + (v.maximalHarian ?? "") + "</td><td>" + PrototypeSpa.statusBadge(isActive(item)) + "</td></tr>");
        });
        table = $("#tbl").DataTable(PrototypeSpa.dtOpts());
        PrototypeSpa.bindColumnSearch(table, "#list");
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn._lim);
        const fn = function (settings, data) {
            if (settings.nTable.id !== "tbl" || !cardFilter) return true;
            const active = String(data[5]).indexOf("Active") >= 0 && String(data[5]).indexOf("Inactive") < 0;
            return cardFilter === "active" ? active : !active;
        };
        fn._lim = true;
        $.fn.dataTable.ext.search.push(fn);
    }
    function showList() {
        $("#detail").addClass("d-none"); $("#list").removeClass("d-none");
        $("#btnBack,#btnSave").addClass("d-none"); $("#btnAdd").removeClass("d-none");
    }
    function openForm(item) {
        editing = item;
        const v = item ? current(item) : {};
        $("#fNama").val(item ? item.nama : "");
        $("#fJabatan").val(item ? item.jabatan : "");
        $("#fType").val(item ? (item.typeJabatan || "") : "");
        $("#fActive").prop("checked", item ? isActive(item) : true);
        $("#fMin").val(v.minimalHarian ?? "");
        $("#fMax").val(v.maximalHarian ?? "");
        $("#fHke").val(v.targetHke ?? "");
        $("#fHkeM").val(v.targetHkeBulanan ?? "");
        $("#fEc").val(v.effectiveCallCount ?? "");
        $("#fEcp").val(v.effectiveCallPercentage ?? "");
        $("#fStart").val((v.tanggalMulai || new Date().toISOString().slice(0, 10)));
        const list = $("#histList").empty();
        (item && item.versions ? item.versions : []).forEach(function (ver) {
            list.append("<button type='button' class='list-group-item list-group-item-action hist' data-id='" + ver.id + "'>" + PrototypeSpa.fmtDate(ver.tanggalMulai) + " – " + (ver.tanggalSelesai && ver.tanggalSelesai !== "Ongoing" ? PrototypeSpa.fmtDate(ver.tanggalSelesai) : "Ongoing") + "</button>");
        });
        $("#histDetail").addClass("d-none");
        $("#list").addClass("d-none"); $("#detail").removeClass("d-none");
        $("#btnAdd").addClass("d-none"); $("#btnBack,#btnSave").removeClass("d-none");
    }
    $("#cards").on("click", ".mpg-stat-card", function () {
        cardFilter = $(this).data("filter") || "";
        PrototypeSpa.setFilteredCard("#cards", cardFilter);
        if (table) table.draw();
    });
    $("#tbl").on("click", ".open", function (e) { e.preventDefault(); openForm(rows.find(r => String(r.id) === String($(this).data("id")))); });
    $("#btnAdd").on("click", function () { openForm(null); });
    $("#btnBack").on("click", function () { PrototypeSpa.confirm("Leave this form?", showList); });
    $("#histList").on("click", ".hist", function () {
        if (!editing) return;
        const ver = (editing.versions || []).find(v => String(v.id) === String($(this).data("id")));
        if (!ver) return;
        $("#hMin").text(ver.minimalHarian ?? "—");
        $("#hMax").text(ver.maximalHarian ?? "—");
        $("#hEc").text(ver.effectiveCallCount ?? "—");
        $("#hPer").text(PrototypeSpa.fmtDate(ver.tanggalMulai) + " – " + (ver.active ? "Ongoing" : PrototypeSpa.fmtDate(ver.tanggalSelesai)));
        $("#histDetail").removeClass("d-none");
    });
    $("#btnSave").on("click", function () {
        if (!$("#fNama").val() || !$("#fJabatan").val()) { PrototypeSpa.confirm("Limit name and jabatan are required.", function () {}); return; }
        PrototypeSpa.confirm("Save this limit?", function () {
            const ver = {
                id: "v" + Date.now(),
                minimalHarian: Number($("#fMin").val() || 0),
                maximalHarian: Number($("#fMax").val() || 0),
                targetHke: Number($("#fHke").val() || 0),
                targetHkeBulanan: Number($("#fHkeM").val() || 0),
                effectiveCallCount: Number($("#fEc").val() || 0),
                effectiveCallPercentage: Number($("#fEcp").val() || 0),
                tanggalMulai: $("#fStart").val(),
                tanggalSelesai: null,
                active: true
            };
            if (!editing) {
                rows.push({ id: Date.now(), nama: $("#fNama").val(), jabatan: $("#fJabatan").val(), typeJabatan: $("#fType").val(), active: $("#fActive").is(":checked"), versions: [ver] });
            } else {
                editing.nama = $("#fNama").val();
                editing.jabatan = $("#fJabatan").val();
                editing.typeJabatan = $("#fType").val();
                editing.active = $("#fActive").is(":checked");
                (editing.versions || []).forEach(function (old) { if (old.active) { old.active = false; old.tanggalSelesai = ver.tanggalMulai; } });
                editing.versions = editing.versions || [];
                editing.versions.push(ver);
            }
            localStorage.setItem(KEY, JSON.stringify(rows));
            paint();
            showList();
        });
    });
    load();
});
</script>
</body>
</html>
