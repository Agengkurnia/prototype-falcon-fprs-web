<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Product | Falcon FPRS</title>
<link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
<link rel="stylesheet" href="../../../../wwwroot/css/filter-stat-cards.css"/>
</head>
<body>
<div id="app-content">
<div class="card mb-3"><div class="card-body d-flex justify-content-between"><h4 class="mb-0">Product</h4>
<div><button class="btn btn-outline-secondary d-none" id="btnBack" type="button">Back</button>
<button class="btn btn-success" id="btnAdd" type="button">Add Product</button>
<button class="btn btn-success d-none" id="btnSave" type="button">Save</button></div></div></div>
<div id="list">
<div class="row g-3 mb-3" id="cards">
<div class="col-6 col-md-3"><div class="mpg-stat-card mpg-stat-total is-filtered" data-filter=""><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cT">0</div><div class="mpg-stat-label">Total</div></div></div>
<div class="col-6 col-md-3"><div class="mpg-stat-card mpg-stat-active" data-filter="active"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cA">0</div><div class="mpg-stat-label">Active</div></div></div>
<div class="col-6 col-md-3"><div class="mpg-stat-card mpg-stat-inactive" data-filter="inactive"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cI">0</div><div class="mpg-stat-label">Inactive</div></div></div>
<div class="col-6 col-md-3"><div class="mpg-stat-card mpg-stat-umbrella" data-filter="missing"><span class="mpg-stat-badge">Filtered</span><div class="mpg-stat-value" id="cM">0</div><div class="mpg-stat-label">Missing Brand Mapping</div></div></div>
</div>
<div class="card"><div class="card-body"><table class="table" id="tbl" style="width:100%"><thead>
<tr><th>No</th><th>Code</th><th>Product</th><th>Category</th><th>Umbrella Brand</th><th>Brand</th><th>Unit</th><th class="text-end">Selling Price</th><th>Status</th></tr>
<tr class="dt-col-search"><th></th>
<th><div class="input-group input-group-sm"><input class="form-control col-search" data-col="1" placeholder="Search"/><button class="btn btn-outline-success btn-col-search" type="button"><i class="fa fa-search"></i></button></div></th>
<th><div class="input-group input-group-sm"><input class="form-control col-search" data-col="2" placeholder="Search"/><button class="btn btn-outline-success btn-col-search" type="button"><i class="fa fa-search"></i></button></div></th>
<th></th><th></th><th></th><th></th><th></th>
<th><select class="form-select form-select-sm col-search" data-col="8"><option value="">All</option><option>Active</option><option>Inactive</option></select></th>
</tr></thead><tbody></tbody></table></div></div>
</div>
<div id="detail" class="d-none">
<div class="card mb-3"><div class="card-header mpg-gradient">Product</div><div class="card-body"><div class="row g-3">
<div class="col-md-4"><label class="form-label">SKU</label><div class="input-group"><input class="form-control" id="fKode" readonly/><button class="btn btn-outline-success" type="button" data-bs-toggle="modal" data-bs-target="#skuModal">Select</button></div></div>
<div class="col-md-8"><label class="form-label">Product Name <span class="text-muted">*</span></label><input class="form-control" id="fNama"/></div>
<div class="col-md-4"><label class="form-label">Category</label><input class="form-control" id="fCat"/></div>
<div class="col-md-4"><label class="form-label">Umbrella Brand</label><input class="form-control" id="fUmb"/></div>
<div class="col-md-4"><label class="form-label">Brand</label><input class="form-control" id="fBrand"/></div>
<div class="col-md-4"><label class="form-label">Unit</label><input class="form-control" id="fUnit"/></div>
<div class="col-md-4"><label class="form-label">Selling Price</label><input type="number" class="form-control" id="fPrice"/></div>
<div class="col-md-4"><label class="form-label">Tax</label><input class="form-control" value="0%" disabled/></div>
<div class="col-md-4"><label class="form-label d-block">Status</label><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fActive" checked/><label class="form-check-label" for="fActive">Active</label></div></div>
</div></div></div>
</div>
<div class="modal fade" id="skuModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title">Select SKU</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><input class="form-control mb-2" id="skuQ" placeholder="Search code or name"/><div class="list-group" id="skuList" style="max-height:360px;overflow:auto"></div></div>
</div></div></div>
</div>
<script src="../../../../wwwroot/js/layout.js"></script>
<script src="../../../../wwwroot/js/prototype-spa.js"></script>
<script>
document.addEventListener("layoutReady", function () {
    const KEY = "md_produk", VER = "umbrella7-jul2026";
    let rows = [], table, filter = "", editing = null;
    const on = r => String(r.status).toLowerCase() === "active";
    const missing = r => !r.brand || !r.umbrella;
    function load() {
        const need = !localStorage.getItem(KEY) || localStorage.getItem("md_produk_seed_ver") !== VER;
        const done = function (d) { rows = d; paint(); };
        if (need) fetch("../../../../wwwroot/data/produk.json").then(r => r.json()).then(function (d) { localStorage.setItem(KEY, JSON.stringify(d)); localStorage.setItem("md_produk_seed_ver", VER); done(d); });
        else done(JSON.parse(localStorage.getItem(KEY)));
    }
    function paint() {
        $("#cT").text(rows.length); $("#cA").text(rows.filter(on).length); $("#cI").text(rows.filter(r => !on(r)).length); $("#cM").text(rows.filter(missing).length);
        if ($.fn.DataTable.isDataTable("#tbl")) $("#tbl").DataTable().destroy();
        const b = $("#tbl tbody").empty();
        rows.forEach(function (r, i) {
            b.append("<tr><td>" + (i + 1) + "</td><td>" + r.kode + "</td><td><a href='#' class='text-success fw-bold open' data-id='" + r.id + "'>" + r.nama + "</a></td><td>" + (r.divisi || "") + "</td><td>" + (r.umbrella || "") + "</td><td>" + (r.brand || "") + "</td><td>" + (r.unitNama || "") + "</td><td class='text-end'>" + Number(r.hargaJual || 0).toLocaleString("id-ID") + "</td><td>" + PrototypeSpa.statusBadge(on(r)) + "</td><td class='d-none'>" + (missing(r) ? "missing" : "") + "</td></tr>");
        });
        table = $("#tbl").DataTable(PrototypeSpa.dtOpts({ columnDefs: [{ targets: 9, visible: false }] }));
        PrototypeSpa.bindColumnSearch(table, "#list");
        $.fn.dataTable.ext.search = $.fn.dataTable.ext.search.filter(fn => !fn._prd);
        const fn = function (settings, data, idx) {
            if (settings.nTable.id !== "tbl" || !filter) return true;
            const node = table.row(idx).node();
            if (filter === "missing") return $(node).find("td").last().text() === "missing";
            const active = $(node).find("td").eq(8).text().indexOf("Inactive") < 0;
            return filter === "active" ? active : !active;
        };
        fn._prd = true; $.fn.dataTable.ext.search.push(fn);
    }
    function showList() { $("#detail").addClass("d-none"); $("#list").removeClass("d-none"); $("#btnBack,#btnSave").addClass("d-none"); $("#btnAdd").removeClass("d-none"); }
    function open(item) {
        editing = item;
        $("#fKode").val(item ? item.kode : ""); $("#fNama").val(item ? item.nama : ""); $("#fCat").val(item ? item.divisi : "");
        $("#fUmb").val(item ? item.umbrella : ""); $("#fBrand").val(item ? item.brand : ""); $("#fUnit").val(item ? item.unitNama : "PCS");
        $("#fPrice").val(item ? item.hargaJual : ""); $("#fActive").prop("checked", item ? on(item) : true);
        $("#list").addClass("d-none"); $("#detail").removeClass("d-none"); $("#btnAdd").addClass("d-none"); $("#btnBack,#btnSave").removeClass("d-none");
    }
    function skuList() {
        const q = ($("#skuQ").val() || "").toLowerCase();
        const box = $("#skuList").empty();
        rows.filter(r => !q || (r.kode + r.nama).toLowerCase().indexOf(q) >= 0).slice(0, 40).forEach(function (r) {
            box.append("<button type='button' class='list-group-item list-group-item-action sku' data-id='" + r.id + "'><strong>" + r.kode + "</strong> " + r.nama + "</button>");
        });
    }
    $("#cards").on("click", ".mpg-stat-card", function () { filter = $(this).data("filter") || ""; PrototypeSpa.setFilteredCard("#cards", filter); if (table) table.draw(); });
    $("#tbl").on("click", ".open", function (e) { e.preventDefault(); open(rows.find(r => String(r.id) === String($(this).data("id")))); });
    $("#btnAdd").on("click", function () { open(null); });
    $("#btnBack").on("click", function () { PrototypeSpa.confirm("Back to product list?", showList); });
    $("#skuQ").on("input", skuList);
    $("#skuModal").on("show.bs.modal", skuList);
    $("#skuList").on("click", ".sku", function () {
        const r = rows.find(x => String(x.id) === String($(this).data("id")));
        if (!r) return;
        $("#fKode").val(r.kode); $("#fNama").val(r.nama); $("#fUmb").val(r.umbrella || ""); $("#fBrand").val(r.brand || "");
        bootstrap.Modal.getOrCreateInstance(document.getElementById("skuModal")).hide();
    });
    $("#btnSave").on("click", function () {
        if (!$("#fNama").val()) return;
        PrototypeSpa.confirm("Save this product?", function () {
            const rec = editing || { id: Date.now() };
            rec.kode = $("#fKode").val(); rec.nama = $("#fNama").val(); rec.divisi = $("#fCat").val(); rec.umbrella = $("#fUmb").val();
            rec.brand = $("#fBrand").val(); rec.unitNama = $("#fUnit").val(); rec.hargaJual = Number($("#fPrice").val() || 0);
            rec.namaPajak = "0%"; rec.status = $("#fActive").is(":checked") ? "active" : "inactive";
            if (!editing) rows.push(rec);
            localStorage.setItem(KEY, JSON.stringify(rows)); paint(); showList();
        });
    });
    load();
});
</script>
</body></html>
