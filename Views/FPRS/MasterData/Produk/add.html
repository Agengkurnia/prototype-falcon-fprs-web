<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Form Produk – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}@font-face{font-family:'Kalbe Geometric';font-weight:700;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Bold.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

                <div class="mb-3">
                    <h2 class="title-page mb-1" id="formTitle">Tambah Produk</h2>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li>
                            <li class="breadcrumb-item">Data Master</li>
                            <li class="breadcrumb-item"><a href="index.html" class="a-breadcrumb">Master Produk</a></li>
                            <li class="breadcrumb-item active" id="breadcrumbActive">Tambah</li>
                        </ol>
                    </nav>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <form id="formProduk" onsubmit="saveDataForm(event)">
                            <input type="hidden" id="editId" />
                            
                            <div class="row g-3">
                                <h5 class="border-bottom pb-2 text-success"><i class="fa fa-box me-1"></i> Informasi Produk</h5>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Kode Produk <span class="required-mark">*</span></label>
                                    <input type="text" class="form-control" id="kode" placeholder="Kode SKU produk..." maxlength="50" required />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nama Produk <span class="required-mark">*</span></label>
                                    <input type="text" class="form-control" id="nama" placeholder="Nama lengkap produk..." maxlength="120" required />
                                </div>
                                
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Kategori Produk <span class="required-mark">*</span></label>
                                    <select class="form-select" id="kategori" required>
                                        <option value="">-- Pilih Kategori --</option>
                                        <option value="Minuman Kesehatan">Minuman Kesehatan</option>
                                        <option value="Susu Anak">Susu Anak</option>
                                        <option value="Susu Formula">Susu Formula</option>
                                        <option value="Susu Ibu Hamil">Susu Ibu Hamil</option>
                                        <option value="Makanan Bayi">Makanan Bayi</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Brand <span class="required-mark">*</span></label>
                                    <select class="form-select" id="brand" required>
                                        <option value="">-- Pilih Brand --</option>
                                        <option value="ZEE">ZEE</option>
                                        <option value="Hydro Coco">Hydro Coco</option>
                                        <option value="Entrasol">Entrasol</option>
                                        <option value="CHIL GO">CHIL GO</option>
                                        <option value="Benecol">Benecol</option>
                                        <option value="Diabetasol">Diabetasol</option>
                                        <option value="Prenagen">Prenagen</option>
                                        <option value="Milna">Milna</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Divisi <span class="required-mark">*</span></label>
                                    <select class="form-select" id="divisi" required>
                                        <option value="">-- Pilih Divisi --</option>
                                        <option value="Nutritionals">Nutritionals</option>
                                        <option value="OTC">OTC</option>
                                        <option value="Consumer Health">Consumer Health</option>
                                    </select>
                                </div>
                                
                                <h5 class="border-bottom pb-2 text-success mt-4"><i class="fa fa-tags me-1"></i> Harga & Pajak</h5>
                                
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Harga Beli <span class="required-mark">*</span></label>
                                    <input type="number" class="form-control" id="hargaBeli" placeholder="Rp..." required min="0" />
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Harga Jual <span class="required-mark">*</span></label>
                                    <input type="number" class="form-control" id="hargaJual" placeholder="Rp..." required min="0" />
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Skema Pajak <span class="required-mark">*</span></label>
                                    <select class="form-select" id="namaPajak" required>
                                        <option value="NoPPN">No PPN (0%)</option>
                                        <option value="PPN 11%">PPN (11%)</option>
                                    </select>
                                </div>
                                
                                <h5 class="border-bottom pb-2 text-success mt-4"><i class="fa fa-ruler-combined me-1"></i> Unit & Logistik</h5>
                                
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Unit Konversi <span class="required-mark">*</span></label>
                                    <input type="text" class="form-control" id="unitNama" placeholder="Contoh: KARTON, PCS (pisahkan dengan koma)" required />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Status Produk <span class="required-mark">*</span></label>
                                    <select class="form-select" id="status" required>
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                </div>
                                
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Berat (kg)</label>
                                    <input type="number" step="0.001" class="form-control" id="berat" value="0.0" />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Panjang (cm)</label>
                                    <input type="number" class="form-control" id="panjang" value="0" />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Lebar (cm)</label>
                                    <input type="number" class="form-control" id="lebar" value="0" />
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Tinggi (cm)</label>
                                    <input type="number" class="form-control" id="tinggi" value="0" />
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a href="index.html" class="btn btn-secondary"><i class="fa fa-times me-1"></i> Batal</a>
                                <button type="submit" class="btn btn-success"><i class="fa fa-save me-1"></i> Simpan Produk</button>
                            </div>
                        </form>
                    </div>
                </div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_produk';

function getLocalData() {
    return JSON.parse(localStorage.getItem(KEY) || '[]');
}

function setLocalData(data) {
    localStorage.setItem(KEY, JSON.stringify(data));
}

function checkEditMode() {
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    if (editId) {
        document.getElementById('formTitle').textContent = 'Ubah Produk';
        document.getElementById('breadcrumbActive').textContent = 'Ubah';
        document.getElementById('editId').value = editId;
        
        const dataList = getLocalData();
        const item = dataList.find(d => d.id === parseInt(editId));
        if (item) {
            document.getElementById('kode').value = item.kode || '';
            document.getElementById('nama').value = item.nama || '';
            document.getElementById('kategori').value = item.kategori || '';
            document.getElementById('brand').value = item.brand || '';
            document.getElementById('divisi').value = item.divisi || '';
            
            document.getElementById('hargaBeli').value = item.hargaBeli || 0;
            document.getElementById('hargaJual').value = item.hargaJual || 0;
            document.getElementById('namaPajak').value = item.namaPajak || 'NoPPN';
            
            document.getElementById('unitNama').value = item.unitNama || 'KARTON, PCS';
            document.getElementById('status').value = item.status || 'active';
            
            document.getElementById('berat').value = item.berat || 0;
            document.getElementById('panjang').value = item.panjang || 0;
            document.getElementById('lebar').value = item.lebar || 0;
            document.getElementById('tinggi').value = item.tinggi || 0;
            
            // Kode is read-only in Edit mode
            document.getElementById('kode').readOnly = true;
        }
    }
}

function saveDataForm(event) {
    event.preventDefault();
    
    // Get all field values
    const kode = document.getElementById('kode').value.trim().toUpperCase();
    const nama = document.getElementById('nama').value.trim();
    const kategori = document.getElementById('kategori').value;
    const brand = document.getElementById('brand').value;
    const hargaBeli = parseFloat(document.getElementById('hargaBeli').value);
    const hargaJual = parseFloat(document.getElementById('hargaJual').value);
    const berat = parseFloat(document.getElementById('berat').value) || 0;
    
    const dataList = getLocalData();
    const editId = document.getElementById('editId').value;
    
    // Clear all previous validation errors
    document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    document.querySelectorAll('.invalid-feedback').forEach(el => el.remove());
    
    function showFieldError(id, message) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('is-invalid');
        const feedback = document.createElement('div');
        feedback.className = 'invalid-feedback';
        feedback.style.display = 'block';
        feedback.textContent = message;
        el.parentNode.appendChild(feedback);
    }
    
    let firstError = null;
    
    // Validate Kode (required, min 3 chars, alphanumeric+dash)
    if (!kode) {
        showFieldError('kode', 'Kode produk wajib diisi.');
        firstError = firstError || 'kode';
    } else if (kode.length < 3) {
        showFieldError('kode', 'Kode produk minimal 3 karakter.');
        firstError = firstError || 'kode';
    } else if (!/^[A-Z0-9-_]+$/.test(kode)) {
        showFieldError('kode', 'Kode hanya boleh berisi huruf, angka, dash (-), atau underscore (_).');
        firstError = firstError || 'kode';
    } else {
        // Uniqueness check
        const duplicate = dataList.find(d => d.kode === kode && (!editId || d.id !== parseInt(editId)));
        if (duplicate) {
            showFieldError('kode', `Kode "${kode}" sudah digunakan oleh produk lain.`);
            firstError = firstError || 'kode';
        }
    }
    
    // Validate Nama (required, min 3 chars)
    if (!nama) {
        showFieldError('nama', 'Nama produk wajib diisi.');
        firstError = firstError || 'nama';
    } else if (nama.length < 3) {
        showFieldError('nama', 'Nama produk minimal 3 karakter.');
        firstError = firstError || 'nama';
    }
    
    // Validate Kategori (required)
    if (!kategori) {
        showFieldError('kategori', 'Kategori wajib dipilih.');
        firstError = firstError || 'kategori';
    }
    
    // Validate Brand (required)
    if (!brand) {
        showFieldError('brand', 'Brand wajib dipilih.');
        firstError = firstError || 'brand';
    }
    
    // Validate Harga Beli (must be > 0)
    if (isNaN(hargaBeli) || hargaBeli <= 0) {
        showFieldError('hargaBeli', 'Harga beli harus lebih dari 0.');
        firstError = firstError || 'hargaBeli';
    }
    
    // Validate Harga Jual (must be > 0 and >= hargaBeli)
    if (isNaN(hargaJual) || hargaJual <= 0) {
        showFieldError('hargaJual', 'Harga jual harus lebih dari 0.');
        firstError = firstError || 'hargaJual';
    } else if (!isNaN(hargaBeli) && hargaJual < hargaBeli) {
        showFieldError('hargaJual', 'Harga jual tidak boleh lebih kecil dari harga beli.');
        firstError = firstError || 'hargaJual';
    }
    
    // Validate Berat (must be >= 0)
    if (berat < 0) {
        showFieldError('berat', 'Berat tidak boleh negatif.');
        firstError = firstError || 'berat';
    }
    
    if (firstError) {
        const el = document.getElementById(firstError);
        if (el) {
            el.focus();
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        Swal.fire({
            icon: 'warning',
            title: 'Validasi Gagal',
            text: 'Mohon perbaiki kesalahan pada form sebelum menyimpan.',
            timer: 2000,
            showConfirmButton: false
        });
        return;
    }
    
    const newObj = {
        id: editId ? parseInt(editId) : Date.now(),
        kode: kode,
        nama: nama,
        kategori: kategori,
        brand: brand,
        divisi: document.getElementById('divisi').value,
        hargaBeli: hargaBeli,
        hargaJual: hargaJual,
        namaPajak: document.getElementById('namaPajak').value,
        unitNama: document.getElementById('unitNama').value.trim(),
        status: document.getElementById('status').value,
        berat: berat,
        panjang: parseInt(document.getElementById('panjang').value) || 0,
        lebar: parseInt(document.getElementById('lebar').value) || 0,
        tinggi: parseInt(document.getElementById('tinggi').value) || 0,
        partnerId: ''
    };
    
    if (editId) {
        const idx = dataList.findIndex(d => d.id === parseInt(editId));
        if (idx > -1) {
            dataList[idx] = newObj;
        }
    } else {
        dataList.push(newObj);
    }
    
    setLocalData(dataList);
    
    Swal.fire({
        icon: 'success',
        title: 'Berhasil!',
        text: `Produk "${nama}" telah disimpan.`,
        timer: 1500,
        showConfirmButton: false
    }).then(() => {
        window.location.href = 'index.html';
    });
}

$(document).ready(function() {
    checkEditMode();
});

        });
    </script>
</body>
</html>
