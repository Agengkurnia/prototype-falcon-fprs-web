<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Unit – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>

        @font-face { font-family: 'Kalbe Geometric'; font-weight: 400; font-display: swap; src: url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2') format('woff2'); }
        @font-face { font-family: 'Kalbe Geometric'; font-weight: 700; font-display: swap; src: url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Bold.woff2') format('woff2'); }
    
</style>
</head>
<body>
    <div id="app-content">

                <div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
                    <div>
                        <h2 class="title-page mb-1">Unit</h2>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li>
                                <li class="breadcrumb-item">Data Master</li>
                                <li class="breadcrumb-item active">Unit</li>
                            </ol>
                        </nav>
                    </div>
                    <button class="btn btn-success" onclick="openModal()"><i class="fa fa-plus me-1"></i> Tambah Unit</button>
                </div>

                <div class="alert alert-info alert-dismissible fade show border-0 shadow-sm mb-3" role="alert">
                    <i class="fa fa-link me-2 text-info"></i>
                    <strong>Integrasi Master Data API:</strong> Modul ini terintegrasi dengan API: 
                    <a href="https://master-datadev.kalbenutritionals.web.id/swagger/index.html" target="_blank" class="alert-link text-decoration-underline"><code>/api/v1/UOM</code></a>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover" id="tblUnit">
                                <thead>
                                    <tr>
                                        <th style="width:50px;">NO</th>
                                        <th>NAMA</th>
                                        <th>DESKRIPSI</th>
                                        <th>UoM PAJAK</th>
                                        <th style="width:100px;text-align:center;">AKSI</th>
                                    </tr>
                                </thead>
                                <tbody id="tblBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
<div class="modal fade" id="modalUnit" tabindex="-1" aria-labelledby="modalUnitLabel">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalUnitLabel">Tambah Unit</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId" />
                <div class="mb-3">
                    <label class="form-label">Nama <span class="required-mark">*</span></label>
                    <input type="text" class="form-control" id="inputNama" placeholder="Contoh: PCS" maxlength="95" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Deskripsi</label>
                    <textarea class="form-control" id="inputDeskripsi" rows="2" placeholder="Deskripsi unit..." maxlength="250"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">UoM Pajak</label>
                    <select class="form-select" id="inputUomPajak">
                        <option value="">-- Pilih UoM Pajak --</option>
                        <option>PCS</option>
                        <option>BOX</option>
                        <option>KARTON</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button class="btn btn-success" onclick="saveUnit()"><i class="fa fa-save me-1"></i> Simpan</button>
            </div>
        </div>
    </div>
</div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const DATA_KEY = 'md_unit';
const MODAL_ID = 'modalUnit';

function loadData() {
    const stored = localStorage.getItem(DATA_KEY);
    if (!stored) {
        fetch('../../../../wwwroot/data/unit.json').then(r => r.json()).then(d => { localStorage.setItem(DATA_KEY, JSON.stringify(d)); renderTable(); });
    } else { renderTable(); }
}

function getData() { return JSON.parse(localStorage.getItem(DATA_KEY) || '[]'); }
function saveData(d) { localStorage.setItem(DATA_KEY, JSON.stringify(d)); }

let table;
function renderTable() {
    if ($.fn.DataTable.isDataTable('#tblUnit')) $('#tblUnit').DataTable().destroy();
    const data = getData();
    const tbody = $('#tblBody').empty();
    data.forEach((item, i) => {
        tbody.append(`<tr>
            <td>${i+1}</td>
            <td><strong>${item.nama}</strong></td>
            <td>${item.deskripsi || '-'}</td>
            <td>${item.uomPajak || '-'}</td>
            <td><div class="row-actions">
                <button class="btn-action btn-action-edit" onclick="editItem('${item.id}')" title="Edit"><i class="fa fa-pen"></i></button>
                <button class="btn-action btn-action-delete" onclick="deleteItem('${item.id}')" title="Hapus"><i class="fa fa-trash"></i></button>
            </div></td>
        </tr>`);
    });
    table = $('#tblUnit').DataTable({ language: { search:'', searchPlaceholder:'Cari...', lengthMenu:'_MENU_ entri', info:'_START_-_END_ dari _TOTAL_', paginate:{previous:'‹',next:'›'}, zeroRecords:'Tidak ada data' }, pageLength:10, columnDefs:[{orderable:false,targets:[4]}], dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>' });
}

function openModal(item = null) {
    document.getElementById('editId').value = item ? item.id : '';
    document.getElementById('inputNama').value = item ? item.nama : '';
    document.getElementById('inputDeskripsi').value = item ? item.deskripsi : '';
    document.getElementById('inputUomPajak').value = item ? item.uomPajak : '';
    document.getElementById('modalUnitLabel').textContent = item ? 'Ubah Unit' : 'Tambah Unit';
    bootstrap.Modal.getOrCreateInstance(document.getElementById(MODAL_ID)).show();
}

function editItem(id) {
    const item = getData().find(d => String(d.id)===String(id));
    if (item) openModal(item);
}

function saveUnit() {
    const nama = document.getElementById('inputNama').value.trim();
    if (!nama) { Swal.fire('Peringatan', 'Nama unit wajib diisi.', 'warning'); return; }
    const data = getData();
    const id = document.getElementById('editId').value;
    const obj = { id: id?(isNaN(id)?id:parseInt(id)):Date.now(), nama, deskripsi: document.getElementById('inputDeskripsi').value.trim(), uomPajak: document.getElementById('inputUomPajak').value, partnerId: '' };
    if (id) {
        const idx = data.findIndex(d => String(d.id)===String(id));
        if (idx > -1) data[idx] = obj;
    } else { data.push(obj); }
    saveData(data);
    bootstrap.Modal.getOrCreateInstance(document.getElementById(MODAL_ID)).hide();
    renderTable();
    Swal.fire({ icon:'success', title:'Berhasil!', text:`Unit "${nama}" telah disimpan.`, timer:1500, showConfirmButton:false });
}

function deleteItem(id) {
    const item = getData().find(d => String(d.id)===String(id));
    Swal.fire({ title:`Hapus Unit "${item.nama}"?`, text:'Tindakan ini tidak dapat dibatalkan.', icon:'warning', showCancelButton:true, confirmButtonColor:'#d33', cancelButtonColor:'#6c757d', confirmButtonText:'Ya, Hapus', cancelButtonText:'Batal' }).then(r => {
        if (r.isConfirmed) {
            saveData(getData().filter(d => String(d.id)!==String(id)));
            renderTable();
            Swal.fire({ icon:'success', title:'Dihapus!', timer:1200, showConfirmButton:false });
        }
    });
}

$(document).ready(loadData);
window.openModal = openModal; window.editItem = editItem; window.deleteItem = deleteItem; window.saveUnit = saveUnit;
        });
    </script>
</body>
</html>
