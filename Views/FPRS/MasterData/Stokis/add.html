<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Form Stokis – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
@font-face{font-family:'Kalbe Geometric';font-weight:700;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Bold.woff2')format('woff2')}
    </style>
</head>
<body>
    <div id="app-content">
        <div class="mb-3">
            <h2 class="title-page mb-1" id="formTitle">Tambah Stokis</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li>
                    <li class="breadcrumb-item">Data Master</li>
                    <li class="breadcrumb-item"><a href="index.html" class="a-breadcrumb">Stokis</a></li>
                    <li class="breadcrumb-item active" id="breadcrumbActive">Tambah</li>
                </ol>
            </nav>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="formStokis" onsubmit="saveDataForm(event)">
                    <input type="hidden" id="editId"/>

                    <div class="row g-3">
                        <h5 class="border-bottom pb-2 text-success"><i class="fa fa-store me-1"></i> Data Stokis / Grosir</h5>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Kode Stokis <span class="required-mark">*</span></label>
                            <input type="text" class="form-control" id="kode" placeholder="STK-XXX" maxlength="20"/>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Nama Stokis <span class="required-mark">*</span></label>
                            <input type="text" class="form-control" id="nama" placeholder="Nama grosir / distributor..." maxlength="120" required/>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Tipe <span class="required-mark">*</span></label>
                            <select class="form-select" id="tipe" required>
                                <option value="Grosir">Grosir</option>
                                <option value="Distributor">Distributor</option>
                                <option value="Principal">Principal</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Telepon</label>
                            <input type="text" class="form-control" id="telepon" placeholder="021..." maxlength="20"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Kota</label>
                            <input type="text" class="form-control" id="kota" placeholder="Jakarta Pusat" maxlength="80"/>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Alamat Lengkap</label>
                            <textarea class="form-control" id="alamat" rows="2" placeholder="Jl. ..." maxlength="250"></textarea>
                        </div>

                        <h5 class="border-bottom pb-2 text-success mt-2"><i class="fa fa-map-marker-alt me-1"></i> Koordinat GPS (Check-in Mobile)</h5>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Latitude</label>
                            <input type="number" step="any" class="form-control" id="lat" placeholder="-6.1625"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Longitude</label>
                            <input type="number" step="any" class="form-control" id="lng" placeholder="106.8342"/>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Status <span class="required-mark">*</span></label>
                            <select class="form-select" id="status" required>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="index.html" class="btn btn-secondary"><i class="fa fa-times me-1"></i> Batal</a>
                        <button type="submit" class="btn btn-success"><i class="fa fa-save me-1"></i> Simpan Stokis</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {
            const KEY = 'md_stokis';

            function getLocalData() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
            function setLocalData(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

            function checkEditMode() {
                const editId = new URLSearchParams(window.location.search).get('id');
                if (!editId) return;
                document.getElementById('formTitle').textContent = 'Ubah Stokis';
                document.getElementById('breadcrumbActive').textContent = 'Ubah';
                document.getElementById('editId').value = editId;
                const item = getLocalData().find(d => String(d.id) === String(editId));
                if (!item) return;
                document.getElementById('kode').value = item.kode || '';
                document.getElementById('nama').value = item.nama || '';
                document.getElementById('tipe').value = item.tipe || 'Grosir';
                document.getElementById('telepon').value = item.telepon || '';
                document.getElementById('kota').value = item.kota || '';
                document.getElementById('alamat').value = item.alamat || '';
                document.getElementById('lat').value = item.lat ?? '';
                document.getElementById('lng').value = item.lng ?? '';
                document.getElementById('status').value = item.status || 'Active';
                document.getElementById('kode').readOnly = true;
            }

            window.saveDataForm = function(e) {
                e.preventDefault();
                const nama = document.getElementById('nama').value.trim();
                if (!nama) {
                    Swal.fire('Peringatan', 'Nama stokis wajib diisi.', 'warning');
                    return;
                }
                let kode = document.getElementById('kode').value.trim();
                const data = getLocalData();
                const editId = document.getElementById('editId').value;
                if (!kode) {
                    kode = 'STK-' + String(Date.now()).slice(-6);
                }
                const duplicate = data.find(d => d.kode === kode && String(d.id) !== String(editId));
                if (duplicate) {
                    Swal.fire('Peringatan', `Kode "${kode}" sudah digunakan.`, 'warning');
                    return;
                }
                const obj = {
                    id: editId ? (isNaN(editId) ? editId : parseInt(editId)) : Date.now(),
                    kode,
                    nama,
                    tipe: document.getElementById('tipe').value,
                    telepon: document.getElementById('telepon').value.trim(),
                    kota: document.getElementById('kota').value.trim(),
                    alamat: document.getElementById('alamat').value.trim(),
                    lat: parseFloat(document.getElementById('lat').value) || null,
                    lng: parseFloat(document.getElementById('lng').value) || null,
                    status: document.getElementById('status').value
                };
                if (editId) {
                    const idx = data.findIndex(d => String(d.id) === String(editId));
                    if (idx >= 0) data[idx] = obj;
                } else {
                    data.push(obj);
                }
                setLocalData(data);
                Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Data stokis disimpan.', timer: 1400, showConfirmButton: false })
                    .then(() => { window.location.href = 'index.html'; });
            };

            $(document).ready(checkEditMode);
        });
    </script>
</body>
</html>
