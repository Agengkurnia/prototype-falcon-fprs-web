<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Akun – Master Data | Falcon FPRS</title>
    <link rel="stylesheet" href="../../../../wwwroot/css/master-data.css"/>
    <style>
@font-face{font-family:'Kalbe Geometric';font-weight:400;src:url('../../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2')format('woff2')}
</style>
</head>
<body>
    <div id="app-content">

<div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap;gap:.75rem;">
<div><h2 class="title-page mb-1">Akun</h2><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../../../../index.html" class="a-breadcrumb">Home</a></li><li class="breadcrumb-item">Data Master</li><li class="breadcrumb-item active">Akun</li></ol></nav></div>
<button class="btn btn-success" onclick="openModal()"><i class="fa fa-plus me-1"></i> Tambah Akun</button>
</div>
<div class="alert alert-info alert-dismissible fade show border-0 shadow-sm mb-3" role="alert">
    <i class="fa fa-link me-2 text-info"></i>
    <strong>Integrasi Master Data API:</strong> Modul ini terintegrasi dengan API: 
    <a href="https://master-datadev.kalbenutritionals.web.id/swagger/index.html" target="_blank" class="alert-link text-decoration-underline"><code>/api/v1/User</code></a> (RBAC Module)
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="card"><div class="card-body"><div class="table-responsive">
<table class="table table-bordered table-hover" id="tbl">
<thead><tr><th style="width:50px;">NO</th><th>USERNAME</th><th>ROLE GROUP</th><th>TELEPON</th><th>EMAIL</th><th>NAMA KARYAWAN</th><th style="width:80px;">STATUS</th><th style="width:100px;text-align:center;">AKSI</th></tr></thead>
<tbody id="tblBody"></tbody>
</table></div></div></div>
    </div>
    <script src="../../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

const KEY='md_akun';
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]');}
function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}
function loadData(){if(!localStorage.getItem(KEY)){fetch('../../../../wwwroot/data/akun.json').then(r=>r.json()).then(d=>{saveData(d);render();});}else{render();}}
function render(){
if($.fn.DataTable.isDataTable('#tbl'))$('#tbl').DataTable().destroy();$('#tblBody').empty();
getData().forEach((item,i)=>{const badge=item.status==='Active'?'<span class="badge-status badge-active">Active</span>':'<span class="badge-status badge-inactive">Inactive</span>';$('#tblBody').append(`<tr><td>${i+1}</td><td><strong><code>${item.username}</code></strong></td><td>${item.roleGroup}</td><td>${item.telepon||'-'}</td><td>${item.email||'-'}</td><td>${item.namaKaryawan||'-'}</td><td>${badge}</td><td><div class="row-actions"><button class="btn-action btn-action-edit" onclick="editItem(${item.id})" title="Edit"><i class="fa fa-pen"></i></button><button class="btn-action btn-action-delete" onclick="del(${item.id},'${item.username}')" title="Hapus"><i class="fa fa-trash"></i></button></div></td></tr>`);});
$('#tbl').DataTable({language:{search:'',searchPlaceholder:'Cari...',lengthMenu:'_MENU_ entri',info:'_START_-_END_ dari _TOTAL_',paginate:{previous:'‹',next:'›'},zeroRecords:'Tidak ada data'},pageLength:10,columnDefs:[{orderable:false,targets:[6,7]}],dom:'<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'});
}
function openModal(item=null){document.getElementById('editId').value=item?item.id:'';document.getElementById('inputUsername').value=item?item.username:'';document.getElementById('inputRole').value=item?item.roleGroup:'';document.getElementById('inputEmail').value=item?item.email:'';document.getElementById('inputTelepon').value=item?item.telepon:'';document.getElementById('inputNamaKaryawan').value=item?item.namaKaryawan:'';document.getElementById('inputStatus').value=item?item.status:'Active';document.getElementById('modalTitle').textContent=item?'Ubah Akun':'Tambah Akun';bootstrap.Modal.getOrCreateInstance(document.getElementById('modalForm')).show();}
function editItem(id){const item=getData().find(d=>d.id===id);if(item)openModal(item);}
function saveItem(){
const username=document.getElementById('inputUsername').value.trim();const role=document.getElementById('inputRole').value;
if(!username||!role){Swal.fire('Peringatan','Username dan Role wajib diisi.','warning');return;}
const data=getData();const id=document.getElementById('editId').value;
const obj={id:id?parseInt(id):Date.now(),username,roleGroup:role,email:document.getElementById('inputEmail').value.trim(),telepon:document.getElementById('inputTelepon').value.trim(),namaKaryawan:document.getElementById('inputNamaKaryawan').value.trim(),status:document.getElementById('inputStatus').value};
if(id){const idx=data.findIndex(d=>d.id===parseInt(id));if(idx>-1)data[idx]=obj;}else{data.push(obj);}
saveData(data);bootstrap.Modal.getOrCreateInstance(document.getElementById('modalForm')).hide();render();
Swal.fire({icon:'success',title:'Berhasil!',timer:1500,showConfirmButton:false});
}
function del(id,username){Swal.fire({title:`Hapus Akun "${username}"?`,icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#6c757d',confirmButtonText:'Ya, Hapus',cancelButtonText:'Batal'}).then(r=>{if(r.isConfirmed){saveData(getData().filter(d=>d.id!==id));render();Swal.fire({icon:'success',title:'Dihapus!',timer:1200,showConfirmButton:false});}});}
$(document).ready(loadData);
window.openModal = openModal; window.del = del; window.editItem = editItem;
        });
    </script>
</body>
</html>
