<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Canvassing â€“ Falcon FPRS</title>
    <link rel="stylesheet" href="../../../wwwroot/css/canvassing-v2.css"/>
    <style>

        @font-face { font-family: 'Kalbe Geometric'; font-style: normal; font-weight: 400; font-display: swap; src: url('../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2') format('woff2'); }
        @font-face { font-family: 'Kalbe Geometric'; font-style: normal; font-weight: 600; font-display: swap; src: url('../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-SemiBold.woff2') format('woff2'); }
        @font-face { font-family: 'Kalbe Geometric'; font-style: normal; font-weight: 700; font-display: swap; src: url('../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Bold.woff2') format('woff2'); }
    
</style>
</head>
<body>
    <div id="app-content">

                
                <div class="d-flex align-items-start justify-content-between mb-3" style="flex-wrap:wrap; gap:0.75rem;">
                    <div>
                        <h2 class="title-page mb-1">Canvassing</h2>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="../../../index.html" class="a-breadcrumb">Home</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Canvassing</li>
                            </ol>
                        </nav>
                    </div>
                    <div>
                        <a href="add.html" class="btn btn-success"><i class="fa fa-plus me-1"></i> Tambah Canvassing</a>
                    </div>
                </div>

                <!-- SUMMARY CARDS -->
                <div class="summary-cards-grid">
                    <div class="summary-card total active-filter" data-filter="" title="Tampilkan Semua">
                        <div class="summary-card-icon"><i class="fa fa-boxes"></i></div>
                        <div class="stat-title">Total Kanvas</div>
                        <div class="stat-value">20</div>
                        <div class="stat-desc">Tahun ini</div>
                    </div>
                    <div class="summary-card ongoing" data-filter="Ongoing" title="Filter: Ongoing">
                        <div class="summary-card-icon"><i class="fa fa-spinner"></i></div>
                        <div class="stat-title">Ongoing</div>
                        <div class="stat-value">12</div>
                        <div class="stat-desc">Sedang berjalan</div>
                    </div>
                    <div class="summary-card completed" data-filter="Completed" title="Filter: Completed">
                        <div class="summary-card-icon"><i class="fa fa-check"></i></div>
                        <div class="stat-title">Completed</div>
                        <div class="stat-value">6</div>
                        <div class="stat-desc">Selesai direkonsiliasi</div>
                    </div>
                    <div class="summary-card cancelled" data-filter="Cancelled" title="Filter: Cancelled">
                        <div class="summary-card-icon"><i class="fa fa-times"></i></div>
                        <div class="stat-title">Cancelled</div>
                        <div class="stat-value">2</div>
                        <div class="stat-desc">Dibatalkan</div>
                    </div>
                </div>

                <!-- LIST CARD -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover" id="tblCanvassingV2">
                                <thead>
                                    <tr>
                                        <th style="width:50px;">NO</th>
                                        <th>KODE KANVAS</th>
                                        <th>DRIVER</th>
                                        <th>GUDANG</th>
                                        <th style="width: 150px;">PERIODE</th>
                                        <th style="width: 120px;">STATUS</th>
                                        <th style="width: 80px; text-align:center;">AKSI</th>
                                    </tr>
                                    <tr class="filter-row">
                                        <th></th>
                                        <th><input type="text" class="form-control form-control-sm" placeholder="Filter kode..."></th>
                                        <th><input type="text" class="form-control form-control-sm" placeholder="Filter driver..."></th>
                                        <th>
                                            <select class="form-select form-select-sm">
                                                <option value="">Semua Gudang</option>
                                                <option>JAMBI</option>
                                                <option>JAKARTA PUSAT</option>
                                                <option>SURABAYA</option>
                                            </select>
                                        </th>
                                        <th></th>
                                        <th>
                                            <select class="form-select form-select-sm">
                                                <option value="">Semua</option>
                                                <option>Ongoing</option>
                                                <option>Completed</option>
                                                <option>Draft</option>
                                            </select>
                                        </th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="tblBody">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
    </div>
    <script src="../../../wwwroot/js/canvassing-store.js"></script>
    <script src="../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

$(document).ready(function () {
    var table;

    function updateSummaryCards() {
        var summary = CanvassingStore.getSummary();
        $('.summary-card.total .stat-value').text(summary.total);
        $('.summary-card.ongoing .stat-value').text(summary.ongoing);
        $('.summary-card.completed .stat-value').text(summary.completed);
        $('.summary-card.cancelled .stat-value').text(summary.cancelled);
    }

    function renderTable() {
        var tbody = $('#tblBody');
        tbody.empty();
        var list = CanvassingStore.getAll();
        
        var statuses = {
            'Ongoing': '<span class="badge-status badge-ongoing"><i class="fa fa-clock"></i> Ongoing</span>',
            'Completed': '<span class="badge-status badge-completed"><i class="fa fa-check"></i> Completed</span>',
            'Cancelled': '<span class="badge-status badge-cancelled"><i class="fa fa-times"></i> Cancelled</span>',
            'Draft': '<span class="badge-status badge-draft"><i class="fa fa-file"></i> Draft</span>'
        };
        
        list.forEach(function (item, idx) {
            var i = idx + 1;
            var stat = statuses[item.status] || '<span class="badge-status badge-draft">' + item.status + '</span>';
            var pct = item.progressPct || 0;
            var days = item.durationDays || 0;
            
            // Format dates for display, e.g. "01 Jan - 31 Des"
            var startDateStr = '-';
            var endDateStr = '-';
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            
            if (item.tanggalMulai) {
                var dStart = new Date(item.tanggalMulai);
                startDateStr = dStart.getDate() + ' ' + months[dStart.getMonth()];
            }
            if (item.tanggalSelesai) {
                var dEnd = new Date(item.tanggalSelesai);
                endDateStr = dEnd.getDate() + ' ' + months[dEnd.getMonth()];
            }
            var dateRangeStr = startDateStr + (endDateStr ? ' - ' + endDateStr : '');
            
            // Calculate elapsed days
            var elapsedDays = Math.floor(pct / 100 * days);
            
            var act = '<div class="row-actions">' +
                '<a href="detail.html?id=' + item.id + '" class="btn-action" title="Lihat Detail"><i class="fa fa-eye"></i></a>' +
                (item.status === 'Ongoing' || item.status === 'Draft' ? '<a href="add.html?id=' + item.id + '" class="btn-action" title="Edit"><i class="fa fa-pen"></i></a>' : '') +
                '<button class="btn-action text-danger btn-delete-canvassing" data-id="' + item.id + '" title="Hapus"><i class="fa fa-trash"></i></button>' +
                '</div>';
                
            var driverDisplay = item.driverName || 'Driver';
            if (item.driverCode) {
                driverDisplay = driverDisplay + '<br><small class="text-muted">' + item.driverCode + '</small>';
            } else {
                driverDisplay = '<span class="text-muted">-</span>';
            }
            
            var tr = '<tr>' +
                '<td data-label="No">' + i + '</td>' +
                '<td data-label="Kode"><a href="detail.html?id=' + item.id + '" class="kode-link fw-bold">' + item.id + '</a></td>' +
                '<td data-label="Driver">' + driverDisplay + '</td>' +
                '<td data-label="Gudang">' + (item.gudang || '-') + '</td>' +
                '<td data-label="Periode"><div class="periode-progress-container"><div class="periode-progress-text"><span>' + dateRangeStr + '</span><span>' + pct + '%</span></div><div class="periode-progress"><div class="periode-progress-bar ' + (pct === 100 ? 'bg-success' : '') + '" style="width: ' + pct + '%;"></div></div><small class="text-muted" style="font-size:0.65rem;">' + elapsedDays + ' dari ' + days + ' hari</small></div></td>' +
                '<td data-label="Status">' + stat + '</td>' +
                '<td data-label="Aksi">' + act + '</td>' +
                '</tr>';
            tbody.append(tr);
        });
    }

    function initDataTable() {
        if ($.fn.DataTable.isDataTable('#tblCanvassingV2')) {
            $('#tblCanvassingV2').DataTable().destroy();
        }
        
        table = $('#tblCanvassingV2').DataTable({
            language: { 
                search: '', 
                searchPlaceholder: 'Cari global...', 
                lengthMenu: '_MENU_ entri per halaman', 
                info: 'Menampilkan _START_ - _END_ dari _TOTAL_', 
                paginate: { previous: 'â€¹', next: 'â€º' }, 
                zeroRecords: 'Tidak ada data' 
            },
            pageLength: 10,
            columnDefs: [{ orderable: false, targets: [6] }],
            dom: '<"d-flex align-items-center justify-content-between mb-3"l<"ms-auto"f>>rt<"d-flex align-items-center justify-content-between mt-3"i<"ms-auto"p>>'
        });
    }

    // Initial render
    updateSummaryCards();
    renderTable();
    initDataTable();

    // Delete row event handler
    $('#tblCanvassingV2').on('click', '.btn-delete-canvassing', function() {
        var id = $(this).data('id');
        
        Swal.fire({
            title: 'Hapus Canvassing?',
            text: 'Apakah Anda yakin ingin menghapus data canvassing ' + id + '? Tindakan ini tidak dapat dibatalkan.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Ya, Hapus',
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                // Delete from localStorage
                CanvassingStore.delete(id);
                
                // Re-render, re-init DataTable, update summary cards
                renderTable();
                initDataTable();
                updateSummaryCards();
                
                Swal.fire({
                    icon: 'success',
                    title: 'Dihapus!',
                    text: 'Data Canvassing ' + id + ' telah berhasil dihapus.',
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        });
    });

    // Prevent sort on filter click
    $('.filter-row input, .filter-row select').on('click', function(e) {
        e.stopPropagation();
    });

    // Apply column filters
    $('.filter-row input').on('keyup change', function () {
        var colIdx = $(this).closest('th').index();
        table.column(colIdx).search(this.value).draw();
    });
    
    $('.filter-row select').on('change', function () {
        var colIdx = $(this).closest('th').index();
        table.column(colIdx).search(this.value).draw();
        
        // Sync cards if status is changed manually
        if (colIdx === 5) {
            $('.summary-card').removeClass('active-filter');
            var val = this.value;
            $('.summary-card').each(function() {
                if ($(this).data('filter') === val) {
                    $(this).addClass('active-filter');
                }
            });
        }
    });

    // Card interaction for filtering
    $('.summary-card').on('click', function() {
        var filterVal = $(this).data('filter');
        $('.summary-card').removeClass('active-filter');
        $(this).addClass('active-filter');
        
        // Sync with the select dropdown
        var statusSelect = $('.filter-row select').last();
        statusSelect.val(filterVal);
        
        // Filter table (Status column is index 5)
        table.column(5).search(filterVal).draw();
    });
});

        });
    </script>
</body>
</html>
