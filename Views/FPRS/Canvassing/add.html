<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Tambah Canvassing - Falcon FPRS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"/>
    <link rel="stylesheet" href="../../../wwwroot/css/canvassing-v2.css"/>
    <style>
        .select2-container--bootstrap-5 .select2-selection {
            border: 1px solid #ced4da !important;
            border-radius: 6px !important;
            min-height: 38px !important;
            background-color: #fff !important;
        }
        .stok-add-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stok-add-header .select2-container {
            flex: 1 !important;
            width: auto !important;
        }
        .stok-add-header .btn-remove-stok-v2 { flex-shrink: 0; }
    </style>
</head>
<body>
    <div id="app-content">
        <div class="container-title-add mb-3">
            <div class="title-box">
                <a href="index.html" class="btn-back"><i class="fa fa-arrow-left"></i> Kembali ke list</a>
                <h2 class="title-add mb-1">Tambah Canvassing</h2>
            </div>
        </div>

        <div class="two-pane-container">
            <!-- LEFT PANE -->
            <div class="pane-left">
                <div class="form-card">
                    <h3 class="form-section-title"><i class="fa fa-info-circle me-2"></i>Informasi Canvassing</h3>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label-v2">Driver <span class="text-danger">*</span></label>
                            <select class="form-select select2-basic" id="inpDriver">
                                <option value="">Pilih Driver</option>
                                <option value="EMP-260500040">EMP-260500040 - JAMBI</option>
                                <option value="EMP-260400021">EMP-260400021 - JAKARTA PUSAT</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-v2">Helper</label>
                            <select class="form-select select2-basic" id="inpHelper">
                                <option value="">Pilih Helper</option>
                                <option value="EMP-260500041">EMP-260500041 - BUDI</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label-v2">Gudang Kanvas <span class="text-danger">*</span></label>
                            <select class="form-select select2-basic" id="inpGudang">
                                <option value="">Pilih Gudang</option>
                                <option value="JAMBI">JAMBI</option>
                                <option value="JAKARTA PUSAT">JAKARTA PUSAT</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-v2">Mulai Kanvas <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" id="inpMulai">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-v2">Selesai Kanvas <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" id="inpSelesai">
                        </div>
                    </div>
                </div>

                <div class="form-card">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h3 class="form-section-title mb-0 border-0 pb-0"><i class="fa fa-boxes me-2"></i>Stok Produk</h3>
                        <button class="btn btn-sm btn-outline-success" id="btnAddProduct">
                            <i class="fa fa-plus me-1"></i> Tambah Produk
                        </button>
                    </div>
                    <div id="stokContainer">
                        <div class="stok-add-item">
                            <div class="stok-add-header">
                                <select class="form-select select2-produk" data-id="1">
                                    <option value="">Pilih Produk</option>
                                    <option value="NBE14" data-stok="99999">BENECOL STRAW 100ML (NBE14)</option>
                                    <option value="FIT01" data-stok="500">FITBAR CHOCOLATE (FIT01)</option>
                                </select>
                                <button class="btn-remove-stok-v2" onclick="removeStokItem(this)"><i class="fa fa-trash"></i></button>
                            </div>
                            <div class="stok-available" id="stokAvail1">Tersedia: -</div>
                            <div class="stok-add-qty-row mt-3">
                                <div class="stok-add-qty-group">
                                    <label class="stok-add-qty-label">Karton</label>
                                    <div class="stepper-control">
                                        <button type="button" class="stepper-btn" onclick="stepQty(this,-1)">-</button>
                                        <input type="number" class="stepper-input qty-karton" value="0" min="0" onchange="updateSummary()">
                                        <button type="button" class="stepper-btn" onclick="stepQty(this,1)">+</button>
                                    </div>
                                </div>
                                <div class="stok-add-qty-group">
                                    <label class="stok-add-qty-label">Box</label>
                                    <div class="stepper-control">
                                        <button type="button" class="stepper-btn" onclick="stepQty(this,-1)">-</button>
                                        <input type="number" class="stepper-input qty-box" value="0" min="0" onchange="updateSummary()">
                                        <button type="button" class="stepper-btn" onclick="stepQty(this,1)">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANE -->
            <div class="pane-right">
                <div class="summary-panel">
                    <h3 class="form-section-title"><i class="fa fa-clipboard-list me-2"></i>Ringkasan</h3>
                    <div class="summary-item"><span class="label">Driver</span><span class="val" id="sumDriver">-</span></div>
                    <div class="summary-item"><span class="label">Gudang</span><span class="val" id="sumGudang">-</span></div>
                    <div class="summary-item"><span class="label">Periode</span><span class="val" id="sumPeriode">- hari</span></div>
                    <div class="summary-divider"></div>
                    <div class="summary-item"><span class="label">Jenis Produk</span><span class="val" id="sumJenis">0</span></div>
                    <div class="summary-item"><span class="label">Total Karton</span><span class="val" id="sumKarton">0</span></div>
                    <div class="summary-item"><span class="label">Total Box</span><span class="val" id="sumBox">0</span></div>
                    <div class="summary-divider"></div>
                    <div class="d-flex flex-column gap-2 mt-4">
                        <button class="btn btn-success w-100 py-2" id="btnSimpanV2"><i class="fa fa-save me-2"></i>Simpan Canvassing</button>
                        <a href="index.html" class="btn btn-outline-secondary w-100">Batal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../../../wwwroot/js/canvassing-store.js"></script>
    <script src="../../../wwwroot/js/layout.js"></script>
    <script>
        // === Pure functions exposed to window (called from inline onclick) ===
        function removeStokItem(btn) {
            Swal.fire({title:'Hapus produk ini?',text:'Produk akan dihapus dari daftar canvassing.',icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#6c757d',confirmButtonText:'Ya, Hapus',cancelButtonText:'Batal'}).then(function(r){
                if(r.isConfirmed){$(btn).closest('.stok-add-item').remove();updateSummary();Swal.fire({icon:'success',title:'Dihapus!',timer:1000,showConfirmButton:false});}
            });
        }
        function stepQty(btn, step) {
            var input = $(btn).siblings('.stepper-input');
            var val = parseInt(input.val()) || 0;
            if(val + step >= 0){input.val(val + step);updateSummary();}
        }
        function updateSummary() {
            var jenis=0,karton=0,box=0;
            $('.stok-add-item').each(function(){
                if($(this).find('.select2-produk').val()){jenis++;karton+=parseInt($(this).find('.qty-karton').val())||0;box+=parseInt($(this).find('.qty-box').val())||0;}
            });
            $('#sumJenis').text(jenis);$('#sumKarton').text(karton);$('#sumBox').text(box);
        }
        window.removeStokItem = removeStokItem;
        window.stepQty = stepQty;
        window.updateSummary = updateSummary;

        document.addEventListener('layoutReady', function() {
            function initSelect2Produk() {
                $('.select2-produk').select2({theme:'bootstrap-5',width:'100%'}).off('change.s2').on('change.s2', function(){
                    var id=$(this).data('id'),stok=$(this).find(':selected').data('stok');
                    $('#stokAvail'+id).text(stok?'Tersedia: '+stok+' Karton':'Tersedia: -');
                    updateSummary();
                });
            }

            function makeProdRow(id, selCode, karton, box) {
                karton = karton || 0; box = box || 0;
                return '<div class="stok-add-item"><div class="stok-add-header">' +
                    '<select class="form-select select2-produk" data-id="'+id+'">' +
                    '<option value="">Pilih Produk</option>' +
                    '<option value="NBE14" data-stok="99999"'+(selCode==='NBE14'?' selected':'')+'>BENECOL STRAW 100ML (NBE14)</option>' +
                    '<option value="FIT01" data-stok="500"'+(selCode==='FIT01'?' selected':'')+'>FITBAR CHOCOLATE (FIT01)</option>' +
                    '</select>' +
                    '<button class="btn-remove-stok-v2" onclick="removeStokItem(this)"><i class="fa fa-trash"></i></button>' +
                    '</div><div class="stok-available" id="stokAvail'+id+'">Tersedia: -</div>' +
                    '<div class="stok-add-qty-row mt-3">' +
                    '<div class="stok-add-qty-group"><label class="stok-add-qty-label">Karton</label><div class="stepper-control"><button type="button" class="stepper-btn" onclick="stepQty(this,-1)">-</button><input type="number" class="stepper-input qty-karton" value="'+karton+'" min="0" onchange="updateSummary()"><button type="button" class="stepper-btn" onclick="stepQty(this,1)">+</button></div></div>' +
                    '<div class="stok-add-qty-group"><label class="stok-add-qty-label">Box</label><div class="stepper-control"><button type="button" class="stepper-btn" onclick="stepQty(this,-1)">-</button><input type="number" class="stepper-input qty-box" value="'+box+'" min="0" onchange="updateSummary()"><button type="button" class="stepper-btn" onclick="stepQty(this,1)">+</button></div></div>' +
                    '</div></div>';
            }

            // Init Select2
            $('.select2-basic').select2({theme:'bootstrap-5',width:'100%'});
            initSelect2Produk();

            // Summary bindings
            $('#inpDriver').on('change', function(){var t=$(this).find('option:selected').text();$('#sumDriver').text(t.indexOf('-')!==-1?t.split('-')[1].trim():t||'-');});
            $('#inpGudang').on('change', function(){$('#sumGudang').text($(this).val()||'-');});
            $('#inpMulai, #inpSelesai').on('change', function(){
                var s=$('#inpMulai').val(),e=$('#inpSelesai').val();
                if(s&&e){var sd=new Date(s),ed=new Date(e);if(ed<sd){Swal.fire({icon:'error',title:'Periode Tidak Valid',text:'Tanggal Selesai tidak boleh mendahului Tanggal Mulai!',confirmButtonColor:'#005d41'});$('#inpSelesai').val('');$('#sumPeriode').text('- hari');return;}$('#sumPeriode').text(Math.ceil((ed-sd)/(86400000))+' hari');}else{$('#sumPeriode').text('- hari');}
            });

            // Edit mode
            var editId = new URLSearchParams(window.location.search).get('id');
            var existingItem = editId ? CanvassingStore.getById(editId) : null;
            var prodCount = 1;

            if(editId && existingItem){
                $('.title-add').text('Edit Canvassing');
                document.title = 'Edit Canvassing - Falcon FPRS';
                $('#inpDriver').val(existingItem.driverCode).trigger('change');
                $('#inpHelper').val(existingItem.helperCode).trigger('change');
                $('#inpGudang').val(existingItem.gudang).trigger('change');
                $('#inpMulai').val(existingItem.tanggalMulai).trigger('change');
                $('#inpSelesai').val(existingItem.tanggalSelesai).trigger('change');
                if(existingItem.items&&existingItem.items.length>0){
                    $('#stokContainer').empty();
                    existingItem.items.forEach(function(item,idx){
                        prodCount=idx+1;
                        $('#stokContainer').append(makeProdRow(prodCount,item.produkCode,item.karton,item.box));
                    });
                    initSelect2Produk();updateSummary();
                }
            }

            // Add product
            $('#btnAddProduct').on('click', function(){
                prodCount++;
                $('#stokContainer').append(makeProdRow(prodCount,'',0,0));
                initSelect2Produk();
            });

            // Save
            $('#btnSimpanV2').on('click', function(){
                if(!$('#inpDriver').val()||!$('#inpGudang').val()||!$('#inpMulai').val()||!$('#inpSelesai').val()){
                    Swal.fire({icon:'warning',title:'Data belum lengkap',text:'Harap isi semua field bertanda bintang (*)'});return;
                }
                Swal.fire({title:editId?'Simpan Perubahan?':'Simpan Canvassing?',text:editId?'Data canvassing akan diperbarui.':'Data akan disimpan dan status menjadi Ongoing',icon:'question',showCancelButton:true,confirmButtonColor:'#005d41',cancelButtonColor:'#6c757d',confirmButtonText:'Ya, Simpan',cancelButtonText:'Batal'}).then(function(result){
                    if(result.isConfirmed){
                        var dr=$('#inpDriver'),hl=$('#inpHelper');
                        var dt=dr.find('option:selected').text(),ht=hl.find('option:selected').text();
                        var items=[];
                        $('.stok-add-item').each(function(){var sel=$(this).find('.select2-produk'),code=sel.val();if(code)items.push({produkCode:code,produkName:sel.find('option:selected').text().split('(')[0].trim(),karton:parseInt($(this).find('.qty-karton').val())||0,box:parseInt($(this).find('.qty-box').val())||0,pcs:0});});
                        var obj={id:editId||undefined,driverCode:dr.val(),driverName:dt.indexOf('-')!==-1?dt.split('-')[1].trim():dt,helperCode:hl.val(),helperName:ht.indexOf('-')!==-1?ht.split('-')[1].trim():(ht||''),gudang:$('#inpGudang').val(),tanggalMulai:$('#inpMulai').val(),tanggalSelesai:$('#inpSelesai').val(),items:items};
                        if(editId&&existingItem)obj.status=existingItem.status;
                        CanvassingStore.save(obj);
                        Swal.fire({icon:'success',title:'Berhasil!',text:editId?'Perubahan berhasil disimpan.':'Canvassing berhasil disimpan.',showConfirmButton:false,timer:1500}).then(function(){window.location.href='index.html';});
                    }
                });
            });
        });
    </script>
</body>
</html>
