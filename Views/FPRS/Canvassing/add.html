<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Tambah Canvassing â€“ Falcon FPRS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"/>
    <link rel="stylesheet" href="../../../wwwroot/css/canvassing-v2.css"/>
    <style>

        @font-face { font-family: 'Kalbe Geometric'; font-style: normal; font-weight: 400; font-display: swap; src: url('../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Regular.woff2') format('woff2'); }
        @font-face { font-family: 'Kalbe Geometric'; font-style: normal; font-weight: 600; font-display: swap; src: url('../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-SemiBold.woff2') format('woff2'); }
        @font-face { font-family: 'Kalbe Geometric'; font-style: normal; font-weight: 700; font-display: swap; src: url('../../../wwwroot/fonts/KalbeGeometric/KalbeGeometric-Bold.woff2') format('woff2'); }
    
</style>
</head>
<body>
    <div id="app-content">

                
                <div class="container-title-add mb-3">
                    <div class="title-box">
                        <a href="index.html" class="btn-back"><i class="fa fa-arrow-left"></i> Kembali ke list</a>
                        <h2 class="title-add mb-1">Tambah Canvassing</h2>
                    </div>
                </div>

                <!-- TWO PANE LAYOUT -->
                <div class="two-pane-container">
                    
                    <!-- LEFT PANE: Form Info -->
                    <div class="pane-left">
                        <div class="form-card">
                            <h3 class="form-section-title"><i class="fa fa-info-circle me-2"></i>Informasi Canvassing</h3>
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label-v2">Driver <span class="text-danger">*</span></label>
                                    <select class="form-select select2-basic" id="inpDriver">
                                        <option value="">Pilih Driver</option>
                                        <option value="EMP-260500040">EMP-260500040 - JAMBI</option>
                                        <option value="EMP-260400021">EMP-260400021 - JAKARTA PUSAT</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-v2">Helper</label>
                                    <select class="form-select select2-basic" id="inpHelper">
                                        <option value="">Pilih Helper</option>
                                        <option value="EMP-260500041">EMP-260500041 - BUDI</option>
                                    </select>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label-v2">Gudang Kanvas <span class="text-danger">*</span></label>
                                    <select class="form-select select2-basic" id="inpGudang">
                                        <option value="">Pilih Gudang</option>
                                        <option value="JAMBI">JAMBI</option>
                                        <option value="JAKARTA PUSAT">JAKARTA PUSAT</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-v2">Mulai Kanvas <span class="text-danger">*</span></label>
                                    <input type="datetime-local" class="form-control" id="inpMulai">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-v2">Selesai Kanvas <span class="text-danger">*</span></label>
                                    <input type="datetime-local" class="form-control" id="inpSelesai">
                                </div>
                            </div>
                        </div>

                        <div class="form-card">
                            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                                <h3 class="form-section-title mb-0 border-0 pb-0"><i class="fa fa-boxes me-2"></i>Stok Produk</h3>
                                <button class="btn btn-sm btn-outline-success" id="btnAddProduct">
                                    <i class="fa fa-plus me-1"></i> Tambah Produk
                                </button>
                            </div>
                            
                            <div id="stokContainer">
                                <!-- Stok Item 1 -->
                                <div class="stok-add-item">
                                    <div class="stok-add-header">
                                        <select class="form-select select2-produk w-75" data-id="1">
                                            <option value="">Pilih Produk</option>
                                            <option value="NBE14" data-stok="99999">BENECOL STRAW 100ML (NBE14)</option>
                                            <option value="FIT01" data-stok="500">FITBAR CHOCOLATE (FIT01)</option>
                                        </select>
                                        <button class="btn-remove-stok-v2" onclick="removeStokItem(this)"><i class="fa fa-trash"></i></button>
                                    </div>
                                    <div class="stok-available" id="stokAvail1">Tersedia: -</div>
                                    
                                    <div class="stok-add-qty-row mt-3">
                                        <div class="stok-add-qty-group">
                                            <label class="stok-add-qty-label">Karton</label>
                                            <div class="stepper-control">
                                                <button type="button" class="stepper-btn" onclick="stepQty(this, -1)">-</button>
                                                <input type="number" class="stepper-input qty-karton" value="0" min="0" onchange="updateSummary()">
                                                <button type="button" class="stepper-btn" onclick="stepQty(this, 1)">+</button>
                                            </div>
                                        </div>
                                        <div class="stok-add-qty-group">
                                            <label class="stok-add-qty-label">Box</label>
                                            <div class="stepper-control">
                                                <button type="button" class="stepper-btn" onclick="stepQty(this, -1)">-</button>
                                                <input type="number" class="stepper-input qty-box" value="0" min="0" onchange="updateSummary()">
                                                <button type="button" class="stepper-btn" onclick="stepQty(this, 1)">+</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT PANE: Summary -->
                    <div class="pane-right">
                        <div class="summary-panel">
                            <h3 class="form-section-title"><i class="fa fa-clipboard-list me-2"></i>Ringkasan</h3>
                            
                            <div class="summary-item">
                                <span class="label">Driver</span>
                                <span class="val" id="sumDriver">-</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">Gudang</span>
                                <span class="val" id="sumGudang">-</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">Periode</span>
                                <span class="val" id="sumPeriode">- hari</span>
                            </div>
                            
                            <div class="summary-divider"></div>
                            
                            <div class="summary-item">
                                <span class="label">Jenis Produk</span>
                                <span class="val" id="sumJenis">0</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">Total Karton</span>
                                <span class="val" id="sumKarton">0</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">Total Box</span>
                                <span class="val" id="sumBox">0</span>
                            </div>
                            
                            <div class="summary-divider"></div>
                            
                            <div class="d-flex flex-column gap-2 mt-4">
                                <button class="btn btn-success w-100 py-2" id="btnSimpanV2"><i class="fa fa-save me-2"></i>Simpan Canvassing</button>
                                <a href="index.html" class="btn btn-outline-secondary w-100">Batal</a>
                            </div>
                        </div>
                    </div>

                </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../../../wwwroot/js/canvassing-store.js"></script>
    <script src="../../../wwwroot/js/layout.js"></script>
    <script>
        document.addEventListener('layoutReady', () => {

$(document).ready(function () {
    $('.select2-basic').select2({ theme: 'bootstrap-5', width: '100%' });
    initSelect2Produk();

    // Summary bindings
    $('#inpDriver').change(function() { 
        var text = $(this).find('option:selected').text();
        $('#sumDriver').text(text.indexOf('-') !== -1 ? text.split('-')[1].trim() : text || '-'); 
    });
    $('#inpGudang').change(function() { $('#sumGudang').text($(this).val() || '-'); });
    
    $('#inpMulai, #inpSelesai').change(function() {
        var startVal = $('#inpMulai').val();
        var endVal = $('#inpSelesai').val();
        if(startVal && endVal) {
            var start = new Date(startVal);
            var end = new Date(endVal);
            if(end < start) {
                Swal.fire({
                    icon: 'error',
                    title: 'Periode Tidak Valid',
                    text: 'Tanggal Selesai tidak boleh mendahului Tanggal Mulai!',
                    confirmButtonColor: '#005d41'
                });
                $('#inpSelesai').val('');
                $('#sumPeriode').text('- hari');
                return;
            }
            var diff = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
            $('#sumPeriode').text(diff + ' hari');
        } else {
            $('#sumPeriode').text('- hari');
        }
    });

    // Detect Edit mode
    var editId = new URLSearchParams(window.location.search).get('id');
    var existingItem = null;
    if (editId) {
        existingItem = CanvassingStore.getById(editId);
        if (existingItem) {
            // Change title
            $('.title-add').text('Edit Canvassing');
            document.title = 'Edit Canvassing â€“ Falcon FPRS';
            
            // Populate fields
            $('#inpDriver').val(existingItem.driverCode).trigger('change');
            $('#inpHelper').val(existingItem.helperCode).trigger('change');
            $('#inpGudang').val(existingItem.gudang).trigger('change');
            $('#inpMulai').val(existingItem.tanggalMulai).trigger('change');
            $('#inpSelesai').val(existingItem.tanggalSelesai).trigger('change');

            // Render existing items
            if (existingItem.items && existingItem.items.length > 0) {
                $('#stokContainer').empty();
                existingItem.items.forEach(function(stokItem, idx) {
                    var currentProdId = idx + 1;
                    var html = `
                        <div class="stok-add-item">
                            <div class="stok-add-header">
                                <select class="form-select select2-produk w-75" data-id="${currentProdId}">
                                    <option value="">Pilih Produk</option>
                                    <option value="NBE14" data-stok="99999" ${stokItem.produkCode === 'NBE14' ? 'selected' : ''}>BENECOL STRAW 100ML (NBE14)</option>
                                    <option value="FIT01" data-stok="500" ${stokItem.produkCode === 'FIT01' ? 'selected' : ''}>FITBAR CHOCOLATE (FIT01)</option>
                                </select>
                                <button class="btn-remove-stok-v2" onclick="removeStokItem(this)"><i class="fa fa-trash"></i></button>
                            </div>
                            <div class="stok-available" id="stokAvail${currentProdId}">Tersedia: -</div>
                            <div class="stok-add-qty-row mt-3">
                                <div class="stok-add-qty-group">
                                    <label class="stok-add-qty-label">Karton</label>
                                    <div class="stepper-control">
                                        <button type="button" class="stepper-btn" onclick="stepQty(this, -1)">-</button>
                                        <input type="number" class="stepper-input qty-karton" value="${stokItem.karton || 0}" min="0" onchange="updateSummary()">
                                        <button type="button" class="stepper-btn" onclick="stepQty(this, 1)">+</button>
                                    </div>
                                </div>
                                <div class="stok-add-qty-group">
                                    <label class="stok-add-qty-label">Box</label>
                                    <div class="stepper-control">
                                        <button type="button" class="stepper-btn" onclick="stepQty(this, -1)">-</button>
                                        <input type="number" class="stepper-input qty-box" value="${stokItem.box || 0}" min="0" onchange="updateSummary()">
                                        <button type="button" class="stepper-btn" onclick="stepQty(this, 1)">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    $('#stokContainer').append(html);
                });
                prodCount = existingItem.items.length;
                initSelect2Produk();
                
                // Update available labels
                $('.select2-produk').each(function() {
                    var id = $(this).data('id');
                    var stok = $(this).find(':selected').data('stok');
                    $('#stokAvail' + id).text(stok ? 'Tersedia: ' + stok + ' Karton' : 'Tersedia: -');
                });
                updateSummary();
            }
        }
    }

    // Add product row
    var prodCount = editId && existingItem && existingItem.items ? existingItem.items.length : 1;
    $('#btnAddProduct').click(function() {
        prodCount++;
        var html = `
            <div class="stok-add-item">
                <div class="stok-add-header">
                    <select class="form-select select2-produk w-75" data-id="${prodCount}">
                        <option value="">Pilih Produk</option>
                        <option value="NBE14" data-stok="99999">BENECOL STRAW 100ML (NBE14)</option>
                        <option value="FIT01" data-stok="500">FITBAR CHOCOLATE (FIT01)</option>
                    </select>
                    <button class="btn-remove-stok-v2" onclick="removeStokItem(this)"><i class="fa fa-trash"></i></button>
                </div>
                <div class="stok-available" id="stokAvail${prodCount}">Tersedia: -</div>
                <div class="stok-add-qty-row mt-3">
                    <div class="stok-add-qty-group">
                        <label class="stok-add-qty-label">Karton</label>
                        <div class="stepper-control">
                            <button type="button" class="stepper-btn" onclick="stepQty(this, -1)">-</button>
                            <input type="number" class="stepper-input qty-karton" value="0" min="0" onchange="updateSummary()">
                            <button type="button" class="stepper-btn" onclick="stepQty(this, 1)">+</button>
                        </div>
                    </div>
                    <div class="stok-add-qty-group">
                        <label class="stok-add-qty-label">Box</label>
                        <div class="stepper-control">
                            <button type="button" class="stepper-btn" onclick="stepQty(this, -1)">-</button>
                            <input type="number" class="stepper-input qty-box" value="0" min="0" onchange="updateSummary()">
                            <button type="button" class="stepper-btn" onclick="stepQty(this, 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>`;
        $('#stokContainer').append(html);
        initSelect2Produk();
    });

    // Save with SweetAlert
    $('#btnSimpanV2').click(function() {
        if(!$('#inpDriver').val() || !$('#inpGudang').val() || !$('#inpMulai').val() || !$('#inpSelesai').val()) {
            Swal.fire({
                icon: 'warning',
                title: 'Data belum lengkap',
                text: 'Harap isi semua field bertanda bintang (*)'
            });
            return;
        }

        Swal.fire({
            title: editId ? 'Simpan Perubahan?' : 'Simpan Canvassing?',
            text: editId ? "Data canvassing akan diperbarui." : "Data akan disimpan dan status menjadi Ongoing",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#005d41',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Ya, Simpan',
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                // Collect values and save
                var driverSelect = $('#inpDriver');
                var helperSelect = $('#inpHelper');
                var selectedDriverText = driverSelect.find('option:selected').text();
                var selectedHelperText = helperSelect.find('option:selected').text();
                
                var items = [];
                $('.stok-add-item').each(function() {
                    var select = $(this).find('.select2-produk');
                    var prodCode = select.val();
                    if(prodCode) {
                        var prodText = select.find('option:selected').text();
                        var prodName = prodText.split('(')[0].trim();
                        var karton = parseInt($(this).find('.qty-karton').val()) || 0;
                        var box = parseInt($(this).find('.qty-box').val()) || 0;
                        items.push({
                            produkCode: prodCode,
                            produkName: prodName,
                            karton: karton,
                            box: box,
                            pcs: 0
                        });
                    }
                });

                var saveObj = {
                    id: editId || undefined,
                    driverCode: driverSelect.val(),
                    driverName: selectedDriverText.indexOf('-') !== -1 ? selectedDriverText.split('-')[1].trim() : selectedDriverText,
                    helperCode: helperSelect.val(),
                    helperName: selectedHelperText.indexOf('-') !== -1 ? selectedHelperText.split('-')[1].trim() : (selectedHelperText || ''),
                    gudang: $('#inpGudang').val(),
                    tanggalMulai: $('#inpMulai').val(),
                    tanggalSelesai: $('#inpSelesai').val(),
                    items: items
                };
                
                if (editId && existingItem) {
                    saveObj.status = existingItem.status;
                }

                CanvassingStore.save(saveObj);

                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: editId ? 'Perubahan berhasil disimpan.' : 'Canvassing berhasil disimpan.',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    window.location.href = 'index.html';
                });
            }
        });
    });
});

function initSelect2Produk() {
    $('.select2-produk').select2({ theme: 'bootstrap-5', width: '75%' }).on('change', function() {
        var id = $(this).data('id');
        var stok = $(this).find(':selected').data('stok');
        $('#stokAvail' + id).text(stok ? 'Tersedia: ' + stok + ' Karton' : 'Tersedia: -');
        updateSummary();
    });
}

function removeStokItem(btn) {
    Swal.fire({
        title: 'Hapus produk ini?',
        text: 'Produk akan dihapus dari daftar canvassing.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Ya, Hapus',
        cancelButtonText: 'Batal'
    }).then((result) => {
        if (result.isConfirmed) {
            $(btn).closest('.stok-add-item').remove();
            updateSummary();
            Swal.fire({
                icon: 'success',
                title: 'Dihapus!',
                text: 'Produk telah dihapus.',
                timer: 1000,
                showConfirmButton: false
            });
        }
    });
}

function stepQty(btn, step) {
    var input = $(btn).siblings('.stepper-input');
    var val = parseInt(input.val()) || 0;
    if(val + step >= 0) {
        input.val(val + step);
        updateSummary();
    }
}

function updateSummary() {
    var jenis = 0, karton = 0, box = 0;
    $('.stok-add-item').each(function() {
        if($(this).find('.select2-produk').val()) {
            jenis++;
            karton += parseInt($(this).find('.qty-karton').val()) || 0;
            box += parseInt($(this).find('.qty-box').val()) || 0;
        }
    });
    $('#sumJenis').text(jenis);
    $('#sumKarton').text(karton);
    $('#sumBox').text(box);
}

        });
    </script>
</body>
</html>
