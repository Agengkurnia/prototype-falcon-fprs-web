<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Canvassing V2 - Unit Test Suite</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-running {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .badge-passed {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .badge-failed {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .card-total::before { background-color: var(--accent-blue); }
        .card-passed::before { background-color: var(--accent-green); }
        .card-failed::before { background-color: var(--accent-red); }
        .card-duration::before { background-color: var(--text-muted); }

        .summary-val {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
        }

        .summary-lbl {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .suite-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .suite-header {
            padding: 1.25rem;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suite-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .suite-title i {
            color: var(--accent-blue);
        }

        .test-list {
            padding: 0.5rem 0;
        }

        .test-item {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            font-size: 0.95rem;
            transition: background-color 0.15s ease;
        }

        .test-item:last-child {
            border-bottom: none;
        }

        .test-item:hover {
            background-color: rgba(255, 255, 255, 0.01);
        }

        .test-status-icon {
            font-size: 1.1rem;
            margin-top: 0.1rem;
        }

        .icon-passed { color: var(--accent-green); }
        .icon-failed { color: var(--accent-red); }

        .test-details {
            flex: 1;
        }

        .test-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .test-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .test-error {
            font-family: 'JetBrains Mono', monospace;
            background-color: rgba(239, 68, 68, 0.08);
            border-left: 3px solid var(--accent-red);
            padding: 0.75rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            border-radius: 0 6px 6px 0;
            color: #fca5a5;
            white-space: pre-wrap;
        }

        .btn-run {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
            transition: all 0.2s ease;
        }

        .btn-run:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(16, 185, 129, 0.3);
        }

        .btn-run:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Falcon Canvassing V2</h1>
            <div class="subtitle">Unit Test Suite – Browser Persisted JSON Store</div>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <span class="badge badge-running" id="overallStatus">Idle</span>
            <button class="btn-run" onclick="runAllTests()">
                <i class="fa fa-play"></i> Run Tests
            </button>
        </div>
    </header>

    <div class="summary-grid">
        <div class="summary-card card-total">
            <div class="summary-val" id="totalVal">0</div>
            <div class="summary-lbl">Total Tests</div>
        </div>
        <div class="summary-card card-passed">
            <div class="summary-val" style="color: var(--accent-green);" id="passedVal">0</div>
            <div class="summary-lbl">Passed</div>
        </div>
        <div class="summary-card card-failed">
            <div class="summary-val" style="color: var(--accent-red);" id="failedVal">0</div>
            <div class="summary-lbl">Failed</div>
        </div>
        <div class="summary-card card-duration">
            <div class="summary-val" id="durationVal">0ms</div>
            <div class="summary-lbl">Duration</div>
        </div>
    </div>

    <div id="suitesContainer">
        <!-- Test suites will be rendered dynamically -->
    </div>
</div>

<script src="../../../wwwroot/js/canvassing-store.js"></script>
<script>
    // Test framework implementation
    const suites = [];
    let currentSuite = null;

    function describe(title, callback) {
        currentSuite = {
            title: title,
            tests: []
        };
        suites.push(currentSuite);
        callback();
    }

    function it(name, callback, desc = '') {
        currentSuite.tests.push({
            name: name,
            desc: desc,
            fn: callback,
            status: 'idle',
            error: null
        });
    }

    // Assertions helper
    const assert = {
        ok: function(value, message = 'Harus bernilai true/truthy') {
            if (!value) throw new Error(`Assertion failed: ${message}. Didapat: ${value}`);
        },
        equal: function(actual, expected, message = 'Harus sama') {
            if (actual !== expected) {
                throw new Error(`Assertion failed: ${message}. Harapan: ${expected}, Aktual: ${actual}`);
            }
        },
        deepEqual: function(actual, expected, message = 'Harus sama secara struktural') {
            const actualStr = JSON.stringify(actual);
            const expectedStr = JSON.stringify(expected);
            if (actualStr !== expectedStr) {
                throw new Error(`Assertion failed: ${message}.\nHarapan: ${expectedStr}\nAktual: ${actualStr}`);
            }
        }
    };

    // --- WRITE UNIT TESTS ---
    
    describe('Scenario 1: Inisialisasi Data Default', () => {
        it('Harus membuat 20 records dummy saat localStorage kosong', () => {
            localStorage.removeItem(CanvassingStore.STORAGE_KEY);
            const data = CanvassingStore.getAll();
            assert.equal(data.length, 20, 'Dummy data harus diinisialisasi tepat 20 records');
            assert.ok(data[0].id.startsWith('CVS-26'), 'ID canvassing harus berformat CVS-26xxxxxx');
        }, 'Verifikasi modul mendeteksi storage kosong dan otomatis mengisinya.');

        it('Harus mempertahankan data yang sudah ada', () => {
            const mockData = [{ id: 'CVS-MOCK123', status: 'Ongoing', items: [] }];
            localStorage.setItem(CanvassingStore.STORAGE_KEY, JSON.stringify(mockData));
            const data = CanvassingStore.getAll();
            assert.equal(data.length, 1, 'Harus mengambil data mock yang kita set langsung');
            assert.equal(data[0].id, 'CVS-MOCK123', 'ID record harus sama');
        }, 'Memastikan modul tidak menimpa data pengguna yang sudah ada di localStorage.');
    });

    describe('Scenario 2: Retrieval Data (Read)', () => {
        it('Harus mengembalikan detail data yang dicari berdasarkan ID', () => {
            const mockData = [
                { id: 'CVS-1', driverName: 'DRIVER A', gudang: 'JAMBI' },
                { id: 'CVS-2', driverName: 'DRIVER B', gudang: 'SURABAYA' }
            ];
            localStorage.setItem(CanvassingStore.STORAGE_KEY, JSON.stringify(mockData));
            
            const item = CanvassingStore.getById('CVS-2');
            assert.ok(item !== null, 'Item harus ditemukan');
            assert.equal(item.driverName, 'DRIVER B', 'Nama driver harus cocok');
            
            const missing = CanvassingStore.getById('CVS-KOSONG');
            assert.equal(missing, null, 'Mengembalikan null jika ID tidak ditemukan');
        }, 'Mencakup retrieval getById() untuk binding data di Detail view.');
    });

    describe('Scenario 3: Pembuatan Data Baru (Create)', () => {
        it('Harus menyimpan record baru dengan ID unik otomatis', () => {
            localStorage.setItem(CanvassingStore.STORAGE_KEY, JSON.stringify([]));
            const newRecord = {
                driverCode: 'EMP-999',
                driverName: 'TEST DRIVER',
                gudang: 'BANDUNG',
                tanggalMulai: '2026-06-01T08:00',
                tanggalSelesai: '2026-06-05T17:00'
            };
            
            const saved = CanvassingStore.save(newRecord);
            assert.ok(saved.id !== undefined, 'ID harus di-generate otomatis');
            assert.equal(saved.status, 'Ongoing', 'Status awal harus otomatis Ongoing');
            assert.equal(saved.durationDays, 4, 'Durasi hari harus dihitung tepat');
            
            const list = CanvassingStore.getAll();
            assert.equal(list.length, 1, 'Data harus tersimpan ke storage list');
        }, 'Memvalidasi modul Tambah Canvassing baru.');
    });

    describe('Scenario 4: Pembaruan Data (Update & Merge)', () => {
        it('Harus melakukan update pada data yang sudah ada', () => {
            const original = {
                id: 'CVS-EDIT',
                driverName: 'DRIVER LAMA',
                gudang: 'MEDAN',
                status: 'Ongoing'
            };
            localStorage.setItem(CanvassingStore.STORAGE_KEY, JSON.stringify([original]));
            
            const updated = {
                id: 'CVS-EDIT',
                driverName: 'DRIVER BARU',
                gudang: 'MEDAN'
            };
            
            CanvassingStore.save(updated);
            const fetched = CanvassingStore.getById('CVS-EDIT');
            assert.equal(fetched.driverName, 'DRIVER BARU', 'Nama driver harus terupdate');
            assert.equal(fetched.status, 'Ongoing', 'Status asal harus tetap dipertahankan');
        }, 'Memvalidasi modul Edit Canvassing.');

        it('Harus menggabungkan produk (merge items) agar tidak menghilangkan log penjualan/retur', () => {
            const original = {
                id: 'CVS-MERGE',
                items: [
                    { produkCode: 'NBE14', produkName: 'BENECOL', karton: 100, soldKarton: 10, retKarton: 2 }
                ]
            };
            localStorage.setItem(CanvassingStore.STORAGE_KEY, JSON.stringify([original]));
            
            // Pengguna mengubah kuantitas awal BENECOL dari 100 menjadi 120 Karton lewat Edit view
            const updateForm = {
                id: 'CVS-MERGE',
                items: [
                    { produkCode: 'NBE14', produkName: 'BENECOL', karton: 120, box: 0, pcs: 0 }
                ]
            };
            
            CanvassingStore.save(updateForm);
            
            const fetched = CanvassingStore.getById('CVS-MERGE');
            assert.equal(fetched.items.length, 1, 'Jumlah produk harus tetap 1');
            assert.equal(fetched.items[0].karton, 120, 'Kuantitas awal berhasil terupdate');
            assert.equal(fetched.items[0].soldKarton, 10, 'Penjualan lama (10) tidak boleh hilang');
            assert.equal(fetched.items[0].retKarton, 2, 'Retur lama (2) tidak boleh hilang');
        }, 'Memvalidasi ketahanan integritas data penjualan saat edit kuantitas awal produk.');
    });

    describe('Scenario 5: Penghapusan Data (Delete)', () => {
        it('Harus menghapus record berdasarkan ID', () => {
            const mockData = [
                { id: 'CVS-1' },
                { id: 'CVS-2' }
            ];
            localStorage.setItem(CanvassingStore.STORAGE_KEY, JSON.stringify(mockData));
            
            const success = CanvassingStore.delete('CVS-1');
            assert.equal(success, true, 'Method delete harus mengembalikan true');
            
            const list = CanvassingStore.getAll();
            assert.equal(list.length, 1, 'Data harus berkurang menjadi 1');
            assert.equal(list[0].id, 'CVS-2', 'Sisa item harus memiliki ID CVS-2');
        }, 'Memvalidasi aksi tombol hapus di List view.');
    });

    describe('Scenario 6: Status & Progress Logic', () => {
        it('Harus mengkalkulasi progressPct secara otomatis', () => {
            const start = new Date();
            start.setDate(start.getDate() - 5); // 5 hari lalu
            const end = new Date();
            end.setDate(end.getDate() + 5); // 5 hari ke depan
            
            const record = {
                id: 'CVS-PROG',
                tanggalMulai: start.toISOString(),
                tanggalSelesai: end.toISOString(),
                status: 'Ongoing'
            };
            
            const saved = CanvassingStore.save(record);
            // 5 hari berlalu dari total durasi 10 hari = progress ~50%
            assert.ok(saved.progressPct >= 45 && saved.progressPct <= 55, `Progress harus ~50%. Hasil didapat: ${saved.progressPct}%`);
        }, 'Memverifikasi penayangan persentase durasi waktu canvassing.');

        it('Harus mengeset progressPct ke 100% jika status diset Completed', () => {
            const record = {
                id: 'CVS-STATUS',
                status: 'Completed'
            };
            localStorage.setItem(CanvassingStore.STORAGE_KEY, JSON.stringify([record]));
            
            CanvassingStore.updateStatus('CVS-STATUS', 'Completed');
            const fetched = CanvassingStore.getById('CVS-STATUS');
            assert.equal(fetched.status, 'Completed', 'Status harus terupdate');
            assert.equal(fetched.progressPct, 100, 'Progress harus dipaksa ke 100% jika selesai');
        }, 'Verifikasi tombol dropdown Selesaikan Stok pada halaman detail.');
    });

    // --- TEST RUNNER LOGIC ---

    function runAllTests() {
        // Backup user's actual data so we don't destroy their current localStorage state
        const backupData = localStorage.getItem(CanvassingStore.STORAGE_KEY);
        
        const statusEl = document.getElementById('overallStatus');
        statusEl.className = 'badge badge-running';
        statusEl.innerText = 'Running';
        
        let total = 0;
        let passed = 0;
        let failed = 0;
        const startTime = performance.now();

        suites.forEach(suite => {
            suite.tests.forEach(test => {
                total++;
                try {
                    test.fn();
                    test.status = 'passed';
                    passed++;
                } catch (e) {
                    test.status = 'failed';
                    test.error = e.message + '\n' + e.stack.split('\n').slice(0, 3).join('\n');
                    failed++;
                }
            });
        });

        const endTime = performance.now();
        const duration = Math.round(endTime - startTime);

        // Restore actual user data
        if (backupData) {
            localStorage.setItem(CanvassingStore.STORAGE_KEY, backupData);
        } else {
            localStorage.removeItem(CanvassingStore.STORAGE_KEY);
        }

        // Render results
        document.getElementById('totalVal').innerText = total;
        document.getElementById('passedVal').innerText = passed;
        document.getElementById('failedVal').innerText = failed;
        document.getElementById('durationVal').innerText = duration + 'ms';

        if (failed === 0) {
            statusEl.className = 'badge badge-passed';
            statusEl.innerText = 'Passed';
        } else {
            statusEl.className = 'badge badge-failed';
            statusEl.innerText = 'Failed';
        }

        renderSuites();
        
        // Expose overall outcome for headless verification/scrappers
        window.testSuiteResult = {
            total: total,
            passed: passed,
            failed: failed,
            duration: duration,
            success: failed === 0
        };
    }

    function renderSuites() {
        const container = document.getElementById('suitesContainer');
        container.innerHTML = '';

        suites.forEach((suite, sIdx) => {
            const suiteEl = document.createElement('div');
            suiteEl.className = 'suite-card';
            
            // Calculate suite status
            const failedTests = suite.tests.filter(t => t.status === 'failed').length;
            const suiteStatusHtml = failedTests > 0 
                ? `<span class="badge badge-failed">${failedTests} Failed</span>`
                : `<span class="badge badge-passed">Passed</span>`;

            suiteEl.innerHTML = `
                <div class="suite-header">
                    <div class="suite-title">
                        <i class="fa fa-folder-open"></i>
                        <span>${suite.title}</span>
                    </div>
                    <div>${suiteStatusHtml}</div>
                </div>
                <div class="test-list" id="suite-list-${sIdx}"></div>
            `;
            container.appendChild(suiteEl);

            const listEl = document.getElementById(`suite-list-${sIdx}`);
            suite.tests.forEach(test => {
                const itemEl = document.createElement('div');
                itemEl.className = 'test-item';
                
                const statusIcon = test.status === 'passed' 
                    ? `<i class="fa-solid fa-circle-check test-status-icon icon-passed"></i>`
                    : test.status === 'failed'
                        ? `<i class="fa-solid fa-circle-xmark test-status-icon icon-failed"></i>`
                        : `<i class="fa-regular fa-circle test-status-icon text-muted"></i>`;

                itemEl.innerHTML = `
                    ${statusIcon}
                    <div class="test-details">
                        <div class="test-name">${test.name}</div>
                        ${test.desc ? `<div class="test-desc">${test.desc}</div>` : ''}
                        ${test.error ? `<pre class="test-error">${test.error}</pre>` : ''}
                    </div>
                `;
                listEl.appendChild(itemEl);
            });
        });
    }

    // Run automatically on load (so we get results instantly)
    window.addEventListener('load', () => {
        renderSuites();
        runAllTests();
    });
</script>
</body>
</html>
