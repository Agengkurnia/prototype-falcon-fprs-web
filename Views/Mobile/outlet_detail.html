<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Detail Outlet - Falcon SFA Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <!-- Leaflet.js for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
    <style>
        #mapContainer { height: 200px; border-radius: 12px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--color-border); }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
        .info-label { color: var(--color-gray); font-weight: 500; }
        .info-value { color: var(--color-black); font-weight: 600; text-align: right; max-width: 60%; }
        .gps-status-bar {
            border-radius: 10px; padding: 12px 14px;
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 12px; font-size: 13px;
        }
        .gps-ok { background: #e2f0d9; color: #385723; border: 1px solid #c7e0bc; }
        .gps-missing { background: #FFF2CC; color: #B25900; border: 1px solid #FFE599; }
        .btn-gps {
            background: var(--color-primary);
            color: #fff; border: none; border-radius: 20px;
            padding: 10px 18px; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            transition: background 0.2s;
        }
        .btn-gps:active { background: var(--color-primary-dark); }
        .gallery-row {
            display: flex; gap: 8px; overflow-x: auto;
            scrollbar-width: none; margin-bottom: 8px;
        }
        .gallery-row::-webkit-scrollbar { display: none; }
        .gallery-thumb {
            width: 80px; height: 80px; flex-shrink: 0;
            border-radius: 10px; object-fit: cover;
            border: 1px solid var(--color-border);
            background: var(--color-gray-light);
            display: flex; align-items: center; justify-content: center;
            color: var(--color-gray); font-size: 24px;
        }
    </style>
</head>
<body style="background:#f7f9fa;">
<div class="mobile-wrapper">
    <div class="mobile-header">
        <button class="header-action" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <span class="header-title" id="headerTitle">Detail Outlet</span>
        <a id="editBtn" href="#" class="header-action"><i class="fas fa-edit" style="font-size:16px;"></i></a>
    </div>

    <div class="mobile-content no-nav" style="padding-bottom:16px;">
        <div class="p-16">

            <!-- Map -->
            <div id="mapContainer">
                <div id="map" style="width:100%;height:100%;"></div>
                <div id="mapPlaceholder" style="display:none; background:#e3ece6; height:100%; display:flex; align-items:center; justify-content:center; color:var(--color-gray);">
                    <div class="text-center">
                        <i class="fas fa-map-marker-alt fs-2 d-block mb-2"></i>
                        <span style="font-size:13px;">Koordinat GPS belum tersedia</span>
                    </div>
                </div>
            </div>

            <!-- GPS Status -->
            <div id="gpsStatus" class="gps-missing gps-status-bar">
                <i class="fas fa-exclamation-triangle fs-5"></i>
                <div style="flex:1;">
                    <div style="font-weight:700;" id="gpsStatusText">Belum Ada Koordinat GPS</div>
                    <div style="font-size:11px; margin-top:2px;" id="gpsCoordText">Klik tombol untuk update lokasi</div>
                </div>
                <button class="btn-gps" onclick="updateGps()">
                    <i class="fas fa-crosshairs"></i> Update GPS
                </button>
            </div>

            <!-- Info Card -->
            <div class="mobile-card">
                <div class="d-flex justify-content-between align-items-start mb-12">
                    <div>
                        <h2 class="fs-5 fw-bold mb-1" id="outletName">-</h2>
                        <span class="badge-mobile badge-mobile-info" id="outletType">-</span>
                    </div>
                    <span class="badge-mobile badge-mobile-success" id="outletStatus">-</span>
                </div>

                <div class="info-row">
                    <span class="info-label">Kode Outlet</span>
                    <span class="info-value" id="outletCode">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Pemilik</span>
                    <span class="info-value" id="outletOwner">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">No. HP</span>
                    <span class="info-value" id="outletPhone">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Alamat</span>
                    <span class="info-value" id="outletAddress">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Kecamatan</span>
                    <span class="info-value" id="outletKec">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Kota</span>
                    <span class="info-value" id="outletKota">-</span>
                </div>
                <div class="info-row mb-0">
                    <span class="info-label">Channel</span>
                    <span class="info-value" id="outletChannel">-</span>
                </div>
            </div>

            <!-- AR Info -->
            <div class="mobile-card">
                <h4 class="fs-6 fw-bold mb-3"><i class="fas fa-file-invoice-dollar me-2 text-danger"></i>Piutang (AR)</h4>
                <div class="info-row mb-0">
                    <span class="info-label">Outstanding AR</span>
                    <span class="info-value fw-bold text-danger" id="outletAR">Rp0</span>
                </div>
            </div>

            <!-- Foto Toko -->
            <div class="mobile-card">
                <h4 class="fs-6 fw-bold mb-3"><i class="fas fa-images me-2 text-primary"></i>Foto Toko</h4>
                <div class="gallery-row" id="galleryRow">
                    <div class="gallery-thumb"><i class="fas fa-store"></i></div>
                    <div class="gallery-thumb"><i class="fas fa-store"></i></div>
                </div>
                <p style="font-size:11px; color:var(--color-gray); margin-top:4px;">Foto outlet (simulasi)</p>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../wwwroot/js/sfa-store.js"></script>
<script>
    let outletId = null;
    let outlet = null;
    let map = null;
    let marker = null;

    $(document).ready(function() {
        const params = new URLSearchParams(window.location.search);
        outletId = params.get('id');

        if (!outletId) { history.back(); return; }

        outlet = SfaStore.getCustomerById(outletId);
        if (!outlet) { history.back(); return; }

        // Edit button
        $('#editBtn').attr('href', `outlet_add.html?id=${outletId}`);

        populateData();
        initMap();
    });

    function populateData() {
        $('#headerTitle').text(outlet.name);
        $('#outletName').text(outlet.name);
        $('#outletCode').text(outlet.id);
        $('#outletOwner').text(outlet.owner || '-');
        $('#outletPhone').text(outlet.phone || '-');
        $('#outletAddress').text(outlet.address || '-');
        $('#outletKec').text(outlet.kecamatan || '-');
        $('#outletKota').text(outlet.kota || '-');
        $('#outletChannel').text(outlet.channel || '-');
        $('#outletType').text(outlet.outletType || 'Outlet Regular');
        $('#outletStatus').text(outlet.status || 'Aktif');

        const ar = SfaStore.getOutstandingByCustomerId(outletId);
        $('#outletAR').text(SfaStore.formatRupiah(ar));

        if (outlet.hasGps && outlet.lat && outlet.lng) {
            $('#gpsStatus').removeClass('gps-missing').addClass('gps-ok');
            $('#gpsStatusText').text('Koordinat GPS Tersedia');
            $('#gpsCoordText').text(`${outlet.lat.toFixed(6)}, ${outlet.lng.toFixed(6)}`);
        }
    }

    function initMap() {
        if (outlet.hasGps && outlet.lat && outlet.lng) {
            map = L.map('map').setView([outlet.lat, outlet.lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            marker = L.marker([outlet.lat, outlet.lng]).addTo(map)
                .bindPopup(`<b>${outlet.name}</b><br>${outlet.address}`).openPopup();
        } else {
            $('#map').hide();
            $('#mapPlaceholder').css('display', 'flex');
        }
    }

    function updateGps() {
        if (!navigator.geolocation) {
            Swal.fire('Tidak Didukung', 'Browser ini tidak mendukung geolocation.', 'error');
            return;
        }

        Swal.fire({
            title: 'Mengambil Lokasi GPS...',
            text: 'Mohon tunggu, mendeteksi koordinat Anda.',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        navigator.geolocation.getCurrentPosition(
            function(pos) {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;

                SfaStore.updateCustomerGps(outletId, lat, lng);
                outlet.lat = lat;
                outlet.lng = lng;
                outlet.hasGps = true;

                // Update map
                if (!map) {
                    $('#map').show();
                    $('#mapPlaceholder').hide();
                    map = L.map('map').setView([lat, lng], 16);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);
                } else {
                    map.setView([lat, lng], 16);
                    if (marker) map.removeLayer(marker);
                }
                marker = L.marker([lat, lng]).addTo(map)
                    .bindPopup(`<b>${outlet.name}</b><br>GPS diperbarui`).openPopup();

                $('#gpsStatus').removeClass('gps-missing').addClass('gps-ok');
                $('#gpsStatusText').text('Koordinat GPS Diperbarui');
                $('#gpsCoordText').text(`${lat.toFixed(6)}, ${lng.toFixed(6)}`);

                Swal.fire({
                    icon: 'success',
                    title: 'GPS Berhasil Diperbarui',
                    text: `Koordinat: ${lat.toFixed(6)}, ${lng.toFixed(6)}`,
                    timer: 2000,
                    showConfirmButton: false
                });
            },
            function(err) {
                // Simulasi GPS jika ditolak (untuk demo di browser desktop)
                const simLat = -6.1954 + (Math.random() - 0.5) * 0.01;
                const simLng = 106.8231 + (Math.random() - 0.5) * 0.01;
                SfaStore.updateCustomerGps(outletId, simLat, simLng);

                Swal.fire({
                    icon: 'info',
                    title: 'GPS Simulasi',
                    text: `Izin GPS ditolak. Menggunakan koordinat simulasi: ${simLat.toFixed(4)}, ${simLng.toFixed(4)}`,
                    confirmButtonColor: '#005D41'
                });
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }
</script>
</body>
</html>
