<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Geo Tag Outlet - Falcon SFA Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <link rel="stylesheet" href="../../wwwroot/css/mobile.css"/>
    <style>
        .search-container {
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 56px;
            z-index: 89;
        }
        .search-box {
            background: var(--color-gray-light);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 14px;
        }
        .search-box input {
            border: none; background: transparent;
            padding: 10px 8px; width: 100%;
            font-size: 14px; outline: none;
        }
        .filter-chips {
            display: flex; gap: 8px;
            padding: 10px 16px;
            overflow-x: auto; scrollbar-width: none;
            background: #fff;
            border-bottom: 1px solid var(--color-border);
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .chip {
            padding: 5px 14px; border-radius: 16px;
            font-size: 12px; font-weight: 600;
            border: 1px solid var(--color-border);
            background: #fff; color: var(--color-gray);
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .chip.active {
            background: var(--color-primary);
            color: #fff; border-color: var(--color-primary);
        }
        .outlet-card {
            background: #fff; border: 1px solid var(--color-border);
            border-radius: 12px; padding: 12px 14px;
            margin-bottom: 10px; display: flex; gap: 12px;
            text-decoration: none; color: inherit;
            transition: transform 0.1s;
            align-items: center;
        }
        .outlet-card:active { transform: scale(0.98); }
        .outlet-img-container {
            width: 60px; height: 60px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
            border: 1px solid var(--color-border); background: var(--color-gray-light);
        }
        .outlet-img-container img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .outlet-info-container {
            flex-grow: 1; min-width: 0;
        }
        .outlet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .outlet-name { font-size: 14px; font-weight: 700; }
        .outlet-meta { font-size: 12px; color: var(--color-gray); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
        .gps-badge {
            font-size: 10px; font-weight: 700;
            padding: 2px 7px; border-radius: 8px;
        }
        .gps-ok { background: #e2f0d9; color: #385723; }
        .gps-missing { background: #FFF2CC; color: #B25900; }
        .outlet-dist {
            font-size: 11px; font-weight: 700; margin-top: 6px;
            display: flex; align-items: center; gap: 4px;
            color: #005D41;
        }
        .outlet-dist.in-radius { color: #2E7D32; }
        .outlet-dist.far { color: #7B6F72; }
        .outlet-dist.unknown { color: #B25900; font-weight: 600; }
        .gps-loc-banner {
            margin: 0 0 12px; padding: 10px 12px;
            background: #EBF8F4; border: 1px solid #C2ECE0;
            border-radius: 10px; font-size: 12px; color: #005D41;
            display: flex; align-items: center; gap: 8px;
        }
        .gps-loc-banner.loading { background: #F7F9FA; border-color: #E0E0E0; color: #666; }

        .fab-wrap {
            position: fixed;
            bottom: 24px; right: calc(50% - 225px + 16px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        @media (max-width: 480px) { .fab-wrap { right: 16px; } }
        .fab-menu { display: none; flex-direction: column; align-items: flex-end; gap: 8px; }
        .fab-menu.open { display: flex; }
        .fab-option { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
        .fab-option-label {
            background: #fff; border: 1px solid var(--color-border); border-radius: 20px;
            padding: 6px 12px; font-size: 12px; font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); white-space: nowrap;
        }
        .fab-option-btn {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        .fab-option-btn.visit { background: #78B500; }
        .fab-option-btn.outlet { background: var(--color-accent); }
        .fab {
            position: static; width: 52px; height: 52px;
            background: #005D41; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(0,93,65,0.35);
            cursor: pointer; border: none; color: #fff; font-size: 22px;
            transition: transform 0.2s;
        }
        .fab.open { transform: rotate(45deg); }
        .fab-backdrop { display: none; position: fixed; inset: 0; z-index: 199; }
        .fab-backdrop.open { display: block; }
    </style>
</head>
<body style="background:#f7f9fa;">
<div class="mobile-wrapper">
    <div class="mobile-header">
        <button class="header-action" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <span class="header-title" id="pageTitle">Geo Tag Outlet</span>
        <div style="width:36px;"></div>
    </div>

    <!-- Search -->
    <div class="search-container" style="top:56px;">
        <div class="search-box">
            <i class="fas fa-search" style="color:var(--color-gray);"></i>
            <input type="text" id="searchInput" placeholder="Cari nama atau kode outlet..." oninput="renderList()"/>
        </div>
    </div>

    <!-- Filter Chips -->
    <div class="filter-chips">
        <div class="chip active" id="chipSemua" onclick="setFilter('semua')">Semua</div>
        <div class="chip" id="chipAktif" onclick="setFilter('Aktif')">Aktif</div>
        <div class="chip" id="chipPotential" onclick="setFilter('Potential')">Potential</div>
        <div class="chip" id="chipNoGps" onclick="setFilter('nogps')">⚠️ Belum GPS</div>
    </div>

    <div class="mobile-content no-nav">
        <div class="p-16" id="listContainer"></div>
    </div>
</div>

<!-- FAB Speed Dial -->
<div class="fab-backdrop" id="fabBackdrop" onclick="toggleFab(false)"></div>
<div class="fab-wrap">
    <div class="fab-menu" id="fabMenu">
        <a href="outlet_list.html?mode=pickVisit" class="fab-option">
            <span class="fab-option-label">Tambah Kunjungan</span>
            <span class="fab-option-btn visit"><i class="fas fa-route"></i></span>
        </a>
        <a href="outlet_add.html" class="fab-option">
            <span class="fab-option-label">Tambah Outlet Baru</span>
            <span class="fab-option-btn outlet"><i class="fas fa-store"></i></span>
        </a>
    </div>
    <button type="button" class="fab" id="fabMain" onclick="toggleFab()" aria-label="Menu tambah">
        <i class="fas fa-plus"></i>
    </button>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../../wwwroot/js/sfa-store.js"></script>
<script>
    let currentFilter = 'semua';
    let isGeoTagMode = false;
    let isPickVisitMode = false;
    let devicePos = null;
    let devicePosLoading = false;

    $(document).ready(function() {
        const params = new URLSearchParams(window.location.search);
        isGeoTagMode = params.get('mode') === 'geotag';
        isPickVisitMode = params.get('mode') === 'pickVisit';
        if (isGeoTagMode) {
            $('#pageTitle').text('Geo Tag Outlet');
            setFilter('nogps');
        } else if (isPickVisitMode) {
            $('#pageTitle').text('Pilih Outlet Kunjungan');
            document.title = 'Tambah Kunjungan - Falcon SFA Mobile';
            devicePosLoading = true;
            renderList();
            obtainGpsPosition().then(pos => {
                devicePos = pos;
                devicePosLoading = false;
                renderList();
            });
            return;
        } else {
            $('#pageTitle').text('Daftar Pelanggan');
        }
        renderList();
    });

    function obtainGpsPosition() {
        return new Promise(resolve => {
            const fallback = () => resolve({
                lat: -6.2088 + (Math.random() - 0.5) * 0.01,
                lng: 106.8290 + (Math.random() - 0.5) * 0.01
            });
            if (!navigator.geolocation) {
                setTimeout(fallback, 800);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                () => setTimeout(fallback, 600),
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 30000 }
            );
        });
    }

    function distanceForOutlet(c) {
        const hasGps = c.lat && c.lng && c.lat !== 0 && c.lng !== 0;
        if (!devicePos || !hasGps) return { distanceM: null, distanceLabel: null };
        const distanceM = SfaStore.haversineMeters(devicePos.lat, devicePos.lng, c.lat, c.lng);
        return { distanceM, distanceLabel: SfaStore.formatDistanceMeters(distanceM) };
    }

    function renderDistanceHtml(c) {
        if (!isPickVisitMode) return '';
        if (devicePosLoading) {
            return `<div class="outlet-dist far"><i class="fas fa-spinner fa-spin"></i> Menghitung jarak...</div>`;
        }
        if (!c.distanceLabel) {
            return `<div class="outlet-dist unknown"><i class="fas fa-exclamation-circle"></i> GPS outlet belum tersedia</div>`;
        }
        const inRadius = c.distanceM <= 100;
        const cls = inRadius ? 'in-radius' : 'far';
        const icon = inRadius ? 'fa-check-circle' : 'fa-location-arrow';
        const suffix = inRadius ? ' · dalam radius' : ' dari Anda';
        return `<div class="outlet-dist ${cls}"><i class="fas ${icon}"></i> ${c.distanceLabel}${suffix}</div>`;
    }

    function toggleFab(forceOpen) {
        const open = forceOpen === true ? true : forceOpen === false ? false : !$('#fabMenu').hasClass('open');
        $('#fabMenu').toggleClass('open', open);
        $('#fabBackdrop').toggleClass('open', open);
        $('#fabMain').toggleClass('open', open);
    }

    function setFilter(f) {
        currentFilter = f;
        $('.chip').removeClass('active');
        const map = { semua: 'chipSemua', Aktif: 'chipAktif', Potential: 'chipPotential', nogps: 'chipNoGps' };
        $(`#${map[f] || 'chipSemua'}`).addClass('active');
        renderList();
    }

    function resetOutletFilter() {
        $('#searchInput').val('');
        setFilter('semua');
    }

    function renderList() {
        const query = $('#searchInput').val().toLowerCase();
        const customers = SfaStore.getCustomers();
        const container = $('#listContainer');
        container.empty();

        const filtered = customers.filter(c => {
            const matchSearch = c.name.toLowerCase().includes(query) || c.id.toLowerCase().includes(query);
            if (!matchSearch) return false;
            if (currentFilter === 'Aktif') return c.status === 'Aktif';
            if (currentFilter === 'Potential') return c.status === 'Potential';
            if (currentFilter === 'nogps') return !(c.lat && c.lng && c.lat !== 0 && c.lng !== 0);
            return true;
        });

        if (filtered.length === 0) {
            const isFiltered = query !== '' || currentFilter !== 'semua';
            const resetBtn = isFiltered
                ? `<button class="empty-state-action" onclick="resetOutletFilter()"><i class="fas fa-rotate-left me-1"></i>Reset Filter</button>`
                : '';
            container.html(`<div class="empty-state"><i class="fas fa-map-marker-slash"></i><div>Tidak ada outlet ditemukan.</div>${resetBtn}</div>`);
            return;
        }

        let list = filtered.map(c => ({ ...c, ...distanceForOutlet(c) }));
        if (isPickVisitMode && devicePos && !devicePosLoading) {
            list.sort((a, b) => {
                if (a.distanceM == null) return 1;
                if (b.distanceM == null) return -1;
                return a.distanceM - b.distanceM;
            });
        }

        if (isPickVisitMode) {
            const bannerClass = devicePosLoading ? 'gps-loc-banner loading' : 'gps-loc-banner';
            const bannerIcon = devicePosLoading ? 'fa-spinner fa-spin' : 'fa-crosshairs';
            const bannerText = devicePosLoading
                ? 'Mendeteksi lokasi perangkat...'
                : 'Outlet diurutkan dari yang terdekat dengan lokasi Anda';
            container.append(`<div class="${bannerClass}"><i class="fas ${bannerIcon}"></i> ${bannerText}</div>`);
        }

        list.forEach(c => {
            const hasGps = (c.lat && c.lng && c.lat !== 0 && c.lng !== 0);
            const gpsBadge = hasGps
                ? `<span class="gps-badge gps-ok"><i class="fas fa-check-circle me-1"></i>GPS OK</span>`
                : `<span class="gps-badge gps-missing"><i class="fas fa-exclamation-triangle me-1"></i>Belum GPS</span>`;

            const statusBadge = c.status === 'Aktif'
                ? `<span class="badge-mobile badge-mobile-success">${c.status}</span>`
                : `<span class="badge-mobile badge-mobile-warning">${c.status}</span>`;

            const imgUrl = c.imageUrl || '../../wwwroot/assets/images/img_not_found.jpg';

            const detailHref = isPickVisitMode
                ? `visit_detail.html?id=${c.id}`
                : `outlet_detail.html?id=${c.id}`;

            container.append(`
                <a href="${detailHref}" class="outlet-card">
                    <div class="outlet-img-container">
                        <img src="${imgUrl}" alt="${c.name}" onerror="this.src='../../wwwroot/assets/images/img_not_found.jpg'"/>
                    </div>
                    <div class="outlet-info-container">
                        <div class="outlet-header" style="margin-bottom: 4px;">
                            <div style="min-width:0;">
                                <div class="outlet-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${c.name}</div>
                                <div class="outlet-meta" style="margin-top: 1px;">
                                    <span>${c.id}</span> •
                                    <span>${c.channel || 'GT'}</span>
                                </div>
                            </div>
                            <div class="text-end d-flex flex-column gap-1 align-items-end" style="flex-shrink:0;">
                                ${statusBadge}
                                ${gpsBadge}
                            </div>
                        </div>
                        <div class="outlet-meta" style="margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">
                            <i class="fas fa-map-marker-alt" style="color:var(--color-primary); margin-right: 4px;"></i>
                            ${c.address || ''}, ${c.kota}
                        </div>
                        ${renderDistanceHtml(c)}
                    </div>
                </a>
            `);
        });
    }
</script>
</body>
</html>
